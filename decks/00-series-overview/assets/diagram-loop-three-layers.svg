<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
<defs><style>text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}.h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}</style></defs>
<rect width="1024" height="768" fill="#FFF9F3"/>
<text x="512" y="64" text-anchor="middle" class="h" font-size="32" fill="#7C3527">ループは、速さの違う3層の入れ子</text>
<rect x="60" y="110" width="904" height="585" rx="32" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
<rect x="130" y="205" width="764" height="410" rx="28" fill="#F6E6CF" stroke="#D8B074" stroke-width="3"/>
<rect x="210" y="315" width="604" height="220" rx="24" fill="#DDEFEA" stroke="#247F7A" stroke-width="6"/>
<circle cx="102" cy="154" r="20" fill="#FFFFFF" stroke="#E5A692" stroke-width="3"/>
<text x="102" y="163" text-anchor="middle" class="h" font-size="24">3</text>
<text x="136" y="163" class="h" font-size="26">数時間〜数週間：周りの反応で見直す</text>
<circle cx="172" cy="249" r="20" fill="#FFFFFF" stroke="#D8B074" stroke-width="3"/>
<text x="172" y="258" text-anchor="middle" class="h" font-size="24">2</text>
<text x="206" y="258" class="h" font-size="26">数十分〜数時間：人間が方向づけ</text>
<circle cx="252" cy="359" r="20" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
<text x="252" y="368" text-anchor="middle" class="h" font-size="24">1</text>
<text x="286" y="368" class="h" font-size="26">数分：AIが自走</text>
<circle cx="136" cy="642" r="11" fill="#B44A32"/>
<rect x="124" y="654" width="24" height="28" rx="10" fill="#B44A32"/>
<text x="172" y="661" class="m" font-size="20">レビュー・試験公開 → 目標を更新</text>
<circle cx="206" cy="562" r="11" fill="#B44A32"/>
<rect x="194" y="574" width="24" height="28" rx="10" fill="#B44A32"/>
<text x="242" y="581" class="m" font-size="20">出来上がりを見て、方向を直す</text>
<rect x="286" y="420" width="68" height="46" rx="14" fill="#247F7A"/>
<text x="320" y="450" text-anchor="middle" class="h w" font-size="22">AI</text>
<text x="376" y="448" class="m" font-size="19">作る→確かめる→直す を自分で回す</text>
<text x="984" y="748" text-anchor="end" class="m" font-size="16">整理：Andrew Ng氏（参考動画より）</text>
</svg>