<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 14L8 2l6 12z" fill="#B44A32"/>
    </marker>
  </defs>

  <!-- 上段: 5つの部品チップ -->
  <g>
    <rect x="40" y="44" width="196" height="180" rx="22" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="3"/>
    <circle cx="72" cy="78" r="19" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="72" y="86" text-anchor="middle" class="h" font-size="23" fill="#7C3527">1</text>
    <text x="102" y="86" class="h" font-size="27">やること</text>
    <text x="60" y="128" class="m" font-size="19">（何をする）</text>
    <line x1="60" y1="144" x2="216" y2="144" stroke="#EDC9B4" stroke-width="2"/>
    <text x="60" y="176" class="m" font-size="18">例：要約・翻訳</text>
  </g>
  <g>
    <rect x="256" y="44" width="196" height="180" rx="22" fill="#FFF0E7" stroke="#E8BBAA" stroke-width="3"/>
    <circle cx="288" cy="78" r="19" fill="#FFFFFF" stroke="#E8BBAA" stroke-width="3"/>
    <text x="288" y="86" text-anchor="middle" class="h" font-size="23" fill="#7C3527">2</text>
    <text x="318" y="86" class="h" font-size="27">なぜ</text>
    <text x="276" y="128" class="m" font-size="19">（なぜ使う）</text>
    <line x1="276" y1="144" x2="432" y2="144" stroke="#E8BBAA" stroke-width="2"/>
    <text x="276" y="176" class="m" font-size="18">例：社内共有用</text>
  </g>
  <g>
    <rect x="472" y="44" width="196" height="180" rx="22" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
    <circle cx="504" cy="78" r="19" fill="#FFFFFF" stroke="#E5A692" stroke-width="3"/>
    <text x="504" y="86" text-anchor="middle" class="h" font-size="23" fill="#7C3527">3</text>
    <text x="534" y="86" class="h" font-size="27">材料</text>
    <text x="492" y="128" class="m" font-size="19">（何を読む）</text>
    <line x1="492" y1="144" x2="648" y2="144" stroke="#E5A692" stroke-width="2"/>
    <text x="492" y="176" class="m" font-size="18">例：メモや資料</text>
  </g>
  <g>
    <rect x="688" y="44" width="196" height="180" rx="22" fill="#F6E6CF" stroke="#DCB26B" stroke-width="3"/>
    <circle cx="720" cy="78" r="19" fill="#FFFFFF" stroke="#DCB26B" stroke-width="3"/>
    <text x="720" y="86" text-anchor="middle" class="h" font-size="23" fill="#7C3527">4</text>
    <text x="750" y="86" class="h" font-size="27">返し方</text>
    <text x="708" y="128" class="m" font-size="19">（どう返す）</text>
    <line x1="708" y1="144" x2="864" y2="144" stroke="#DCB26B" stroke-width="2"/>
    <text x="708" y="176" class="m" font-size="18">例：箇条書き・表</text>
  </g>
  <g>
    <rect x="904" y="44" width="196" height="180" rx="22" fill="#FADFD5" stroke="#D98C72" stroke-width="3"/>
    <circle cx="936" cy="78" r="19" fill="#FFFFFF" stroke="#D98C72" stroke-width="3"/>
    <text x="936" y="86" text-anchor="middle" class="h" font-size="23" fill="#7C3527">5</text>
    <text x="966" y="86" class="h" font-size="27">守ること</text>
    <text x="924" y="128" class="m" font-size="19">（何を守る）</text>
    <line x1="924" y1="144" x2="1080" y2="144" stroke="#D98C72" stroke-width="2"/>
    <text x="924" y="176" class="m" font-size="18">例：文字数など</text>
  </g>

  <!-- 収束する矢印: 5チップ → 書類カード -->
  <path d="M138,224 Q294,266 450,306" stroke="#B44A32" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M354,224 Q432,266 510,306" stroke="#B44A32" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M570,224 L570,304" stroke="#B44A32" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M786,224 Q708,266 630,306" stroke="#B44A32" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1002,224 Q846,266 690,306" stroke="#B44A32" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- 中段: 組み立てたプロンプト（書類カード） -->
  <g>
    <rect x="260" y="310" width="620" height="250" rx="30" fill="#7C3527"/>
    <!-- 書類アイコン -->
    <rect x="300" y="336" width="26" height="32" rx="4" fill="#FFF9F3"/>
    <path d="M319 336 L326 343 L319 343 Z" fill="#D98C72"/>
    <line x1="306" y1="349" x2="320" y2="349" stroke="#B44A32" stroke-width="2"/>
    <line x1="306" y1="356" x2="320" y2="356" stroke="#B44A32" stroke-width="2"/>
    <line x1="306" y1="363" x2="316" y2="363" stroke="#B44A32" stroke-width="2"/>
    <text x="340" y="362" class="h w" font-size="34">組み立てたプロンプト</text>

    <rect x="300" y="384" width="13" height="13" rx="3" fill="#EDC9B4"/>
    <text x="324" y="396"><tspan class="h" font-size="22" fill="#F0B498">#</tspan><tspan class="h w" font-size="22" dx="8">やること</tspan></text>

    <rect x="300" y="418" width="13" height="13" rx="3" fill="#E8BBAA"/>
    <text x="324" y="430"><tspan class="h" font-size="22" fill="#F0B498">#</tspan><tspan class="h w" font-size="22" dx="8">なぜ</tspan></text>

    <rect x="300" y="452" width="13" height="13" rx="3" fill="#E5A692"/>
    <text x="324" y="464"><tspan class="h" font-size="22" fill="#F0B498">#</tspan><tspan class="h w" font-size="22" dx="8">材料</tspan></text>

    <rect x="300" y="486" width="13" height="13" rx="3" fill="#DCB26B"/>
    <text x="324" y="498"><tspan class="h" font-size="22" fill="#F0B498">#</tspan><tspan class="h w" font-size="22" dx="8">返し方</tspan></text>

    <rect x="300" y="520" width="13" height="13" rx="3" fill="#D98C72"/>
    <text x="324" y="532"><tspan class="h" font-size="22" fill="#F0B498">#</tspan><tspan class="h w" font-size="22" dx="8">守ること</tspan></text>
  </g>

  <!-- 下段: 書類カード → AI → 的 -->
  <path d="M570,566 L570,603" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="519" y="598" width="8" height="12" fill="#B44A32"/>
    <rect x="613" y="598" width="8" height="12" fill="#B44A32"/>
    <rect x="485" y="610" width="170" height="140" rx="24" fill="#B44A32"/>
    <rect x="519" y="750" width="8" height="12" fill="#B44A32"/>
    <rect x="613" y="750" width="8" height="12" fill="#B44A32"/>
    <text x="570" y="698" text-anchor="middle" class="h w" font-size="44">AI</text>
  </g>

  <path d="M661,680 L706,680" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <circle cx="782" cy="680" r="64" fill="#FADFD5" stroke="#D98C72" stroke-width="3"/>
    <circle cx="782" cy="680" r="41" fill="#FFF9F3" stroke="#D98C72" stroke-width="2"/>
    <circle cx="782" cy="680" r="19" fill="#B44A32"/>
  </g>

  <text x="570" y="790" text-anchor="middle" class="h" font-size="28" fill="#7C3527">欲しい答えに近づく</text>

  <!-- 最下部の補足 -->
  <text x="570" y="832" text-anchor="middle" class="m" font-size="23">魔法の言い回しの暗記ではなく、入力の設計</text>
</svg>
