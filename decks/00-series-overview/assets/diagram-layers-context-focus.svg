<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}.accent{fill:#B44A32}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <rect x="40" y="28" width="944" height="712" rx="36" fill="#FFF2E8" stroke="#C17A27" stroke-width="3"/>
  <circle cx="82" cy="72" r="20" fill="#FFFFFF" stroke="#C17A27" stroke-width="3"/>
  <text x="82" y="81" text-anchor="middle" class="h" font-size="24">5</text>
  <text x="116" y="81" class="h" font-size="27">処理のつながり（グラフ）</text>

  <rect x="82" y="110" width="860" height="586" rx="32" fill="#FCE9DC" stroke="#F0B498" stroke-width="3"/>
  <circle cx="124" cy="154" r="20" fill="#FFFFFF" stroke="#F0B498" stroke-width="3"/>
  <text x="124" y="163" text-anchor="middle" class="h" font-size="24">4</text>
  <text x="158" y="163" class="h" font-size="27">確認の繰り返し（ループ）</text>

  <rect x="124" y="192" width="776" height="460" rx="28" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
  <circle cx="166" cy="236" r="20" fill="#FFFFFF" stroke="#C17A27" stroke-width="3"/>
  <text x="166" y="245" text-anchor="middle" class="h" font-size="24">3</text>
  <text x="200" y="245" class="h" font-size="27">安全な環境（ハーネス）</text>

  <rect x="166" y="274" width="692" height="334" rx="26" fill="#B44A32" stroke="#7C3527" stroke-width="4"/>
  <circle cx="208" cy="318" r="21" fill="#FFFFFF"/>
  <text x="208" y="327" text-anchor="middle" class="h" font-size="25" fill="#B44A32">2</text>
  <text x="244" y="328" class="h w" font-size="30" fill="#FFFFFF">渡す情報（コンテキスト）</text>
  <rect x="666" y="292" width="172" height="48" rx="24" fill="#FFFFFF"/>
  <text x="752" y="324" text-anchor="middle" class="h" font-size="22" fill="#B44A32">今回はここ</text>

  <rect x="236" y="402" width="552" height="152" rx="24" fill="#FCE9DC" stroke="#F0B498" stroke-width="3"/>
  <circle cx="314" cy="478" r="25" fill="#FFFFFF" stroke="#F0B498" stroke-width="3"/>
  <text x="314" y="489" text-anchor="middle" class="h" font-size="30" fill="#2B211D">1</text>
  <text x="362" y="476" class="h" font-size="36" fill="#2B211D">頼み方（プロンプト）</text>
  <text x="362" y="516" class="m" font-size="23" fill="#6F5C52">1回の指示</text>


  <text x="512" y="724" text-anchor="middle" class="m" font-size="23">内側の指示を、外側の仕組みが包んで支える</text>
</svg>
