<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#460073"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A100FF"/></marker>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9BBF2"/></marker></defs>
<rect width="1024" height="768" fill="#FFFFFF"/>
<rect x="24" y="40" width="320" height="290" rx="24" fill="#FFFFFF" stroke="#A100FF" stroke-width="4"/>
<rect x="114" y="70" width="140" height="56" rx="28" fill="#460073"/>
<text x="184" y="108" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">設計</text>
<text x="184" y="172" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#460073">役割と終わりの条件を</text>
<text x="184" y="202" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#460073">決めていない</text>
<line x1="64" y1="230" x2="304" y2="230" stroke="#D9BBF2" stroke-width="3"/>
<text x="184" y="266" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" font-weight="600" fill="#6E6E7E">例：誰が最終承認するかを</text>
<text x="184" y="292" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" font-weight="600" fill="#6E6E7E">決めないまま始めた</text>
<rect x="352" y="40" width="320" height="290" rx="24" fill="#FFFFFF" stroke="#A100FF" stroke-width="4"/>
<rect x="442" y="70" width="140" height="56" rx="28" fill="#460073"/>
<text x="512" y="108" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">伝達</text>
<text x="512" y="172" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#460073">必要な情報が</text>
<text x="512" y="202" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#460073">届いていない</text>
<line x1="392" y1="230" x2="632" y2="230" stroke="#D9BBF2" stroke-width="3"/>
<text x="512" y="266" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" font-weight="600" fill="#6E6E7E">例：古い見積のまま</text>
<text x="512" y="292" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" font-weight="600" fill="#6E6E7E">次の担当へ渡っていた</text>
<rect x="680" y="40" width="320" height="290" rx="24" fill="#FFFFFF" stroke="#A100FF" stroke-width="4"/>
<rect x="770" y="70" width="140" height="56" rx="28" fill="#460073"/>
<text x="840" y="108" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">検証</text>
<text x="840" y="172" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#460073">合否の出し方が</text>
<text x="840" y="202" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#460073">間違っている</text>
<line x1="720" y1="230" x2="960" y2="230" stroke="#D9BBF2" stroke-width="3"/>
<text x="840" y="266" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" font-weight="600" fill="#6E6E7E">例：合計だけ見て</text>
<text x="840" y="292" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" font-weight="600" fill="#6E6E7E">桁の誤りを見落とした</text>
<rect x="24" y="366" width="976" height="374" rx="26" fill="#F7F0FC" stroke="#D9BBF2" stroke-width="3"/>
<text x="512" y="414" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#460073">直すべき場所は、おかしいと気づいた場所とは限りません</text>
<rect x="60" y="480" width="140" height="56" rx="16" fill="#FFFFFF" stroke="#D9BBF2" stroke-width="3"/><text x="130" y="515" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="700" fill="#6E6E7E">受け付け</text>
<rect x="250" y="480" width="140" height="56" rx="16" fill="#A100FF" stroke="#A100FF" stroke-width="3"/><text x="320" y="515" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">転記</text>
<text x="320" y="466" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="800" fill="#A100FF">本当の原因</text>
<rect x="440" y="480" width="140" height="56" rx="16" fill="#FFFFFF" stroke="#D9BBF2" stroke-width="3"/><text x="510" y="515" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="700" fill="#6E6E7E">照合</text>
<rect x="630" y="480" width="140" height="56" rx="16" fill="#FFFFFF" stroke="#D9BBF2" stroke-width="3"/><text x="700" y="515" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="700" fill="#6E6E7E">集計</text>
<rect x="820" y="480" width="140" height="56" rx="16" fill="#460073" stroke="#460073" stroke-width="3"/><text x="890" y="515" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">報告</text>
<text x="890" y="466" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="800" fill="#460073">気づくのはここ</text>
<path d="M 200 508 H 242" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#a1)"/>
<path d="M 390 508 H 432" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#a1)"/>
<path d="M 580 508 H 622" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#a1)"/>
<path d="M 770 508 H 812" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#a1)"/>
<path d="M 890 536 V 600 H 320 V 544" fill="none" stroke="#A100FF" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a2)"/>
<text x="605" y="634" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#A100FF">報告をいくら書き直しても、転記が直らなければ症状は消えない</text>
<text x="512" y="700" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#460073">だからまず、設計・伝達・検証のどれなのか、名前をつけてから直します</text>
</svg>