<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#460073"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9BBF2"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8E8E9C"/></marker></defs>
<rect width="1024" height="768" fill="#FFFFFF"/>
<rect x="32" y="76" width="440" height="400" rx="28" fill="#F4F4F6" stroke="#D6D6DE" stroke-width="3"/>
<text x="252" y="128" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="800" fill="#6E6E7E">その場の思いつきで呼ぶ</text>
<circle cx="140" cy="230" r="42" fill="#E4E4EA" stroke="#B9B9C4" stroke-width="4"/>
<circle cx="330" cy="200" r="42" fill="#E4E4EA" stroke="#B9B9C4" stroke-width="4"/>
<circle cx="240" cy="330" r="42" fill="#E4E4EA" stroke="#B9B9C4" stroke-width="4"/>
<path d="M 182 230 Q 240 180 288 200" fill="none" stroke="#8E8E9C" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a3)"/>
<path d="M 320 242 Q 300 300 282 320" fill="none" stroke="#8E8E9C" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a3)"/>
<path d="M 200 330 Q 130 340 120 288" fill="none" stroke="#8E8E9C" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a3)"/>
<text x="384" y="344" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="66" font-weight="800" fill="#B9B9C4">?</text>
<text x="252" y="420" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="600" fill="#6E6E7E">動いたけれど、</text>
<text x="252" y="452" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="600" fill="#6E6E7E">なぜ動いたのか説明できない</text>
<path d="M 484 276 H 540" fill="none" stroke="#460073" stroke-width="9" marker-end="url(#a1)"/>
<rect x="552" y="76" width="440" height="400" rx="28" fill="#F7F0FC" stroke="#A100FF" stroke-width="4"/>
<text x="772" y="128" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="800" fill="#460073">先に決めて、図にする</text>
<rect x="622" y="156" width="300" height="242" rx="18" fill="#FFFFFF" stroke="#A100FF" stroke-width="4"/>
<rect x="702" y="184" width="150" height="48" rx="24" fill="#460073"/>
<text x="777" y="216" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">受け付ける</text>
<rect x="702" y="256" width="150" height="48" rx="24" fill="#460073"/>
<text x="777" y="288" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">確かめる</text>
<rect x="702" y="328" width="150" height="48" rx="24" fill="#460073"/>
<text x="777" y="360" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">承認する</text>
<path d="M 777 232 V 250" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#a1)"/>
<path d="M 777 304 V 322" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#a1)"/>
<path d="M 702 280 H 664 V 208 H 696" fill="none" stroke="#A100FF" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a1)"/>
<text x="664" y="306" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17" font-weight="700" fill="#A100FF">差し戻し</text>
<text x="772" y="432" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#460073">同じ段取りで、もう一度動かせる</text>
<rect x="32" y="512" width="960" height="216" rx="26" fill="#460073"/>
<text x="512" y="566" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">図にしておくと、この3つができるようになります</text>
<rect x="38" y="600" width="300" height="72" rx="36" fill="#FFFFFF"/>
<text x="188" y="646" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="800" fill="#460073">もう一度、同じに動かせる</text>
<rect x="362" y="600" width="300" height="72" rx="36" fill="#FFFFFF"/>
<text x="512" y="646" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="800" fill="#460073">他の人に引き継げる</text>
<rect x="686" y="600" width="300" height="72" rx="36" fill="#FFFFFF"/>
<text x="836" y="646" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="800" fill="#460073">どこで失敗したか追える</text>
<text x="512" y="708" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="600" fill="#D9BBF2">これが「エンジニアリングする」ということ</text>
</svg>