<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="gArw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#460073"/>
    </marker>
  </defs>

  <rect width="1024" height="768" fill="#FFFFFF"/>

  <!-- 左：これではない -->
  <rect x="32" y="80" width="468" height="390" rx="28" fill="#F4F4F6" stroke="#D6D6DE" stroke-width="3"/>
  <text x="266" y="138" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="30" font-weight="800" fill="#6E6E7E">円グラフ・棒グラフ</text>

  <!-- 円グラフ -->
  <circle cx="176" cy="278" r="62" fill="#C9C9D2"/>
  <path d="M 176 278 L 176 216 A 62 62 0 0 1 229 309 Z" fill="#A9A9B6"/>
  <path d="M 176 278 L 229 309 A 62 62 0 0 1 130 316 Z" fill="#8E8E9C"/>
  <!-- 棒グラフ -->
  <rect x="300" y="278" width="34" height="62" fill="#C9C9D2"/>
  <rect x="346" y="238" width="34" height="102" fill="#A9A9B6"/>
  <rect x="392" y="208" width="34" height="132" fill="#8E8E9C"/>
  <line x1="288" y1="342" x2="438" y2="342" stroke="#8E8E9C" stroke-width="4"/>

  <!-- ばつ印 -->
  <line x1="108" y1="192" x2="428" y2="352" stroke="#6E6E7E" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  <line x1="428" y1="192" x2="108" y2="352" stroke="#6E6E7E" stroke-width="9" stroke-linecap="round" opacity="0.55"/>

  <text x="266" y="410" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="600" fill="#6E6E7E">データを見せるための絵</text>
  <text x="266" y="446" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#6E6E7E">こちらの話ではありません</text>

  <!-- 右：こちら -->
  <rect x="524" y="80" width="468" height="390" rx="28" fill="#F7F0FC" stroke="#A100FF" stroke-width="4"/>
  <text x="758" y="138" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="30" font-weight="800" fill="#460073">丸と矢印のグラフ</text>

  <rect x="692" y="156" width="132" height="52" rx="26" fill="#460073"/>
  <text x="758" y="190" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">受け付ける</text>

  <path d="M 758 208 V 232 H 648 V 248" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#gArw)"/>
  <path d="M 758 208 V 232 H 868 V 248" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#gArw)"/>

  <rect x="582" y="254" width="132" height="52" rx="26" fill="#FFFFFF" stroke="#A100FF" stroke-width="4"/>
  <text x="648" y="288" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#460073">調べる</text>
  <rect x="802" y="254" width="132" height="52" rx="26" fill="#FFFFFF" stroke="#A100FF" stroke-width="4"/>
  <text x="868" y="288" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#460073">書く</text>

  <path d="M 648 306 V 330 H 758 V 346" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#gArw)"/>
  <path d="M 868 306 V 330 H 758 V 346" fill="none" stroke="#460073" stroke-width="4" marker-end="url(#gArw)"/>

  <rect x="692" y="352" width="132" height="52" rx="26" fill="#A100FF"/>
  <text x="758" y="386" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">まとめる</text>

  <text x="758" y="452" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#460073">仕事のつながりを描く絵</text>

  <!-- 下帯 -->
  <rect x="32" y="506" width="960" height="234" rx="26" fill="#460073"/>
  <text x="512" y="562" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF">この丸と矢印で決めるのは、たった4つ</text>

  <rect x="67" y="596" width="200" height="70" rx="35" fill="#FFFFFF"/>
  <text x="167" y="640" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#460073">順番</text>
  <rect x="297" y="596" width="200" height="70" rx="35" fill="#FFFFFF"/>
  <text x="397" y="640" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#460073">分かれ道</text>
  <rect x="527" y="596" width="200" height="70" rx="35" fill="#FFFFFF"/>
  <text x="627" y="640" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#460073">同時に走る</text>
  <rect x="757" y="596" width="200" height="70" rx="35" fill="#FFFFFF"/>
  <text x="857" y="640" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#460073">戻り先</text>

  <text x="512" y="712" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="600" fill="#D9BBF2">この4つを自分で決めることが、グラフをつくるということ</text>
</svg>
