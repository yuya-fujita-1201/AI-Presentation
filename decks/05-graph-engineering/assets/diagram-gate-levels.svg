<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FADFD5"/></marker></defs>
<rect width="1024" height="768" fill="#FFF9F3"/>
<text x="512" y="74" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="33" font-weight="800" fill="#7C3527">右へ行くほど、止める力が強くなります</text>
<path d="M 120 116 H 904" fill="none" stroke="#FADFD5" stroke-width="12" stroke-linecap="round" marker-end="url(#a5)"/>
<rect x="57" y="480" width="220" height="180" rx="20" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
<text x="167" y="542" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="46" font-weight="800" fill="#7C3527">1</text>
<text x="167" y="592" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#7C3527">プロンプトの中で</text>
<text x="167" y="624" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#7C3527">まとめて指示する</text>
<text x="167" y="712" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#6F5C52">人が横で見ているとき</text>
<rect x="287" y="400" width="220" height="260" rx="20" fill="#FCE9DC" stroke="#F0B498" stroke-width="3"/>
<text x="397" y="462" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="46" font-weight="800" fill="#7C3527">2</text>
<text x="397" y="512" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#7C3527">目標条件にして</text>
<text x="397" y="544" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#7C3527">毎回、見直させる</text>
<text x="397" y="712" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#6F5C52">達成まで続けたいとき</text>
<rect x="517" y="310" width="220" height="350" rx="20" fill="#B44A32"/>
<text x="627" y="372" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">3</text>
<text x="627" y="422" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">通るまで、その場で</text>
<text x="627" y="454" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">終わらせない</text>
<text x="627" y="712" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#7C3527">無人で回すとき</text>
<rect x="747" y="210" width="220" height="450" rx="20" fill="#7C3527"/>
<text x="857" y="272" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">4</text>
<text x="857" y="322" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">経緯を知らない</text>
<text x="857" y="354" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">別のAIに反証させる</text>
<text x="857" y="712" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#7C3527">自己採点を避けたいとき</text>
