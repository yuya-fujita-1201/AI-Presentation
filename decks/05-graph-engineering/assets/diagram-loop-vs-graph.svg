<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B44A32"/>
    </marker>
    <marker id="arwP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3527"/>
    </marker>
  </defs>

  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 左パネル：ループ -->
  <rect x="32" y="96" width="468" height="504" rx="28" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
  <text x="266" y="158" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="38" font-weight="800" fill="#7C3527">ループ</text>
  <text x="266" y="200" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="600" fill="#6F5C52">1人が、同じ仕事を繰り返す</text>

  <!-- 3本の弧（時計回り） -->
  <path d="M 325 298 A 118 118 0 0 1 377 440" fill="none" stroke="#B44A32" stroke-width="6" stroke-linecap="round" marker-end="url(#arwA)"/>
  <path d="M 325 502 A 118 118 0 0 1 190 490" fill="none" stroke="#B44A32" stroke-width="6" stroke-linecap="round" marker-end="url(#arwA)"/>
  <path d="M 150 420 A 118 118 0 0 1 226 289" fill="none" stroke="#B44A32" stroke-width="6" stroke-linecap="round" marker-end="url(#arwA)"/>

  <!-- 中心ノード -->
  <rect x="181" y="368" width="170" height="64" rx="16" fill="#7C3527"/>
  <text x="266" y="409" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">担当は1人</text>

  <!-- 3つのラベル -->
  <rect x="214" y="260" width="104" height="44" rx="22" fill="#FFFFFF" stroke="#B44A32" stroke-width="3"/>
  <text x="266" y="290" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="700" fill="#7C3527">試す</text>
  <rect x="316" y="437" width="104" height="44" rx="22" fill="#FFFFFF" stroke="#B44A32" stroke-width="3"/>
  <text x="368" y="467" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="700" fill="#7C3527">見る</text>
  <rect x="112" y="437" width="104" height="44" rx="22" fill="#FFFFFF" stroke="#B44A32" stroke-width="3"/>
  <text x="164" y="467" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="700" fill="#7C3527">直す</text>

  <text x="266" y="558" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#7C3527">増えるのは、回した回数</text>

  <!-- 右パネル：グラフ -->
  <rect x="524" y="96" width="468" height="504" rx="28" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
  <text x="758" y="158" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="38" font-weight="800" fill="#7C3527">グラフ</text>
  <text x="758" y="200" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="600" fill="#6F5C52">何人かで、分けて受け渡す</text>

  <rect x="668" y="228" width="180" height="60" rx="16" fill="#7C3527"/>
  <text x="758" y="266" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">配る役</text>

  <path d="M 758 288 V 324 H 608 V 350" fill="none" stroke="#7C3527" stroke-width="4" marker-end="url(#arwP)"/>
  <path d="M 758 288 V 350" fill="none" stroke="#7C3527" stroke-width="4" marker-end="url(#arwP)"/>
  <path d="M 758 288 V 324 H 908 V 350" fill="none" stroke="#7C3527" stroke-width="4" marker-end="url(#arwP)"/>

  <rect x="543" y="356" width="130" height="60" rx="16" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
  <text x="608" y="394" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#7C3527">調べる</text>
  <rect x="693" y="356" width="130" height="60" rx="16" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
  <text x="758" y="394" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#7C3527">書く</text>
  <rect x="843" y="356" width="130" height="60" rx="16" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
  <text x="908" y="394" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#7C3527">確かめる</text>

  <path d="M 608 416 V 452 H 758 V 484" fill="none" stroke="#7C3527" stroke-width="4" marker-end="url(#arwP)"/>
  <path d="M 758 416 V 484" fill="none" stroke="#7C3527" stroke-width="4" marker-end="url(#arwP)"/>
  <path d="M 908 416 V 452 H 758 V 484" fill="none" stroke="#7C3527" stroke-width="4" marker-end="url(#arwP)"/>

  <rect x="668" y="490" width="180" height="60" rx="16" fill="#B44A32"/>
  <text x="758" y="528" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">まとめる</text>

  <text x="758" y="580" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#7C3527">増えるのは、担当と受け渡し</text>

  <!-- 下帯 -->
  <rect x="32" y="622" width="960" height="112" rx="26" fill="#7C3527"/>
  <text x="512" y="672" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF">グラフの中では、担当ひとりひとりがループを回している</text>
  <text x="512" y="712" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="600" fill="#FADFD5">乗り換えではなく、重ねて使う</text>
</svg>
