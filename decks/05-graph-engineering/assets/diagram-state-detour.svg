<path d="M 372 314 V 296" fill="none" stroke="#B44A32" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<rect x="76" y="314" width="112" height="56" rx="16" fill="#7C3527"/><text x="132" y="348" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">受け取る</text>
<rect x="196" y="314" width="112" height="56" rx="16" fill="#7C3527"/><text x="252" y="348" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">読み取る</text>
<rect x="316" y="314" width="112" height="56" rx="16" fill="#7C3527"/><text x="372" y="348" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">照合する</text>
<text x="252" y="420" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#7C3527">どのノードからも、見にいける</text>
<text x="252" y="456" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="600" fill="#6F5C52">（これが「状態」）</text>
<rect x="552" y="76" width="440" height="420" rx="28" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
<text x="772" y="132" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="800" fill="#7C3527">迂回路</text>
<rect x="677" y="167" width="190" height="58" rx="16" fill="#7C3527"/><text x="772" y="203" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">照合する</text>
<path d="M 772 225 V 262 H 672 V 300" fill="none" stroke="#7C3527" stroke-width="4" marker-end="url(#a1)"/>
<path d="M 772 225 V 262 H 872 V 300" fill="none" stroke="#B44A32" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a2)"/>
