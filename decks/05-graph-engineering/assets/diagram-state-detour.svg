<rect x="587" y="301" width="170" height="58" rx="16" fill="#FFFFFF" stroke="#7C3527" stroke-width="4"/><text x="672" y="336" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#7C3527">計上する</text>
<rect x="787" y="301" width="170" height="58" rx="16" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/><text x="872" y="336" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#B44A32">人が確かめる</text>
<text x="772" y="420" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#7C3527">点線を描いていない図は、</text>
<text x="772" y="456" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#7C3527">失敗した瞬間に止まります</text>
<rect x="32" y="530" width="960" height="200" rx="26" fill="#7C3527"/>
<text x="512" y="588" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF">正常系だけの図は、設計としてはまだ半分です</text>
<text x="512" y="644" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">読み取りに失敗したら人間へ。金額が合わなければ差し戻す。</text>
<text x="512" y="698" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="600" fill="#FADFD5">失敗したときの線まで描いて、はじめて設計になります</text>
