<text x="376" y="254" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="15" font-weight="700" fill="#7C3527">確度：低</text>
<path d="M 132 314 V 296" fill="none" stroke="#B44A32" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a2)"/>
