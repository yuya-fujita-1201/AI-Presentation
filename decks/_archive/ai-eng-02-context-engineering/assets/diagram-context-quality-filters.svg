<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7C3527"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="90" text-anchor="middle" class="h" font-size="38">文脈に入れる前の4つのフィルタ</text>

  <path d="M92 336H932" stroke="#7C3527" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="58" y="345" text-anchor="middle" class="h" font-size="23" fill="#7C3527">候補</text>
  <text x="970" y="345" text-anchor="middle" class="h" font-size="23" fill="#247F7A">採用</text>

  <g>
    <circle cx="218" cy="336" r="72" fill="#FADFD5" stroke="#B44A32" stroke-width="5"/>
    <text x="218" y="324" text-anchor="middle" class="h" font-size="25" fill="#B44A32">1</text>
    <text x="218" y="361" text-anchor="middle" class="h" font-size="28">必要性</text>
    <text x="218" y="447" text-anchor="middle" class="m" font-size="22">目的に必要か</text>
  </g>
  <g>
    <circle cx="414" cy="336" r="72" fill="#E1F2F0" stroke="#247F7A" stroke-width="5"/>
    <text x="414" y="324" text-anchor="middle" class="h" font-size="25" fill="#247F7A">2</text>
    <text x="414" y="361" text-anchor="middle" class="h" font-size="28">十分性</text>
    <text x="414" y="447" text-anchor="middle" class="m" font-size="22">判断に足りるか</text>
  </g>
  <g>
    <circle cx="610" cy="336" r="72" fill="#F6E6CF" stroke="#C17A27" stroke-width="5"/>
    <text x="610" y="324" text-anchor="middle" class="h" font-size="25" fill="#C17A27">3</text>
    <text x="610" y="361" text-anchor="middle" class="h" font-size="28">信頼性</text>
    <text x="610" y="447" text-anchor="middle" class="m" font-size="22">確かな情報か</text>
  </g>
  <g>
    <circle cx="806" cy="336" r="72" fill="#FCE9DC" stroke="#7C3527" stroke-width="5"/>
    <text x="806" y="324" text-anchor="middle" class="h" font-size="25" fill="#7C3527">4</text>
    <text x="806" y="361" text-anchor="middle" class="h" font-size="28">鮮度</text>
    <text x="806" y="447" text-anchor="middle" class="m" font-size="22">今も有効か</text>
  </g>

  <rect x="146" y="574" width="732" height="104" rx="28" fill="#7C3527"/>
  <text x="512" y="639" text-anchor="middle" class="h w" font-size="31" fill="#FFFFFF">4つを通った情報だけ、文脈へ入れる</text>
</svg>
