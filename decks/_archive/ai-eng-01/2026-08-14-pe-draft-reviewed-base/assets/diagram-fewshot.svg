<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="fa" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 1 L10 6 L2 11 Z" fill="#B44A32"/>
    </marker>
  </defs>

  <!-- 上段: 例なし -->
  <g>
    <text x="36" y="52" class="h" font-size="30">例なし（zero-shot）</text>
    <text x="356" y="50" class="m" font-size="22">分類名と対象だけを渡す</text>
    <rect x="36" y="78" width="380" height="150" rx="22" fill="#FCE9DC"/>
    <text x="68" y="124" class="h" font-size="24">指示だけ</text>
    <text x="68" y="166" font-size="22">「この声を、課題か要望に</text>
    <text x="68" y="198" font-size="22">　分類して」</text>
    <path d="M436 153 H 510" stroke="#B44A32" stroke-width="5" marker-end="url(#fa)" stroke-linecap="round"/>
    <circle cx="576" cy="153" r="44" fill="#7C3527"/>
    <text x="576" y="166" text-anchor="middle" class="w h" font-size="30">AI</text>
    <path d="M640 153 H 714" stroke="#B44A32" stroke-width="5" marker-end="url(#fa)" stroke-linecap="round"/>
    <rect x="734" y="78" width="370" height="150" rx="22" fill="#FFFFFF" stroke="#E8BBAA" stroke-width="3"/>
    <text x="766" y="126" font-size="22">（どこからが「課題」？）</text>
    <text x="766" y="162" font-size="22">判断基準はAIの推測まかせ。</text>
    <text x="766" y="196" font-size="22">人によってはズレる分類に</text>
  </g>

  <path d="M36 286 H 1104" stroke="#E8BBAA" stroke-width="3" stroke-dasharray="10 10"/>

  <!-- 下段: 例あり -->
  <g>
    <text x="36" y="352" class="h" font-size="30" fill="#247F7A">例あり（few-shot）</text>
    <text x="352" y="350" class="m" font-size="22">完成例をいくつか見せる</text>
    <rect x="36" y="380" width="380" height="300" rx="22" fill="#FFF2E8" stroke="#247F7A" stroke-width="3"/>
    <text x="68" y="426" class="h" font-size="24">指示＋お手本</text>
    <text x="68" y="468" font-size="21">「この声を、課題か要望に分類して」</text>
    <rect x="60" y="490" width="332" height="80" rx="14" fill="#F6E6CF"/>
    <text x="82" y="524" font-size="20">「ボタンを見つけにくい」</text>
    <text x="82" y="554" font-size="20" class="h">→ 課題</text>
    <rect x="60" y="584" width="332" height="80" rx="14" fill="#F6E6CF"/>
    <text x="82" y="618" font-size="20">「一覧を表のファイルで出したい」</text>
    <text x="82" y="648" font-size="20" class="h">→ 要望</text>
    <path d="M436 530 H 510" stroke="#B44A32" stroke-width="5" marker-end="url(#fa)" stroke-linecap="round"/>
    <circle cx="576" cy="530" r="44" fill="#7C3527"/>
    <text x="576" y="543" text-anchor="middle" class="w h" font-size="30">AI</text>
    <path d="M640 530 H 714" stroke="#B44A32" stroke-width="5" marker-end="url(#fa)" stroke-linecap="round"/>
    <rect x="734" y="430" width="370" height="200" rx="22" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
    <text x="766" y="480" class="h" font-size="23" fill="#247F7A">○ お手本と同じ基準で分類</text>
    <text x="766" y="522" font-size="21">見本の判断を手がかりに、</text>
    <text x="766" y="554" font-size="21">新しい文にも同じ物差しを</text>
    <text x="766" y="586" font-size="21">当てはめて返す</text>
  </g>

  <!-- 最下部メッセージ -->
  <rect x="120" y="762" width="900" height="56" rx="28" fill="#7C3527"/>
  <text x="570" y="799" text-anchor="middle" class="w h" font-size="25">言葉で説明しにくい判断基準は、完成例で見せる</text>
</svg>
