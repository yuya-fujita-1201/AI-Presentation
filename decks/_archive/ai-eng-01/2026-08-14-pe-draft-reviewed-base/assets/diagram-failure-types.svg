<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>

  <!-- 左上: 曖昧 -->
  <g>
    <rect x="20" y="20" width="540" height="360" rx="28" fill="#FCE9DC"/>
    <g transform="translate(56 52)">
      <rect width="120" height="76" rx="24" fill="none" stroke="#B44A32" stroke-width="4" stroke-dasharray="8 8"/>
      <path d="M28 76 L20 100 L52 76" fill="none" stroke="#B44A32" stroke-width="4" stroke-dasharray="8 8"/>
      <text x="38" y="52" class="h" font-size="30" fill="#B44A32">？？</text>
    </g>
    <text x="212" y="96" class="h" font-size="34">① 曖昧</text>
    <text x="212" y="140" class="m" font-size="23">指示がぼんやりしている</text>
    <text x="56" y="208" font-size="24">症状：答えもぼんやり返ってくる</text>
    <rect x="56" y="248" width="468" height="76" rx="20" fill="#7C3527"/>
    <text x="88" y="296" class="w h" font-size="25">直し方：やること・返し方を足す</text>
  </g>

  <!-- 右上: 詰め込み -->
  <g>
    <rect x="580" y="20" width="540" height="360" rx="28" fill="#F6E6CF"/>
    <g transform="translate(616 52)">
      <rect x="10" y="46" width="110" height="60" rx="10" fill="none" stroke="#C17A27" stroke-width="4"/>
      <rect x="20" y="18" width="70" height="16" rx="6" fill="#C17A27"/>
      <rect x="46" y="-4" width="70" height="16" rx="6" fill="#DCB26B" transform="rotate(12 46 -4)"/>
      <rect x="2" y="4" width="56" height="16" rx="6" fill="#DCB26B" transform="rotate(-14 2 4)"/>
    </g>
    <text x="772" y="96" class="h" font-size="34">② 詰め込み</text>
    <text x="772" y="140" class="m" font-size="23">関係ない情報が多すぎる</text>
    <text x="616" y="208" font-size="24">症状：大事な指示が埋もれる</text>
    <rect x="616" y="248" width="468" height="76" rx="20" fill="#7C3527"/>
    <text x="648" y="296" class="w h" font-size="25">直し方：関係ない背景を減らす</text>
  </g>

  <!-- 左下: お手本のズレ -->
  <g>
    <rect x="20" y="400" width="540" height="360" rx="28" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="3"/>
    <g transform="translate(56 432)">
      <rect width="64" height="84" rx="10" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
      <circle cx="32" cy="34" r="16" fill="none" stroke="#B44A32" stroke-width="4"/>
      <text x="14" y="76" class="m" font-size="16">見本</text>
      <rect x="84" width="64" height="84" rx="10" fill="#FFFFFF" stroke="#6F5C52" stroke-width="4"/>
      <path d="M116 16 L132 52 L100 52 Z" fill="none" stroke="#6F5C52" stroke-width="4"/>
      <text x="94" y="76" class="m" font-size="16">実物</text>
      <text x="60" y="112" class="h" font-size="24" fill="#A63D32">≠</text>
    </g>
    <text x="232" y="480" class="h" font-size="34">③ お手本のズレ</text>
    <text x="232" y="524" class="m" font-size="23">見せた例が実際と合っていない</text>
    <text x="56" y="592" font-size="24">症状：ズレた例に引っ張られる</text>
    <rect x="56" y="628" width="468" height="76" rx="20" fill="#7C3527"/>
    <text x="88" y="676" class="w h" font-size="25">直し方：本番に近い例へ替える</text>
  </g>

  <!-- 右下: 古い制約 -->
  <g>
    <rect x="580" y="400" width="540" height="360" rx="28" fill="#FADFD5"/>
    <g transform="translate(616 432)">
      <rect x="8" y="10" width="96" height="72" rx="8" fill="#FFFFFF" stroke="#C17A27" stroke-width="4"/>
      <path d="M24 30 H88 M24 48 H88 M24 66 H64" stroke="#DCB26B" stroke-width="5" stroke-linecap="round"/>
      <circle cx="118" cy="82" r="26" fill="#FFF9F3" stroke="#B44A32" stroke-width="4"/>
      <path d="M118 82 V64 M118 82 L131 90" stroke="#B44A32" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="792" y="480" class="h" font-size="34">④ 古い制約</text>
    <text x="792" y="524" class="m" font-size="23">昔のAI向けのルールが残っている</text>
    <text x="616" y="592" font-size="24">症状：今は不要な回避策が邪魔をする</text>
    <rect x="616" y="628" width="468" height="76" rx="20" fill="#7C3527"/>
    <text x="648" y="676" class="w h" font-size="25">直し方：AIが新しくなったら見直す</text>
  </g>

  <!-- 最下部メッセージ -->
  <rect x="120" y="788" width="900" height="56" rx="28" fill="#B44A32"/>
  <text x="570" y="825" text-anchor="middle" class="w h" font-size="25">分ければ、「足す・減らす・替える・見直す」を選べる</text>
</svg>
