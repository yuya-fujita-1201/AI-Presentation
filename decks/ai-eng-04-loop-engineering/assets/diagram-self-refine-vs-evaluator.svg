  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="70" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="800" fill="#7C3527">骨格は同じで、違うのは誰が評価するかです</text><rect x="60" y="145" width="430" height="450" rx="30" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/><text x="275" y="220" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#B44A32">Self-Refine</text><circle cx="118" cy="298" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="307" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">同一LLMが三役</text><circle cx="118" cy="380" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="389" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">フィードバックを次へ</text><circle cx="118" cy="462" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="471" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">満足まで反復</text><rect x="534" y="145" width="430" height="450" rx="30" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/><text x="749" y="220" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#247F7A">Evaluator-Optimizer</text><circle cx="592" cy="298" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="307" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">生成と評価を別呼び出し</text><circle cx="592" cy="380" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="389" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">全履歴＋feedback</text><circle cx="592" cy="462" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="471" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">PASSで終了</text><rect x="170" y="632" width="684" height="76" rx="24" fill="#7C3527" stroke="#7C3527" stroke-width="0"/><text x="512" y="681" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">共通項は『生成→評価→次の生成』</text>
