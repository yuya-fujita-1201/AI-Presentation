  <text x="512" y="70" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="800" fill="#7C3527">「繰り返し」から「ループ」へ</text><rect x="62" y="250" width="285" height="230" rx="28" fill="#FADFD5" stroke="#D99A5E" stroke-width="3"/><text x="204" y="335" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#7C3527">日常の繰り返し</text><text x="204" y="390" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">洗って</text><text x="204" y="420" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">干して</text><text x="204" y="450" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">また洗う</text><line x1="352" y1="365" x2="364" y2="365" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="369" y="250" width="285" height="230" rx="28" fill="#F6E6CF" stroke="#D99A5E" stroke-width="3"/><text x="511" y="335" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#7C3527">仕事の繰り返し</text><text x="511" y="390" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">作って</text><text x="511" y="420" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">見てもらい</text><text x="511" y="450" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">直す</text><line x1="659" y1="365" x2="671" y2="365" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="676" y="250" width="285" height="230" rx="28" fill="#247F7A" stroke="#247F7A" stroke-width="3"/><text x="818" y="335" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">この資料のループ</text><text x="818" y="390" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">AIが作って</text><text x="818" y="420" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">自分で確かめて</text><text x="818" y="450" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">直し続ける</text><text x="512" y="655" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#247F7A">どれも同じ繰り返しで、違うのは誰が回しているかだけです</text>
