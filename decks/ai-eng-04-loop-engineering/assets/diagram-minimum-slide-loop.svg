nt-weight="800" fill="#7C3527">JUDGE</text><text x="695" y="390" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">別担当が採点</text><line x1="781" y1="365" x2="793" y2="365" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="798" y="250" width="162" height="230" rx="28" fill="#247F7A" stroke="#247F7A" stroke-width="3"/><text x="879" y="335" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">STOP</text><text x="879" y="390" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">達成／3回／停滞</text><text x="512" y="655" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#247F7A">未達なら指摘を次へ渡し、上限に達したら人を呼びます</text>
