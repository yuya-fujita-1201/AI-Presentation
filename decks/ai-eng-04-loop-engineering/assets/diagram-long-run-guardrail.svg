ragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">証拠と人への通知</text><rect x="170" y="632" width="684" height="76" rx="24" fill="#7C3527" stroke="#7C3527" stroke-width="0"/><text x="512" y="681" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">自由にするために、制約を先に設計する</text>
