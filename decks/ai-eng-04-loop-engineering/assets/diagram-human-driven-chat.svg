" r="8" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="924" cy="317" r="8" fill="#FFFFFF" stroke="none" stroke-width="0"/><path d="M 872 347 Q 900 368 928 347" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><line x1="900" y1="272" x2="900" y2="242" stroke="#247F7A" stroke-width="7"/><circle cx="900" cy="233" r="9" fill="#D99A5E" stroke="none" stroke-width="0"/><text x="900" y="515" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#247F7A">AIは1回分だけ</text><line x1="840" y1="560" x2="210" y2="560" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="12 10"/><text x="512" y="620" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#B44A32">次の1回を始めるのも、終わりを決めるのも人間です</text>
