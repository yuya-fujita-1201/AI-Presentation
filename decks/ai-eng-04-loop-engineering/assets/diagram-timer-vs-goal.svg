  <text x="512" y="70" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="800" fill="#7C3527">同じ『loop』でも、止まり方が違う</text><rect x="60" y="145" width="430" height="450" rx="30" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/><text x="275" y="220" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#B44A32">時間駆動</text><circle cx="118" cy="298" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="307" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">決めた間隔で起動</text><circle cx="118" cy="380" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="389" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">前回の成否を問わない</text><circle cx="118" cy="462" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="471" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">ただ繰り返す</text><rect x="534" y="145" width="430" height="450" rx="30" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/><text x="749" y="220" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#247F7A">ゴール駆動</text><circle cx="592" cy="298" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="307" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">成功条件を先に定義</text><circle cx="592" cy="380" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="389" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">評価で次周を決める</text><circle cx="592" cy="462" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="471" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">達成か上限で止まる</text><rect x="170" y="632" width="684" height="76" rx="24" fill="#7C3527" stroke="#7C3527" stroke-width="0"/><text x="512" y="681" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">改善を重ねたいなら、必要なのは右側の条件付きループです</text>
