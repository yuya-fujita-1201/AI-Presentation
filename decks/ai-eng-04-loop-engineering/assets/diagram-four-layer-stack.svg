ght="800" fill="#FFFFFF">Loop</text><text x="856" y="390" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">反復の時間軸</text><text x="512" y="655" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#247F7A">ループでは、前の3層が動く順序と止め方を設計します</text>
