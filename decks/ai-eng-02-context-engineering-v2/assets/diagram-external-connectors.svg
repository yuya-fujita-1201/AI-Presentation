<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="740" viewBox="0 0 1024 740">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="ecAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B44A32"/>
    </marker>
    <marker id="ecPrimary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7C3527"/>
    </marker>
    <marker id="ecTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#247F7A"/>
    </marker>
  </defs>
  <rect width="1024" height="740" fill="#FFF9F3"/>

  <!-- 左上: ユーザーの依頼（吹き出し） -->
  <rect x="40" y="40" width="320" height="110" rx="20" fill="#FADFD5" stroke="#B44A32" stroke-width="3"/>
  <path d="M300 150L332 150L308 178Z" fill="#FADFD5" stroke="#B44A32" stroke-width="3" stroke-linejoin="round"/>
  <text x="200" y="88" text-anchor="middle" class="h" font-size="20">今日の未返信メールを</text>
  <text x="200" y="118" text-anchor="middle" class="h" font-size="20">まとめて</text>

  <path d="M336 100C380 105 410 108 434 110" fill="none" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#ecAccent)"/>
  <text x="386" y="90" text-anchor="middle" class="m" font-size="16">依頼</text>

  <!-- 中央: AI -->
  <rect x="440" y="55" width="140" height="110" rx="24" fill="#7C3527"/>
  <text x="510" y="122" text-anchor="middle" class="h w" font-size="34">AI</text>

  <path d="M510 167V226" fill="none" stroke="#7C3527" stroke-width="5" stroke-linecap="round" marker-end="url(#ecPrimary)"/>

  <!-- Gmailコネクター -->
  <rect x="350" y="230" width="320" height="220" rx="24" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
  <text x="510" y="262" text-anchor="middle" class="h" font-size="21">Gmailコネクター</text>

  <g opacity="0.55">
    <g transform="translate(372 278) rotate(-6)">
      <rect width="44" height="30" rx="4" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
      <path d="M2 3L22 18L42 3" fill="none" stroke="#9C8A7E" stroke-width="2"/>
    </g>
    <g transform="translate(430 270) rotate(4)">
      <rect width="44" height="30" rx="4" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
      <path d="M2 3L22 18L42 3" fill="none" stroke="#9C8A7E" stroke-width="2"/>
    </g>
    <g transform="translate(556 272) rotate(-4)">
      <rect width="44" height="30" rx="4" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
      <path d="M2 3L22 18L42 3" fill="none" stroke="#9C8A7E" stroke-width="2"/>
    </g>
    <g transform="translate(600 282) rotate(6)">
      <rect width="44" height="30" rx="4" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
      <path d="M2 3L22 18L42 3" fill="none" stroke="#9C8A7E" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(466 330)">
    <rect width="70" height="48" rx="6" fill="#FADFD5" stroke="#B44A32" stroke-width="3"/>
    <path d="M4 6L35 30L66 6" fill="none" stroke="#B44A32" stroke-width="3"/>
  </g>
  <text x="501" y="406" text-anchor="middle" class="h" font-size="18" fill="#B44A32">未返信</text>

  <path d="M670 340C706 300 718 262 736 218" fill="none" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#ecTeal)"/>

  <!-- 右: 今回のコンテキスト -->
  <rect x="740" y="140" width="244" height="170" rx="24" fill="#F6E6CF" stroke="#C17A27" stroke-width="4"/>
  <text x="862" y="190" text-anchor="middle" class="h" font-size="19">今回のコンテキスト</text>
  <line x1="764" y1="210" x2="960" y2="210" stroke="#E7CFA0" stroke-width="2"/>
  <text x="862" y="250" text-anchor="middle" class="h" font-size="20">メール本文が入る</text>

  <!-- 同じ仕組みの他コネクター -->
  <g opacity="0.6">
    <rect x="388" y="480" width="44" height="38" rx="6" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
    <rect x="388" y="480" width="44" height="12" rx="6" fill="#E4DCD3"/>
    <line x1="398" y1="474" x2="398" y2="486" stroke="#9C8A7E" stroke-width="3" stroke-linecap="round"/>
    <line x1="422" y1="474" x2="422" y2="486" stroke="#9C8A7E" stroke-width="3" stroke-linecap="round"/>
    <rect x="396" y="500" width="8" height="8" fill="#9C8A7E"/>
    <rect x="412" y="500" width="8" height="8" fill="#9C8A7E"/>
  </g>
  <text x="410" y="548" text-anchor="middle" class="m" font-size="16">カレンダー</text>

  <g opacity="0.6">
    <rect x="486" y="486" width="48" height="30" rx="6" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
    <circle cx="486" cy="501" r="6" fill="#FFF9F3" stroke="#9C8A7E" stroke-width="2"/>
    <circle cx="534" cy="501" r="6" fill="#FFF9F3" stroke="#9C8A7E" stroke-width="2"/>
    <line x1="510" y1="490" x2="510" y2="512" stroke="#9C8A7E" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
  <text x="510" y="548" text-anchor="middle" class="m" font-size="16">チケット</text>

  <g opacity="0.6">
    <ellipse cx="610" cy="484" rx="24" ry="8" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
    <rect x="586" y="484" width="48" height="24" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
    <ellipse cx="610" cy="508" rx="24" ry="8" fill="#FFFFFF" stroke="#9C8A7E" stroke-width="2"/>
  </g>
  <text x="610" y="548" text-anchor="middle" class="m" font-size="16">社内DB</text>

  <rect x="690" y="488" width="120" height="34" rx="17" fill="#F6E6CF" stroke="#C17A27" stroke-width="2"/>
  <text x="750" y="510" text-anchor="middle" font-size="16">同じ仕組み</text>

  <!-- 最下部: 注記 -->
  <rect x="60" y="610" width="904" height="70" rx="20" fill="#7C3527"/>
  <text x="512" y="653" text-anchor="middle" class="h w" font-size="20">権限の範囲内で取得／挙動は製品・設定で変わる</text>
</svg>
