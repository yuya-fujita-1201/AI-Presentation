<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- コンテキスト全体の枠 -->
  <rect x="40" y="36" width="944" height="588" rx="28" fill="#DDEFEA" fill-opacity="0.55" stroke="#247F7A" stroke-width="6"/>
  <text x="512" y="92" text-anchor="middle" class="h" font-size="34" fill="#247F7A">コンテキスト</text>
  <text x="512" y="132" text-anchor="middle" class="m" font-size="21">＝ 今回の推論でモデルが参照できる情報の集合</text>

  <!-- 左：あなたが渡す（プロンプト） -->
  <rect x="64" y="176" width="316" height="404" rx="22" fill="#FADFD5" stroke="#B44A32" stroke-width="5"/>
  <rect x="84" y="196" width="276" height="52" rx="14" fill="#B44A32"/>
  <text x="222" y="231" text-anchor="middle" class="h w" font-size="24" fill="#FFFFFF">あなたが都度渡す</text>
  <text x="222" y="302" text-anchor="middle" class="h" font-size="31" fill="#B44A32">プロンプト</text>
  <text x="222" y="338" text-anchor="middle" class="m" font-size="20">（あなたの問いかけ）</text>
  <text x="222" y="398" text-anchor="middle" font-size="23">質問・指示</text>
  <text x="222" y="440" text-anchor="middle" font-size="23">貼り付けた資料</text>
  <text x="222" y="482" text-anchor="middle" font-size="23">画像・ファイル</text>
  <text x="222" y="552" text-anchor="middle" class="m" font-size="19">シリーズ01で学んだ範囲</text>

  <!-- 右：システムが裏で足す -->
  <rect x="412" y="176" width="548" height="404" rx="22" fill="#FFFFFF" stroke="#247F7A" stroke-width="5"/>
  <rect x="432" y="196" width="508" height="52" rx="14" fill="#247F7A"/>
  <text x="686" y="231" text-anchor="middle" class="h w" font-size="22" fill="#FFFFFF">製品仕様や取得処理で加わる情報</text>
  <text x="686" y="292" text-anchor="middle" font-size="23">システム指示（役割の設定）</text>
  <text x="686" y="334" text-anchor="middle" font-size="23">ルール・指示ファイル（CLAUDE.md 等）</text>
  <text x="686" y="376" text-anchor="middle" font-size="23">これまでの会話履歴</text>
  <text x="686" y="418" text-anchor="middle" font-size="23">読み戻されたメモリ</text>
  <text x="686" y="460" text-anchor="middle" font-size="23">読み込まれたプロジェクト資料</text>
  <text x="686" y="502" text-anchor="middle" font-size="23">検索結果・ツールの実行結果</text>
  <text x="686" y="552" text-anchor="middle" class="m" font-size="18">保存・配置しただけでは、まだ入らない</text>

  <!-- 下部メッセージ -->
  <rect x="112" y="656" width="800" height="76" rx="24" fill="#7C3527"/>
  <text x="512" y="704" text-anchor="middle" class="h w" font-size="28" fill="#FFFFFF">プロンプトは、コンテキストの一部でしかない</text>
</svg>
