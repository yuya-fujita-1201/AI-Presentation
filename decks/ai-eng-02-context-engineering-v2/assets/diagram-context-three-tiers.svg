<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B44A32"/>
    </marker>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#247F7A"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B98A2F"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- ① 自動ロード -->
  <rect x="40" y="64" width="440" height="150" rx="22" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/>
  <text x="260" y="110" text-anchor="middle" class="h" font-size="24" fill="#247F7A">①自動ロード</text>
  <text x="260" y="150" text-anchor="middle" class="h" font-size="26">ルール・自動メモリ</text>
  <text x="260" y="184" text-anchor="middle" class="m" font-size="18">短く、毎回必要な情報</text>

  <!-- ② 必要時に取得 -->
  <rect x="40" y="256" width="440" height="176" rx="22" fill="#F6EAD9" stroke="#B98A2F" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="260" y="302" text-anchor="middle" class="h" font-size="24" fill="#B98A2F">②必要時に取得</text>
  <text x="260" y="342" text-anchor="middle" class="h" font-size="25">スキル・検索・関連記憶</text>
  <text x="260" y="376" text-anchor="middle" class="m" font-size="18">大きい・詳細・時々必要な情報</text>
  <text x="260" y="404" text-anchor="middle" class="m" font-size="16">正確な仕様は製品ごとに異なる</text>

  <!-- ③ 今回渡す -->
  <rect x="40" y="474" width="440" height="150" rx="22" fill="#FADFD5" stroke="#B44A32" stroke-width="5"/>
  <text x="260" y="520" text-anchor="middle" class="h" font-size="24" fill="#B44A32">③今回の依頼で渡す</text>
  <text x="260" y="560" text-anchor="middle" class="h" font-size="26">プロンプト</text>
  <text x="260" y="594" text-anchor="middle" class="m" font-size="18">質問・指示・添付資料として直接渡す</text>

  <!-- 右: AI -->
  <rect x="728" y="262" width="232" height="140" rx="26" fill="#FFFFFF" stroke="#7C3527" stroke-width="6"/>
  <text x="844" y="348" text-anchor="middle" class="h" font-size="44" fill="#7C3527">AI</text>
  <text x="844" y="440" text-anchor="middle" class="m" font-size="18">3経路の情報で判断する</text>

  <!-- 矢印 -->
  <line x1="486" y1="139" x2="718" y2="298" stroke="#247F7A" stroke-width="5" marker-end="url(#arrT)"/>
  <line x1="486" y1="344" x2="718" y2="336" stroke="#B98A2F" stroke-width="5" stroke-dasharray="4 7" marker-end="url(#arrG)"/>
  <line x1="486" y1="549" x2="718" y2="376" stroke="#B44A32" stroke-width="5" marker-end="url(#arrR)"/>

  <!-- 下部メッセージ -->
  <rect x="72" y="648" width="880" height="88" rx="24" fill="#7C3527"/>
  <text x="512" y="686" text-anchor="middle" class="h w" font-size="24" fill="#FFFFFF">コンテキストは「①自動・②必要時・③今回」の3経路</text>
  <text x="512" y="722" text-anchor="middle" font-size="20" style="fill:#F6C9B8">権限・フック・承認は、この外側のガードレール</text>
</svg>
