<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="740" viewBox="0 0 1024 740">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="okfPrimary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7C3527"/>
    </marker>
    <marker id="okfTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#247F7A"/>
    </marker>
    <marker id="okfGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#C17A27"/>
    </marker>
  </defs>
  <rect width="1024" height="740" fill="#FFF9F3"/>

  <!-- 背景: 未選択の候補ファイル群（淡色） -->
  <text x="844" y="28" text-anchor="middle" class="m" font-size="16">候補ファイルは複数</text>
  <g opacity="0.55">
    <g transform="translate(700 52) rotate(-8)">
      <path d="M0 0H20L28 8V40H0Z" fill="#FFFFFF" stroke="#C9BAB2" stroke-width="2"/>
      <path d="M20 0L28 8H20Z" fill="#E4DCD3" stroke="#C9BAB2" stroke-width="1.5"/>
    </g>
    <g transform="translate(950 48) rotate(7)">
      <path d="M0 0H20L28 8V40H0Z" fill="#FFFFFF" stroke="#C9BAB2" stroke-width="2"/>
      <path d="M20 0L28 8H20Z" fill="#E4DCD3" stroke="#C9BAB2" stroke-width="1.5"/>
    </g>
    <g transform="translate(690 128) rotate(6)">
      <path d="M0 0H20L28 8V40H0Z" fill="#FFFFFF" stroke="#C9BAB2" stroke-width="2"/>
      <path d="M20 0L28 8H20Z" fill="#E4DCD3" stroke="#C9BAB2" stroke-width="1.5"/>
    </g>
    <g transform="translate(958 138) rotate(-9)">
      <path d="M0 0H20L28 8V40H0Z" fill="#FFFFFF" stroke="#C9BAB2" stroke-width="2"/>
      <path d="M20 0L28 8H20Z" fill="#E4DCD3" stroke="#C9BAB2" stroke-width="1.5"/>
    </g>
    <g transform="translate(818 52) rotate(4)">
      <path d="M0 0H20L28 8V40H0Z" fill="#FFFFFF" stroke="#C9BAB2" stroke-width="2"/>
      <path d="M20 0L28 8H20Z" fill="#E4DCD3" stroke="#C9BAB2" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 選ばれた1ファイルだけ実線 -->
  <g transform="translate(818 78)">
    <path d="M0 0H36L48 12V66H0Z" fill="#FFFFFF" stroke="#C17A27" stroke-width="4"/>
    <path d="M36 0L48 12H36Z" fill="#F6E6CF" stroke="#C17A27" stroke-width="2.5"/>
    <circle cx="36" cy="52" r="13" fill="#247F7A"/>
    <path d="M29 52L34 58L44 45" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M842 148C842 168 880 178 900 186" fill="none" stroke="#C17A27" stroke-width="4" stroke-linecap="round" marker-end="url(#okfGold)"/>

  <!-- 3ボックス -->
  <rect x="40" y="190" width="280" height="230" rx="24" fill="#FCE9DC" stroke="#7C3527" stroke-width="4"/>
  <text x="180" y="238" text-anchor="middle" class="h" font-size="22">ルールファイル</text>
  <text x="180" y="264" text-anchor="middle" class="m" font-size="16">（CLAUDE.md）</text>
  <line x1="64" y1="282" x2="296" y2="282" stroke="#D9B49A" stroke-width="2"/>
  <rect x="56" y="298" width="248" height="98" rx="14" fill="#FFFFFF" stroke="#7C3527" stroke-width="2"/>
  <text x="180" y="330" text-anchor="middle" font-size="16">詳しくは</text>
  <text x="180" y="356" text-anchor="middle" class="h" font-size="16" fill="#B44A32">knowledge/index.md へ</text>

  <path d="M322 305H368" fill="none" stroke="#7C3527" stroke-width="5" stroke-linecap="round" marker-end="url(#okfPrimary)"/>

  <rect x="372" y="190" width="280" height="230" rx="24" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
  <text x="512" y="232" text-anchor="middle" class="h" font-size="22">index.md</text>
  <text x="512" y="256" text-anchor="middle" class="m" font-size="16">（ナビゲーション専用）</text>
  <line x1="396" y1="274" x2="628" y2="274" stroke="#B7D9D4" stroke-width="2"/>
  <circle cx="404" cy="299" r="3" fill="#247F7A"/>
  <text x="414" y="303" font-size="16">OKFとは → overview.md</text>
  <circle cx="404" cy="335" r="3" fill="#247F7A"/>
  <text x="414" y="339" font-size="16">ディレクトリ構造 →</text>
  <text x="414" y="361" font-size="16">directory-structure.md</text>

  <path d="M654 305H700" fill="none" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#okfTeal)"/>

  <rect x="704" y="190" width="280" height="230" rx="24" fill="#F6E6CF" stroke="#C17A27" stroke-width="4"/>
  <text x="844" y="232" text-anchor="middle" class="h" font-size="22">個別ファイル</text>
  <text x="844" y="256" text-anchor="middle" class="m" font-size="16">（1コンセプト＝1ファイル）</text>
  <line x1="728" y1="274" x2="960" y2="274" stroke="#E7CFA0" stroke-width="2"/>
  <rect x="728" y="290" width="232" height="90" rx="10" fill="#FFFFFF" stroke="#C17A27" stroke-width="2"/>
  <text x="744" y="318" font-size="16">type: Concept</text>
  <text x="744" y="346" class="m" font-size="16">description: ...</text>

  <!-- 横断メッセージ -->
  <rect x="60" y="470" width="904" height="110" rx="24" fill="#7C3527"/>
  <text x="512" y="515" text-anchor="middle" class="h w" font-size="18">本プロジェクトの実装：index → description → 必要なconcept</text>
  <text x="512" y="552" text-anchor="middle" class="h" font-size="18" style="fill:#F6C9B8">OKF v0.2の形式を参考。ロード機構は別に設計する</text>
</svg>
