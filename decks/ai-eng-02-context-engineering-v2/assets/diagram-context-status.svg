<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="82" text-anchor="middle" class="h" font-size="38">状況は4つに分けて渡す</text>
  <rect x="88" y="226" width="408" height="312" rx="28" fill="#FFFFFF" stroke="#D9B49A" stroke-width="4"/>
  <rect x="528" y="226" width="408" height="312" rx="28" fill="#FFFFFF" stroke="#D9B49A" stroke-width="4"/>
  <text x="292" y="278" text-anchor="middle" class="h" font-size="25" fill="#7C3527">時間を分ける</text>
  <text x="732" y="278" text-anchor="middle" class="h" font-size="25" fill="#7C3527">確度を分ける</text>

  <g>
    <circle cx="176" cy="356" r="58" fill="#FCE9DC" stroke="#7C3527" stroke-width="5"/>
    <text x="176" y="365" text-anchor="middle" class="h" font-size="27">経緯</text>
    <text x="176" y="474" text-anchor="middle" class="m" font-size="22">なぜ始まったか</text>
  </g>
  <g>
    <circle cx="392" cy="356" r="58" fill="#E1F2F0" stroke="#247F7A" stroke-width="5"/>
    <text x="392" y="365" text-anchor="middle" class="h" font-size="27">現在地</text>
    <text x="392" y="474" text-anchor="middle" class="m" font-size="22">どこまで進んだか</text>
  </g>
  <g>
    <circle cx="608" cy="356" r="58" fill="#F6E6CF" stroke="#C17A27" stroke-width="5"/>
    <text x="608" y="365" text-anchor="middle" class="h" font-size="27">確定</text>
    <text x="608" y="474" text-anchor="middle" class="m" font-size="22">誰が何を決めたか</text>
  </g>
  <g>
    <circle cx="824" cy="356" r="58" fill="#FADFD5" stroke="#B44A32" stroke-width="5"/>
    <text x="824" y="365" text-anchor="middle" class="h" font-size="27">未確認</text>
    <text x="824" y="474" text-anchor="middle" class="m" font-size="22">何が分からないか</text>
  </g>

  <rect x="142" y="594" width="740" height="104" rx="28" fill="#7C3527"/>
  <text x="512" y="658" text-anchor="middle" class="h w" font-size="31" fill="#FFFFFF">過去・現在・確定・未確認を混ぜない</text>
</svg>
