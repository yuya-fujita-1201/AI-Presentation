<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="mLinkFwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3527"/>
    </marker>
    <marker id="mLinkBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#7C3527"/>
    </marker>
    <marker id="mDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 上に小さく「相対リンク」（カード間の帯を避けるため、両カードの上に配置） -->
  <text x="530" y="100" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" fill="#6F5C52">相対リンク</text>

  <!-- カード1: 現在の答え（最濃） -->
  <g id="el-current">
    <rect x="60" y="120" width="440" height="300" rx="22" fill="#B44A32" stroke="#7C3527" stroke-width="3"/>
    <text x="84" y="168" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">requirements/F-012-受注登録.md</text>
    <text x="84" y="222" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">現在の答えは、ここ1か所</text>
    <text x="84" y="330" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" fill="#FFEDE3">書き換え直後は draft、確認後に stable</text>
    <text x="84" y="366" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" fill="#FFEDE3">古い記述は残さない</text>
  </g>

  <!-- カード1 → カード2 相互リンク（両端矢印） -->
  <path d="M 500 270 H 544" fill="none" stroke="#7C3527" stroke-width="4" marker-start="url(#mLinkBack)" marker-end="url(#mLinkFwd)"/>

  <!-- カード2: 決定記録（砂） -->
  <g id="el-decision">
    <rect x="544" y="120" width="420" height="300" rx="22" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="568" y="168" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" font-weight="700" fill="#7C3527">decisions/D-034-配送先の複数化.md</text>
    <text x="568" y="222" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="26" font-weight="700" fill="#2B211D">経緯は、決定記録に</text>
    <text x="568" y="330" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" fill="#6F5C52">いつ・誰が・なぜ・変更管理の番号</text>
    <text x="568" y="366" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" fill="#6F5C52">追記するだけ。消さない</text>
  </g>

  <!-- カード1下辺中央 → 帯上辺（点線） -->
  <path d="M 280 420 L 280 500" fill="none" stroke="#6F5C52" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mDashed)"/>

  <!-- 帯: Git の履歴 -->
  <g id="el-git">
    <rect x="60" y="500" width="904" height="120" rx="18" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
    <text x="90" y="568" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="700" fill="#7C3527">Git の履歴</text>
    <text x="380" y="568" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" fill="#6F5C52">上書き前の全文は、ここに残る。必要なときだけ見る</text>
  </g>
</svg>
