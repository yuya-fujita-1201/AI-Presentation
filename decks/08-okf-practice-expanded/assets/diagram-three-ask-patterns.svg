<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="80" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="800" fill="#7C3527">聞き方は、この3つの型のどれか</text>

  <!-- 型1: 調べる -->
  <g id="pattern-1">
    <rect x="40" y="130" width="296" height="330" rx="22" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
    <circle cx="188" cy="215" r="34" fill="none" stroke="#7C3527" stroke-width="6"/>
    <line x1="213" y1="240" x2="244" y2="271" stroke="#7C3527" stroke-width="8" stroke-linecap="round"/>
    <text x="188" y="340" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" font-weight="800" fill="#2B211D">調べる</text>
    <text x="188" y="382" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#6F5C52">目次から辿って教えて</text>
    <text x="188" y="412" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#6F5C52">根拠のファイル名も</text>
  </g>

  <!-- 型2: 作る -->
  <g id="pattern-2">
    <rect x="364" y="130" width="296" height="330" rx="22" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
    <rect x="474" y="176" width="76" height="96" rx="8" fill="#FFFFFF" stroke="#7C3527" stroke-width="5"/>
    <rect x="488" y="198" width="48" height="6" rx="3" fill="#B44A32"/>
    <rect x="488" y="214" width="48" height="6" rx="3" fill="#B44A32"/>
    <rect x="488" y="230" width="32" height="6" rx="3" fill="#B44A32"/>
    <line x1="548" y1="262" x2="576" y2="234" stroke="#7C3527" stroke-width="8" stroke-linecap="round"/>
    <text x="512" y="340" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" font-weight="800" fill="#2B211D">作る</text>
    <text x="512" y="382" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#6F5C52">ドラフトを作って</text>
    <text x="512" y="412" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#6F5C52">無かった部分は分けて</text>
  </g>

  <!-- 型3: 確かめる -->
  <g id="pattern-3">
    <rect x="688" y="130" width="296" height="330" rx="22" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
    <rect x="790" y="176" width="92" height="96" rx="8" fill="#FFFFFF" stroke="#7C3527" stroke-width="5"/>
    <polyline points="808,224 830,248 866,200" fill="none" stroke="#247F7A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="836" y="340" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" font-weight="800" fill="#2B211D">確かめる</text>
    <text x="836" y="382" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#6F5C52">矛盾や抜けがないか</text>
    <text x="836" y="412" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#6F5C52">確からしさも添えて</text>
  </g>

  <!-- 共通のコツ（最濃） -->
  <g id="common-tip">
    <rect x="40" y="520" width="944" height="150" rx="22" fill="#B44A32" stroke="#7C3527" stroke-width="4"/>
    <text x="512" y="580" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">「根拠のファイル名も添えて」</text>
    <text x="512" y="630" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" fill="#FFEDE3">3つの型すべてに、この一言を足す</text>
  </g>
</svg>
