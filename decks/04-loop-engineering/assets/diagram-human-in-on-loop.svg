  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="68" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="800" fill="#7C3527">輪の中にいる状態と、輪の外から見る状態</text><circle cx="305" cy="360" r="205" fill="#FADFD5" stroke="#B44A32" stroke-width="5"/><circle cx="305" cy="300" r="30" fill="#B44A32" stroke="none" stroke-width="0"/><path d="M 243 395 Q 305 330 367 395 L 367 426 L 243 426 Z" fill="#B44A32"/><text x="305" y="492" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#B44A32">Human in the Loop</text><text x="305" y="530" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="650" fill="#6F5C52">毎周レビューする</text><line x1="518" y1="360" x2="614" y2="360" stroke="#6F5C52" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="760" cy="360" r="180" fill="#DDEFEA" stroke="#247F7A" stroke-width="5"/><rect x="696" y="307" width="128" height="102" rx="24" fill="#247F7A" stroke="#247F7A" stroke-width="0"/><circle cx="736" cy="352" r="8" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="784" cy="352" r="8" fill="#FFFFFF" stroke="none" stroke-width="0"/><path d="M 732 382 Q 760 403 788 382" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><line x1="760" y1="307" x2="760" y2="277" stroke="#247F7A" stroke-width="7"/><circle cx="760" cy="268" r="9" fill="#D99A5E" stroke="none" stroke-width="0"/><circle cx="920" cy="165" r="30" fill="#B44A32" stroke="none" stroke-width="0"/><path d="M 858 260 Q 920 195 982 260 L 982 291 L 858 291 Z" fill="#B44A32"/><text x="760" y="578" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#247F7A">Human on the Loop</text><text x="760" y="616" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="650" fill="#6F5C52">外側から方向を監督する</text><text x="512" y="714" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#247F7A">口を出す回数が減り、見守る時間が増えます</text>
