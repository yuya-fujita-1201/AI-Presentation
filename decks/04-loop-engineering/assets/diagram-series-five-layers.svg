<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}.a{fill:#B44A32}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 第5層（最外）: 処理のつながり -->
  <rect x="40" y="28" width="944" height="712" rx="36" fill="#FFF2E8" stroke="#D8B074" stroke-width="3"/>
  <circle cx="82" cy="72" r="20" fill="#FFFFFF" stroke="#D8B074" stroke-width="3"/>
  <text x="82" y="81" text-anchor="middle" class="h" font-size="24">5</text>
  <text x="116" y="81" class="h" font-size="27">処理のつながり（グラフ）</text>
  <text x="565" y="80" class="m" font-size="20">順序・分岐・役割分担</text>

  <!-- 第4層: 確認の繰り返し = 今回の範囲 -->
  <rect x="82" y="110" width="860" height="586" rx="32" fill="#FADFD5" stroke="#B44A32" stroke-width="6"/>
  <circle cx="124" cy="154" r="20" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
  <text x="124" y="163" text-anchor="middle" class="h a" font-size="24">4</text>
  <text x="158" y="163" class="h a" font-size="28">確認の繰り返し（ループ）</text>
  <text x="545" y="162" class="a" font-size="20">作る→確かめる→直す</text>
  <rect x="738" y="124" width="170" height="48" rx="24" fill="#B44A32"/>
  <text x="823" y="156" text-anchor="middle" class="h w" font-size="22">今回はここ</text>

  <!-- 第3層: 安全な環境 -->
  <rect x="124" y="192" width="776" height="460" rx="28" fill="#F6E6CF" stroke="#D8B074" stroke-width="3"/>
  <circle cx="166" cy="236" r="20" fill="#FFFFFF" stroke="#D8B074" stroke-width="3"/>
  <text x="166" y="245" text-anchor="middle" class="h" font-size="24">3</text>
  <text x="200" y="245" class="h" font-size="27">安全な環境（ハーネス）</text>
  <text x="575" y="244" class="m" font-size="20">権限・ツール・実行環境</text>

  <!-- 第2層: 渡す情報 -->
  <rect x="166" y="274" width="692" height="334" rx="26" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
  <circle cx="208" cy="318" r="20" fill="#FFFFFF" stroke="#E5A692" stroke-width="3"/>
  <text x="208" y="327" text-anchor="middle" class="h" font-size="24">2</text>
  <text x="244" y="328" class="h" font-size="27">渡す情報（コンテキスト）</text>
  <text x="656" y="327" class="m" font-size="20">資料・前提</text>

  <!-- 第1層（中心）: 頼み方 -->
  <rect x="236" y="402" width="552" height="152" rx="24" fill="#7C3527"/>
  <circle cx="314" cy="478" r="25" fill="#FFFFFF"/>
  <text x="314" y="489" text-anchor="middle" class="h" font-size="30" fill="#7C3527">1</text>
  <text x="362" y="476" class="h w" font-size="36">頼み方（プロンプト）</text>
  <text x="362" y="516" class="w" font-size="23">1回の指示</text>

  <text x="512" y="724" text-anchor="middle" class="m" font-size="23">内側の指示を、外側の仕組みが包んで支える</text>
</svg>
