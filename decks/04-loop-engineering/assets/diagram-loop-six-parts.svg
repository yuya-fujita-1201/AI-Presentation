xt-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#247F7A">接続</text><text x="202" y="478" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">Connectors</text><text x="202" y="506" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">外部へ触れる</text><rect x="369" y="370" width="286" height="205" rx="26" fill="#FADFD5" stroke="#B44A32" stroke-width="3"/><text x="512" y="434" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#B44A32">分業</text><text x="512" y="478" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">Sub-agents</text><text x="512" y="506" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">作る／見るを分ける</text><rect x="679" y="370" width="286" height="205" rx="26" fill="#DDEFEA" stroke="#247F7A" stroke-width="3"/><text x="822" y="434" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="26" font-weight="800" fill="#247F7A">記憶</text><text x="822" y="478" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">Memory</text><text x="822" y="506" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">学びを次へ残す</text><text x="512" y="714" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="23" font-weight="800" fill="#247F7A">メモリーがないと、長いループは毎回ふりだしに戻ります</text>
