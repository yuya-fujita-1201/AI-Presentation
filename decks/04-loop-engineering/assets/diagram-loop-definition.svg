  <text x="512" y="70" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="800" fill="#7C3527">「打つ人」から「打つ仕組み」へ</text><rect x="60" y="145" width="430" height="450" rx="30" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/><text x="275" y="220" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#B44A32">これまで</text><circle cx="118" cy="298" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="307" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">人が次を指示</text><circle cx="118" cy="380" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="389" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">人が出来を読む</text><circle cx="118" cy="462" r="13" fill="#B44A32" stroke="none" stroke-width="0"/><text x="148" y="471" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">人が終わりを判断</text><rect x="534" y="145" width="430" height="450" rx="30" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/><text x="749" y="220" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#247F7A">ループ</text><circle cx="592" cy="298" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="307" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">条件が次を起動</text><circle cx="592" cy="380" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="389" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">チェックが合否を返す</text><circle cx="592" cy="462" r="13" fill="#247F7A" stroke="none" stroke-width="0"/><text x="622" y="471" text-anchor="start" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="650" fill="#2B211D">停止条件で終わる</text><rect x="170" y="632" width="684" height="76" rx="24" fill="#7C3527" stroke="#7C3527" stroke-width="0"/><text x="512" y="681" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">左の3つが、右では仕組みに置き換わります</text>
