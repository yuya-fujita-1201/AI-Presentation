<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs><style>
    .t{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#2B211D}.h{font-weight:700}.m{fill:#6F5C52}.w{fill:#fff}.line{stroke:#B44A32;stroke-width:6;fill:none;stroke-linecap:round}.dash{stroke:#C17A27;stroke-width:5;fill:none;stroke-dasharray:10 10}
  </style></defs>
  <rect width="1200" height="820" rx="46" fill="#FFF9F3"/>
  <rect x="58" y="64" width="1084" height="174" rx="30" fill="#FCE9DC"/>
  <text x="100" y="122" class="t m" font-size="28">あいまいな依頼</text>
  <text x="100" y="188" class="t h" font-size="47">「いい感じのToDo表を作って」</text>
  <path d="M600 250v78" class="line"/><path d="M575 305l25 27 25-27" class="line"/>
  <g>
    <rect x="55" y="360" width="338" height="235" rx="28" fill="#F6E6CF"/>
    <circle cx="105" cy="410" r="25" fill="#B44A32"/><text x="97" y="420" class="w h" font-size="28">1</text>
    <text x="145" y="420" class="t h" font-size="33">何をする？</text>
    <text x="92" y="486" class="t" font-size="28">タスクを抜き出す</text>
    <text x="92" y="532" class="t">動詞で伝える</text>
  </g>
  <g>
    <rect x="431" y="360" width="338" height="235" rx="28" fill="#FADFD5"/>
    <circle cx="481" cy="410" r="25" fill="#B44A32"/><text x="473" y="420" class="w h" font-size="28">2</text>
    <text x="521" y="420" class="t h" font-size="33">何を読む？</text>
    <text x="468" y="486" class="t" font-size="28">会議メモを渡す</text>
    <text x="468" y="532" class="t">材料を区切る</text>
  </g>
  <g>
    <rect x="807" y="360" width="338" height="235" rx="28" fill="#FFF0E7"/>
    <circle cx="857" cy="410" r="25" fill="#B44A32"/><text x="849" y="420" class="w h" font-size="28">3</text>
    <text x="897" y="420" class="t h" font-size="33">どう返す？</text>
    <text x="844" y="486" class="t" font-size="28">4列の表にする</text>
    <text x="844" y="532" class="t">未確認を見える化</text>
  </g>
  <rect x="118" y="660" width="964" height="96" rx="28" fill="#7C3527"/>
  <text x="600" y="719" text-anchor="middle" class="w h" font-size="30">3つを具体的にすると、AIの返事が「使える形」に近づく</text>
