<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
      .u{fill:#6F5C52;fill-opacity:0.5}
    </style>
  </defs>

  <!-- タイトル -->
  <text x="20" y="50" class="h" font-size="32" fill="#7C3527">5つの要素の使い分けマップ</text>

  <!-- 凡例 -->
  <g>
    <rect x="760" y="32" width="20" height="20" rx="6" fill="#7C3527"/>
    <text x="788" y="48" font-size="22">使う</text>
    <rect x="850" y="32" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="2"/>
    <text x="878" y="48" class="m" font-size="22">使わない</text>
  </g>

  <!-- 見出し行: ケース列 -->
  <rect x="20" y="90" width="250" height="42" rx="16" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
  <text x="145" y="117" text-anchor="middle" class="h" font-size="24" fill="#7C3527">やりたいこと</text>

  <!-- 見出し行: 5要素 -->
  <g>
    <rect x="290" y="90" width="154" height="42" rx="16" fill="#F6E6CF" stroke="#DCB26B" stroke-width="3"/>
    <text x="367" y="117" text-anchor="middle" class="h" font-size="24" fill="#7C3527">やること</text>
    <rect x="459" y="90" width="154" height="42" rx="16" fill="#F6E6CF" stroke="#DCB26B" stroke-width="3"/>
    <text x="536" y="117" text-anchor="middle" class="h" font-size="24" fill="#7C3527">なぜ</text>
    <rect x="628" y="90" width="154" height="42" rx="16" fill="#F6E6CF" stroke="#DCB26B" stroke-width="3"/>
    <text x="705" y="117" text-anchor="middle" class="h" font-size="24" fill="#7C3527">材料</text>
    <rect x="797" y="90" width="154" height="42" rx="16" fill="#F6E6CF" stroke="#DCB26B" stroke-width="3"/>
    <text x="874" y="117" text-anchor="middle" class="h" font-size="24" fill="#7C3527">返し方</text>
    <rect x="966" y="90" width="154" height="42" rx="16" fill="#F6E6CF" stroke="#DCB26B" stroke-width="3"/>
    <text x="1043" y="117" text-anchor="middle" class="h" font-size="24" fill="#7C3527">守ること</text>
  </g>

  <!-- ============ 行1: サッと頼む ============ -->
  <g>
    <rect x="20" y="160" width="1100" height="180" rx="26" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="3"/>
    <!-- ケースカード -->
    <rect x="20" y="174" width="250" height="140" rx="22" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
    <circle cx="46" cy="201" r="19" fill="#FFFFFF" stroke="#E5A692" stroke-width="3"/>
    <text x="46" y="209" text-anchor="middle" class="h" font-size="22" fill="#7C3527">1</text>
    <text x="40" y="246" class="h" font-size="25" fill="#7C3527">サッと頼む</text>
    <text x="40" y="276" class="m" font-size="22">（翻訳・言い換え）</text>

    <!-- 5要素チップ: やること=濃, 他=薄 -->
    <rect x="290" y="174" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="367" y="210" text-anchor="middle" class="h w" font-size="24">やること</text>
    <text x="367" y="254" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="459" y="174" width="154" height="100" rx="18" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="536" y="210" text-anchor="middle" class="h u" font-size="24">なぜ</text>
    <text x="536" y="252" text-anchor="middle" class="h u" font-size="28">－</text>

    <rect x="628" y="174" width="154" height="100" rx="18" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="705" y="210" text-anchor="middle" class="h u" font-size="24">材料</text>
    <text x="705" y="252" text-anchor="middle" class="h u" font-size="28">－</text>

    <rect x="797" y="174" width="154" height="100" rx="18" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="874" y="210" text-anchor="middle" class="h u" font-size="24">返し方</text>
    <text x="874" y="252" text-anchor="middle" class="h u" font-size="28">－</text>

    <rect x="966" y="174" width="154" height="100" rx="18" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="1043" y="210" text-anchor="middle" class="h u" font-size="24">守ること</text>
    <text x="1043" y="252" text-anchor="middle" class="h u" font-size="28">－</text>

    <text x="290" y="314" class="h" font-size="22" fill="#B44A32">→ 1行でよい</text>
  </g>

  <!-- ============ 行2: 資料を読ませる ============ -->
  <g>
    <rect x="20" y="360" width="1100" height="180" rx="26" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="3"/>
    <!-- ケースカード -->
    <rect x="20" y="374" width="250" height="140" rx="22" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
    <circle cx="46" cy="401" r="19" fill="#FFFFFF" stroke="#E5A692" stroke-width="3"/>
    <text x="46" y="409" text-anchor="middle" class="h" font-size="22" fill="#7C3527">2</text>
    <text x="40" y="446" class="h" font-size="25" fill="#7C3527">資料を読ませる</text>
    <text x="40" y="476" class="m" font-size="22">（要約・議事録）</text>

    <!-- 5要素チップ: やること・材料・返し方=濃, なぜ・守ること=薄 -->
    <rect x="290" y="374" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="367" y="410" text-anchor="middle" class="h w" font-size="24">やること</text>
    <text x="367" y="454" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="459" y="374" width="154" height="100" rx="18" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="536" y="410" text-anchor="middle" class="h u" font-size="24">なぜ</text>
    <text x="536" y="452" text-anchor="middle" class="h u" font-size="28">－</text>

    <rect x="628" y="374" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="705" y="410" text-anchor="middle" class="h w" font-size="24">材料</text>
    <text x="705" y="454" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="797" y="374" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="874" y="410" text-anchor="middle" class="h w" font-size="24">返し方</text>
    <text x="874" y="454" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="966" y="374" width="154" height="100" rx="18" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="1043" y="410" text-anchor="middle" class="h u" font-size="24">守ること</text>
    <text x="1043" y="452" text-anchor="middle" class="h u" font-size="28">－</text>

    <text x="290" y="514" class="h" font-size="22" fill="#B44A32">→ 材料の範囲を区切る</text>
  </g>

  <!-- ============ 行3: かっちり仕上げる ============ -->
  <g>
    <rect x="20" y="560" width="1100" height="180" rx="26" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="3"/>
    <!-- ケースカード -->
    <rect x="20" y="574" width="250" height="140" rx="22" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
    <circle cx="46" cy="601" r="19" fill="#FFFFFF" stroke="#E5A692" stroke-width="3"/>
    <text x="46" y="609" text-anchor="middle" class="h" font-size="22" fill="#7C3527">3</text>
    <text x="40" y="646" class="h" font-size="25" fill="#7C3527">かっちり仕上げる</text>
    <text x="40" y="676" class="m" font-size="22">（定型の仕事）</text>

    <!-- 5要素チップ: 全部濃 -->
    <rect x="290" y="574" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="367" y="610" text-anchor="middle" class="h w" font-size="24">やること</text>
    <text x="367" y="654" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="459" y="574" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="536" y="610" text-anchor="middle" class="h w" font-size="24">なぜ</text>
    <text x="536" y="654" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="628" y="574" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="705" y="610" text-anchor="middle" class="h w" font-size="24">材料</text>
    <text x="705" y="654" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="797" y="574" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="874" y="610" text-anchor="middle" class="h w" font-size="24">返し方</text>
    <text x="874" y="654" text-anchor="middle" class="h w" font-size="32">✓</text>

    <rect x="966" y="574" width="154" height="100" rx="18" fill="#7C3527"/>
    <text x="1043" y="610" text-anchor="middle" class="h w" font-size="24">守ること</text>
    <text x="1043" y="654" text-anchor="middle" class="h w" font-size="32">✓</text>

    <text x="290" y="714" class="h" font-size="22" fill="#B44A32">→ テンプレートにして使い回す</text>
  </g>

  <!-- 最下部メッセージバンド -->
  <rect x="20" y="760" width="1100" height="80" rx="30" fill="#B44A32"/>
  <text x="570" y="794" text-anchor="middle" class="w" font-size="22">毎回全部埋めない。</text>
  <text x="570" y="826" text-anchor="middle" class="h w" font-size="32">迷う仕事ほど要素を足す</text>
</svg>
