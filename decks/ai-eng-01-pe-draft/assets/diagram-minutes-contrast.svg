<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>

  <!-- お題バッジ -->
  <g>
    <rect x="350" y="16" width="440" height="56" rx="28" fill="#B44A32"/>
    <text x="570" y="53" text-anchor="middle" class="h w" font-size="26">お題：会議の議事録を作る</text>
  </g>

  <!-- ============ 上半分: 悪い例 ============ -->
  <rect x="20" y="90" width="1100" height="356" rx="32" fill="#FFF2E8" stroke="#A63D32" stroke-width="3"/>

  <!-- 見出し -->
  <g>
    <circle cx="100" cy="136" r="24" fill="#FFFFFF" stroke="#A63D32" stroke-width="3"/>
    <text x="100" y="146" text-anchor="middle" class="h" font-size="28" fill="#A63D32">×</text>
    <text x="140" y="146" class="h" font-size="29" fill="#A63D32">悪い例</text>
  </g>

  <!-- 役割タブ -->
  <rect x="294" y="172" width="84" height="34" rx="17" fill="#7C3527"/>
  <text x="336" y="196" text-anchor="middle" class="h w" font-size="22">指示</text>
  <rect x="838" y="172" width="84" height="34" rx="17" fill="#7C3527"/>
  <text x="880" y="196" text-anchor="middle" class="h w" font-size="22">出力</text>

  <!-- 吹き出し（悪い例の指示） -->
  <g>
    <rect x="56" y="216" width="560" height="150" rx="24" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <path d="M120 366 L112 376 L148 366 Z" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="336" y="300" text-anchor="middle" font-size="24">「この会議、いい感じにして」</text>
  </g>

  <!-- 矢印 -->
  <path d="M616 291 H666" stroke="#B44A32" stroke-width="5" stroke-linecap="round"/>
  <path d="M666 279 L680 291 L666 303 Z" fill="#B44A32"/>

  <!-- 出力ミニカード（悪い例） -->
  <g>
    <rect x="676" y="216" width="408" height="150" rx="20" fill="#F6E6CF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="700" y="250" font-size="22">感想文っぽい長い文章…</text>
    <g fill="none" stroke="#B3A399" stroke-width="5" stroke-linecap="round">
      <path d="M700 286 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0"/>
      <path d="M700 308 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0"/>
      <path d="M700 330 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0"/>
      <path d="M700 352 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0 q12 4 24 0 q12 -4 24 0"/>
    </g>
  </g>

  <!-- タグ（悪い例の教訓） -->
  <rect x="56" y="378" width="1028" height="44" rx="22" fill="#FFFFFF" stroke="#A63D32" stroke-width="3"/>
  <text x="570" y="405" text-anchor="middle" class="h" font-size="22" fill="#A63D32">何を残したのか分からない</text>

  <!-- 区切り線 -->
  <path d="M90 458 H1050" stroke="#C17A27" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- ============ 下半分: 良い例 ============ -->
  <rect x="20" y="470" width="1100" height="356" rx="32" fill="#FFF2E8" stroke="#247F7A" stroke-width="3"/>

  <!-- 見出し -->
  <g>
    <circle cx="100" cy="516" r="24" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
    <text x="100" y="526" text-anchor="middle" class="h" font-size="26" fill="#247F7A">○</text>
    <text x="140" y="526" class="h" font-size="29" fill="#247F7A">良い例</text>
  </g>

  <!-- 役割タブ -->
  <rect x="294" y="552" width="84" height="34" rx="17" fill="#7C3527"/>
  <text x="336" y="576" text-anchor="middle" class="h w" font-size="22">指示</text>
  <rect x="838" y="552" width="84" height="34" rx="17" fill="#7C3527"/>
  <text x="880" y="576" text-anchor="middle" class="h w" font-size="22">出力</text>

  <!-- 吹き出し（良い例の指示） -->
  <g>
    <rect x="56" y="596" width="560" height="150" rx="24" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <path d="M120 746 L112 756 L148 746 Z" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="336" y="680" text-anchor="middle" font-size="23">「決定事項・担当者・期限を抜き出して」</text>
  </g>

  <!-- 矢印 -->
  <path d="M616 671 H666" stroke="#B44A32" stroke-width="5" stroke-linecap="round"/>
  <path d="M666 659 L680 671 L666 683 Z" fill="#B44A32"/>

  <!-- 出力ミニカード（良い例） -->
  <g>
    <rect x="676" y="596" width="408" height="150" rx="20" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <circle cx="700" cy="629" r="4" fill="#247F7A"/>
    <text x="716" y="636" font-size="23"><tspan class="h">決定</tspan>：9月15日に公開</text>
    <circle cx="700" cy="667" r="4" fill="#247F7A"/>
    <text x="716" y="674" font-size="23"><tspan class="h">担当</tspan>：田中さん</text>
    <circle cx="700" cy="705" r="4" fill="#247F7A"/>
    <text x="716" y="712" font-size="23"><tspan class="h">期限</tspan>：次回会議まで</text>
  </g>

  <!-- タグ（良い例の教訓） -->
  <rect x="56" y="758" width="1028" height="44" rx="22" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
  <text x="570" y="785" text-anchor="middle" class="h" font-size="22" fill="#247F7A">動詞で頼むと、作業がはっきりする</text>
</svg>
