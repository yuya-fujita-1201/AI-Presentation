<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>

  <!-- ============ STEP 1: プロンプト（手がかり） ============ -->
  <rect x="40" y="20" width="1060" height="188" rx="32" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="3"/>
  <g>
    <circle cx="96" cy="66" r="27" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="96" y="77" text-anchor="middle" class="h" font-size="30" fill="#7C3527">1</text>
    <text x="140" y="76" class="h" font-size="29">プロンプト（手がかり）</text>
    <text x="522" y="75" class="m" font-size="22">AIに渡す質問や指示</text>
  </g>
  <!-- 質問カード -->
  <g>
    <rect x="258" y="112" width="624" height="80" rx="18" fill="#FFFFFF" stroke="#F0B498" stroke-width="3"/>
    <!-- 書類アイコン -->
    <rect x="286" y="132" width="42" height="52" rx="5" fill="#FCE9DC" stroke="#E5A692" stroke-width="2.5"/>
    <path d="M316 132 L328 132 L328 144 Z" fill="#FFFFFF" stroke="#E5A692" stroke-width="2" stroke-linejoin="round"/>
    <path d="M296 148 H316" stroke="#D98C72" stroke-width="3" stroke-linecap="round"/>
    <path d="M296 160 H318" stroke="#D98C72" stroke-width="3" stroke-linecap="round"/>
    <path d="M296 172 H310" stroke="#D98C72" stroke-width="3" stroke-linecap="round"/>
    <text x="352" y="162" class="h" font-size="31" fill="#7C3527">日本で一番高い山は？</text>
  </g>

  <!-- 矢印1 -->
  <g>
    <path d="M570 212 V244" stroke="#B44A32" stroke-width="5" stroke-linecap="round"/>
    <path d="M552 240 L570 268 L588 240 Z" fill="#B44A32"/>
  </g>

  <!-- ============ STEP 2: 続きそうな言葉を予測 ============ -->
  <rect x="40" y="252" width="1060" height="308" rx="34" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>
  <g>
    <circle cx="96" cy="298" r="27" fill="#FFFFFF" stroke="#E5A692" stroke-width="3"/>
    <text x="96" y="309" text-anchor="middle" class="h" font-size="30" fill="#7C3527">2</text>
    <text x="140" y="308" class="h" font-size="29">続きそうな言葉を予測</text>
    <text x="484" y="307" class="m" font-size="22">AIが確率の高い順に並べる</text>
  </g>
  <text x="1058" y="346" text-anchor="end" class="m" font-size="22">続きとして自然な言葉ほど選ばれやすい</text>

  <!-- AIチップ -->
  <g>
    <circle cx="150" cy="462" r="60" fill="#7C3527"/>
    <text x="150" y="475" text-anchor="middle" class="h w" font-size="36">AI</text>
  </g>
  <path d="M218 462 H252" stroke="#B44A32" stroke-width="5" stroke-linecap="round"/>
  <path d="M246 448 L272 462 L246 476 Z" fill="#B44A32"/>

  <!-- 候補1: 富士山（最有力） -->
  <g>
    <text x="286" y="406" text-anchor="middle" class="h" font-size="26" fill="#B44A32">◎</text>
    <text x="398" y="406" text-anchor="end" class="h" font-size="29" fill="#7C3527">富士山</text>
    <rect x="418" y="384" width="560" height="36" rx="18" fill="#B44A32"/>
  </g>

  <!-- 候補2: 北岳 -->
  <g>
    <text x="398" y="470" text-anchor="end" font-size="26">北岳</text>
    <rect x="418" y="448" width="300" height="36" rx="18" fill="#D98C72"/>
  </g>

  <!-- 候補3: 高い山 -->
  <g>
    <text x="398" y="534" text-anchor="end" font-size="26">高い山</text>
    <rect x="418" y="512" width="170" height="36" rx="18" fill="#F0B498"/>
  </g>

  <!-- 矢印2 -->
  <g>
    <path d="M570 564 V596" stroke="#B44A32" stroke-width="5" stroke-linecap="round"/>
    <path d="M552 592 L570 620 L588 592 Z" fill="#B44A32"/>
  </g>

  <!-- ============ STEP 3: 言葉をつなげて答えに ============ -->
  <rect x="40" y="604" width="1060" height="132" rx="28" fill="#F6E6CF" stroke="#DCB26B" stroke-width="3"/>
  <g>
    <circle cx="96" cy="650" r="27" fill="#FFFFFF" stroke="#DCB26B" stroke-width="3"/>
    <text x="96" y="661" text-anchor="middle" class="h" font-size="30" fill="#7C3527">3</text>
    <text x="140" y="660" class="h" font-size="29">言葉をつなげて答えに</text>
    <text x="500" y="659" class="m" font-size="22">選ばれた言葉を文にする</text>
  </g>
  <!-- 回答カード -->
  <g>
    <rect x="330" y="680" width="480" height="46" rx="23" fill="#7C3527"/>
    <text x="570" y="710" text-anchor="middle" class="h w" font-size="28">富士山です。</text>
  </g>

  <!-- ============ 補足メッセージバンド ============ -->
  <rect x="40" y="762" width="1060" height="74" rx="20" fill="#7C3527"/>
  <text x="570" y="808" text-anchor="middle" class="h w" font-size="27">プロンプトが変われば、選ばれる続きも変わる</text>
</svg>
