<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="690" viewBox="0 0 1580 690">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>

  <!-- お題バッジ -->
  <g>
    <rect x="470" y="12" width="640" height="66" rx="33" fill="#B44A32"/>
    <text x="790" y="54" text-anchor="middle" class="h w" font-size="28">お題：会議メモからToDo表を作る</text>
  </g>

  <!-- 中央区切り線 -->
  <path d="M790 92 V 664" stroke="#C17A27" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- ============ 左半分: 悪い例 ============ -->
  <rect x="40" y="100" width="730" height="564" rx="40" fill="#FADFD5" stroke="#D98C72" stroke-width="3"/>

  <!-- 見出し -->
  <g>
    <circle cx="108" cy="164" r="28" fill="#FFFFFF" stroke="#A63D32" stroke-width="3"/>
    <text x="108" y="176" text-anchor="middle" class="h" font-size="32" fill="#A63D32">×</text>
    <text x="154" y="176" class="h" font-size="36" fill="#A63D32">悪い例</text>
    <text x="284" y="176" font-size="24" fill="#6F5C52">（あいまいな指示）</text>
  </g>

  <!-- 吹き出し（指示） -->
  <g>
    <path d="M172 340 L182 380 L214 340 Z" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3" stroke-linejoin="round"/>
    <rect x="80" y="210" width="650" height="148" rx="24" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="405" y="295" text-anchor="middle" font-size="30">「いい感じのToDo表を作って」</text>
  </g>

  <!-- 矢印 -->
  <path d="M405 364 L405 412" stroke="#B44A32" stroke-width="6" stroke-linecap="round"/>
  <path d="M389 408 L421 408 L405 430 Z" fill="#B44A32"/>

  <!-- 出力イメージ: ぼんやりした2列表 -->
  <g>
    <rect x="80" y="430" width="650" height="156" rx="18" fill="#FFFFFF" stroke="#D98C72" stroke-width="3"/>
    <rect x="80" y="430" width="650" height="52" rx="18" fill="#FCE9DC"/>
    <rect x="80" y="456" width="650" height="26" fill="#FCE9DC"/>
    <line x1="480" y1="430" x2="480" y2="586" stroke="#D98C72" stroke-width="2"/>
    <line x1="80" y1="482" x2="730" y2="482" stroke="#D98C72" stroke-width="2"/>
    <line x1="80" y1="534" x2="730" y2="534" stroke="#D98C72" stroke-width="2"/>
    <text x="280" y="464" text-anchor="middle" class="h" font-size="26" fill="#6F5C52">やること</text>
    <text x="605" y="464" text-anchor="middle" class="h" font-size="26" fill="#6F5C52">メモ</text>
    <text x="280" y="516" text-anchor="middle" font-size="24" fill="#6F5C52">いろいろ確認する</text>
    <text x="605" y="516" text-anchor="middle" font-size="24" fill="#6F5C52">？</text>
    <text x="280" y="568" text-anchor="middle" font-size="24" fill="#6F5C52">あとで決める</text>
    <text x="605" y="568" text-anchor="middle" font-size="24" fill="#6F5C52">？</text>
  </g>

  <!-- タグ（悪い例の教訓） -->
  <rect x="80" y="606" width="650" height="54" rx="27" fill="#A63D32"/>
  <text x="405" y="642" text-anchor="middle" class="h w" font-size="26">中身があいまい → そのまま仕事に使えない</text>

  <!-- ============ 右半分: 良い例 ============ -->
  <rect x="810" y="100" width="730" height="564" rx="40" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="3"/>

  <!-- 見出し -->
  <g>
    <circle cx="878" cy="164" r="28" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
    <text x="878" y="174" text-anchor="middle" class="h" font-size="30" fill="#247F7A">○</text>
    <text x="924" y="176" class="h" font-size="36" fill="#247F7A">良い例</text>
    <text x="1054" y="176" font-size="24" fill="#6F5C52">（具体的な指示）</text>
  </g>

  <!-- 吹き出し（指示） -->
  <g>
    <path d="M942 340 L952 380 L984 340 Z" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3" stroke-linejoin="round"/>
    <rect x="850" y="210" width="650" height="148" rx="24" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="1175" y="249" text-anchor="middle" font-size="26">「会議メモからタスクを抜き出して</text>
    <text x="1175" y="285" text-anchor="middle" font-size="26">列はタスク・担当・期限・状態</text>
    <text x="1175" y="321" text-anchor="middle" font-size="26">書かれていない項目は『未確認』」</text>
  </g>

  <!-- 矢印 -->
  <path d="M1175 364 L1175 412" stroke="#B44A32" stroke-width="6" stroke-linecap="round"/>
  <path d="M1159 408 L1191 408 L1175 430 Z" fill="#B44A32"/>

  <!-- 出力イメージ: 整った4列表 -->
  <g>
    <rect x="850" y="430" width="650" height="156" rx="18" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <rect x="850" y="430" width="650" height="52" rx="18" fill="#7C3527"/>
    <rect x="850" y="456" width="650" height="26" fill="#7C3527"/>
    <line x1="1100" y1="430" x2="1100" y2="586" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="1210" y1="430" x2="1210" y2="586" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="1355" y1="430" x2="1355" y2="586" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="850" y1="482" x2="1500" y2="482" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="850" y1="534" x2="1500" y2="534" stroke="#EDC9B4" stroke-width="2"/>
    <text x="975" y="464" text-anchor="middle" class="h w" font-size="26">タスク</text>
    <text x="1155" y="464" text-anchor="middle" class="h w" font-size="26">担当</text>
    <text x="1283" y="464" text-anchor="middle" class="h w" font-size="26">期限</text>
    <text x="1428" y="464" text-anchor="middle" class="h w" font-size="26">状態</text>
    <text x="975" y="516" text-anchor="middle" font-size="24">新サイトを公開する</text>
    <text x="1155" y="516" text-anchor="middle" font-size="24">田中</text>
    <text x="1283" y="516" text-anchor="middle" font-size="24">9月15日</text>
    <text x="1428" y="516" text-anchor="middle" font-size="24">進行中</text>
    <text x="975" y="568" text-anchor="middle" font-size="24">告知文を確認する</text>
    <text x="1155" y="568" text-anchor="middle" font-size="24">未確認</text>
    <text x="1283" y="568" text-anchor="middle" font-size="24">次回会議</text>
    <text x="1428" y="568" text-anchor="middle" font-size="24">未着手</text>
  </g>

  <!-- タグ（良い例の教訓） -->
  <rect x="850" y="606" width="650" height="54" rx="27" fill="#247F7A"/>
  <text x="1175" y="642" text-anchor="middle" class="h w" font-size="26">足りない所が見える → そのまま仕事に使える</text>
</svg>
