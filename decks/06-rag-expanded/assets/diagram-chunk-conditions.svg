<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#B85D42"/></marker></defs><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="34" fill="#49352D" font-weight="700">条件が別々の断片に入る</text><rect x="35" y="95" width="420" height="120" rx="12" fill="#E8DED0"/><text x="245.0" y="143" text-anchor="middle" font-size="32" fill="#49352D" font-weight="700">断片A：期限</text><text x="245.0" y="185" text-anchor="middle" font-size="27" fill="#49352D" font-weight="400">翌月5日まで</text><rect x="505" y="95" width="420" height="120" rx="12" fill="#E8DED0"/><text x="715.0" y="143" text-anchor="middle" font-size="32" fill="#49352D" font-weight="700">断片B：例外</text><text x="715.0" y="185" text-anchor="middle" font-size="27" fill="#49352D" font-weight="400">休日なら翌営業日</text><path d="M480 246 L480 328" stroke="#B85D42" stroke-width="5" fill="none" marker-end="url(#arr)"/><rect x="105" y="355" width="750" height="160" rx="12" fill="#793E2D"/><text x="480.0" y="403" text-anchor="middle" font-size="32" fill="#FFFFFF" font-weight="700">必要な条件を一緒に渡す</text><text x="480.0" y="445" text-anchor="middle" font-size="27" fill="#FFFFFF" font-weight="400">翌月5日まで。ただし休日なら翌営業日</text><text x="480" y="592" text-anchor="middle" font-size="30" fill="#49352D" font-weight="400">期限だけの回答にならないか試す</text></g></svg>