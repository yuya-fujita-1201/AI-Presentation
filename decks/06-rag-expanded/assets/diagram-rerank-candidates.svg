<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#B85D42"/></marker></defs><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif"><text x="480" y="45" text-anchor="middle" font-size="34" fill="#49352D" font-weight="700">質問：交通費の申請期限は？</text><text x="235" y="106" text-anchor="middle" font-size="30" fill="#49352D" font-weight="400">最初の検索候補</text><text x="725" y="106" text-anchor="middle" font-size="30" fill="#49352D" font-weight="400">順位を見直した候補</text><rect x="20" y="145" width="420" height="115" rx="12" fill="#E8DED0"/><text x="230.0" y="193" text-anchor="middle" font-size="32" fill="#49352D" font-weight="700">1：旧版の交通費</text><text x="230.0" y="235" text-anchor="middle" font-size="27" fill="#49352D" font-weight="400">利用日が対象外</text><rect x="20" y="295" width="420" height="115" rx="12" fill="#E8DED0"/><text x="230.0" y="343" text-anchor="middle" font-size="32" fill="#49352D" font-weight="700">2：宿泊費の申請</text><text x="230.0" y="385" text-anchor="middle" font-size="27" fill="#49352D" font-weight="400">質問とは別の費目</text><rect x="20" y="445" width="420" height="115" rx="12" fill="#E8DED0"/><text x="230.0" y="493" text-anchor="middle" font-size="32" fill="#49352D" font-weight="700">3：現行の交通費</text><text x="230.0" y="535" text-anchor="middle" font-size="27" fill="#49352D" font-weight="400">対象の期限と例外</text><path d="M455 330 L510 330" stroke="#B85D42" stroke-width="5" fill="none" marker-end="url(#arr)"/><rect x="535" y="145" width="405" height="115" rx="12" fill="#793E2D"/><text x="737.5" y="193" text-anchor="middle" font-size="32" fill="#FFFFFF" font-weight="700">1：現行の交通費</text><text x="737.5" y="235" text-anchor="middle" font-size="27" fill="#FFFFFF" font-weight="400">回答に使う根拠</text><rect x="535" y="295" width="405" height="115" rx="12" fill="#E8DED0"/><text x="737.5" y="343" text-anchor="middle" font-size="32" fill="#49352D" font-weight="700">2：旧版の交通費</text><text x="737.5" y="385" text-anchor="middle" font-size="27" fill="#49352D" font-weight="400">過去分の質問なら再検討</text><rect x="535" y="445" width="405" height="115" rx="12" fill="#E8DED0"/><text x="737.5" y="493" text-anchor="middle" font-size="32" fill="#49352D" font-weight="700">3：宿泊費の申請</text><text x="737.5" y="535" text-anchor="middle" font-size="27" fill="#49352D" font-weight="400">今回の回答に混ぜない</text><text x="480" y="624" text-anchor="middle" font-size="25" fill="#49352D" font-weight="400">教材例：候補に無い資料は順位変更だけでは拾えない</text></g></svg>