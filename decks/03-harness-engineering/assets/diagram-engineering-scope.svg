<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="62" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="32" font-weight="800" fill="#7C3527">3つは上下ではなく、別々の設計観点</text>

  <rect x="55" y="122" width="274" height="210" rx="28" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
