<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/></marker></defs><rect width="1024" height="768" fill="#FFF9F3"/><text x="512" y="62" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="32" font-weight="800" fill="#7C3527">長時間タスクは、会話ではなく状態ファイルで引き継ぐ</text><rect x="52" y="210" width="250" height="260" rx="24" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/><text x="177.0" y="258" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">セッションA</text><text x="177.0" y="302" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">環境を初期化</text><text x="177.0" y="332" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">小さな単位で実装</text><text x="177.0" y="362" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">失敗と判断を記録</text><line x1="318" y1="340" x2="400" y2="340" stroke="#247F7A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="414" y="145" width="196" height="390" rx="28" fill="#247F7A" stroke="#247F7A" stroke-width="0"/><text x="512" y="200" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">引き継ぎ</text><text x="512" y="250" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">計画</text><text x="512" y="302" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">進捗</text><text x="512" y="354" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">決定</text><text x="512" y="406" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">テスト結果</text><text x="512" y="458" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">残課題</text><line x1="624" y1="340" x2="706" y2="340" stroke="#247F7A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="722" y="210" width="250" height="260" rx="24" fill="#FADFD5" stroke="#F0B498" stroke-width="3"/><text x="847.0" y="258" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">セッションB</text><text x="847.0" y="302" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">状態を読み戻す</text><text x="847.0" y="332" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">未完了から再開</text><text x="847.0" y="362" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">重複とやり直しを防ぐ</text><rect x="174" y="590" width="676" height="82" rx="24" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/><text x="512" y="627" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#7C3527">1回で終わらせようとせず、毎回前進できる単位に分ける</text><text x="512" y="659" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="600" fill="#6F5C52">初期化役／実行役を分けるのも有効なパターン</text></svg>