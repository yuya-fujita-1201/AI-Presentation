<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/></marker></defs><rect width="1024" height="768" fill="#FFF9F3"/><text x="512" y="64" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#7C3527">「書ける」と「仕事を終えられる」の間に、環境のギャップがある</text><rect x="70" y="190" width="300" height="250" rx="24" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/><text x="220.0" y="238" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">局所能力</text><text x="220.0" y="282" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">コードを書く</text><text x="220.0" y="312" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">文章を作る</text><text x="220.0" y="342" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">ツールを呼ぶ</text><rect x="654" y="190" width="300" height="250" rx="24" fill="#FADFD5" stroke="#F0B498" stroke-width="3"/><text x="804.0" y="238" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">完了した仕事</text><text x="804.0" y="282" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">要件を満たす</text><text x="804.0" y="312" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">実環境で動く</text><text x="804.0" y="342" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">証拠が残る</text><line x1="392" y1="315" x2="632" y2="315" stroke="#A63D32" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="12 10"/><rect x="397" y="155" width="230" height="304" rx="28" fill="#FFF2E8" stroke="#A63D32" stroke-width="4"/><text x="512" y="205" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#A63D32">不足する橋</text><text x="512" y="252" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="600" fill="#2B211D">正しい対象</text><text x="512" y="292" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="600" fill="#2B211D">状態の維持</text><text x="512" y="332" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="600" fill="#2B211D">安全な実行</text><text x="512" y="372" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="600" fill="#2B211D">失敗の切り分け</text><text x="512" y="412" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="600" fill="#2B211D">完了の検証</text><rect x="160" y="535" width="704" height="105" rx="28" fill="#247F7A" stroke="#247F7A" stroke-width="0"/><text x="512" y="582" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">ハーネスは、この橋を再利用できる仕組みにする</text><text x="512" y="618" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">「もっと賢く」だけでは埋まらない失敗を扱う</text></svg>