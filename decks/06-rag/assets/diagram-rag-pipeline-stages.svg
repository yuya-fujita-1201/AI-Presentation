<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="ps-chev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3527"/>
    </marker>
    <marker id="ps-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B44A32"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <rect x="40" y="140" width="944" height="170" rx="24" fill="#FFF2E8" stroke="#FADFD5" stroke-width="2"/>
  <rect x="40" y="430" width="944" height="170" rx="24" fill="#FFF2E8" stroke="#FADFD5" stroke-width="2"/>

  <rect x="40" y="112" width="86" height="46" rx="22" fill="#B44A32"/>
  <text x="83" y="142" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">1回</text>
  <text x="140" y="142" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="700" fill="#7C3527">事前準備（資料を入れたとき）</text>

  <rect x="40" y="402" width="86" height="46" rx="22" fill="#B44A32"/>
  <text x="83" y="432" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">毎回</text>
  <text x="140" y="432" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="700" fill="#7C3527">応答（質問のたび）</text>

  <line x1="40" y1="370" x2="984" y2="370" stroke="#B44A32" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>

  <g id="stage-ingest">
    <rect x="70" y="170" width="200" height="110" rx="16" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="170" y="235" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#7C3527">取り込み・パース</text>
  </g>
  <path d="M 274 225 H 294" stroke="#7C3527" stroke-width="4" marker-end="url(#ps-chev)"/>
  <g id="stage-chunk">
    <rect x="298" y="170" width="200" height="110" rx="16" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="398" y="235" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#7C3527">分割</text>
  </g>
  <path d="M 502 225 H 522" stroke="#7C3527" stroke-width="4" marker-end="url(#ps-chev)"/>
  <g id="stage-embed">
    <rect x="526" y="170" width="200" height="110" rx="16" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="626" y="235" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#7C3527">ベクトル化</text>
  </g>
  <path d="M 730 225 H 750" stroke="#7C3527" stroke-width="4" marker-end="url(#ps-chev)"/>
  <g id="stage-store">
    <rect x="754" y="170" width="200" height="110" rx="16" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <path d="M 828 200 L 854 182 L 880 200 V 216 H 828 Z" fill="#7C3527"/>
    <rect x="832" y="216" width="44" height="26" fill="#FFFFFF" stroke="#7C3527" stroke-width="2"/>
    <line x1="854" y1="216" x2="854" y2="242" stroke="#7C3527" stroke-width="2"/>
    <text x="854" y="266" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#7C3527">格納</text>
  </g>

  <path d="M 854 282 V 330 H 284 V 456" fill="none" stroke="#B44A32" stroke-width="4" marker-end="url(#ps-arw)"/>

  <g id="stage-search">
    <rect x="184" y="460" width="200" height="110" rx="16" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="284" y="525" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#7C3527">検索</text>
  </g>
  <path d="M 388 515 H 408" stroke="#7C3527" stroke-width="4" marker-end="url(#ps-chev)"/>
  <g id="stage-rerank">
    <rect x="412" y="460" width="200" height="110" rx="16" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="512" y="525" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#7C3527">再ランク</text>
  </g>
  <path d="M 616 515 H 636" stroke="#7C3527" stroke-width="4" marker-end="url(#ps-chev)"/>
  <g id="stage-generate">
    <rect x="640" y="460" width="200" height="110" rx="16" fill="#B44A32" stroke="#7C3527" stroke-width="4"/>
    <path d="M 706 486 H 774 A 14 14 0 0 1 788 500 V 514 A 14 14 0 0 1 774 528 H 730 L 712 542 L 716 528 H 706 A 14 14 0 0 1 692 514 V 500 A 14 14 0 0 1 706 486 Z" fill="#FFFFFF"/>
    <text x="740" y="560" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">生成</text>
  </g>

  <text x="512" y="694" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#6F5C52">7つの工程は「1回」と「毎回」に分かれるだけで、数え方の違いは粒度の違い</text>
</svg>
