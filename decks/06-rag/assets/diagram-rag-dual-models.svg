<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="dm-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3527"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="110" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#6F5C52">同じ「文章」でも、渡す先の台が違う</text>

  <g id="divider">
    <rect x="503" y="170" width="18" height="470" rx="9" fill="#B44A32"/>
    <text x="512" y="660" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" font-weight="800" fill="#B44A32">役割は別物</text>
  </g>

  <g id="bench-embed">
    <rect x="270" y="188" width="70" height="80" rx="6" fill="#FFEDE3" stroke="#7C3527" stroke-width="2.5"/>
    <line x1="284" y1="212" x2="326" y2="212" stroke="#7C3527" stroke-width="2.5"/>
    <line x1="284" y1="228" x2="326" y2="228" stroke="#7C3527" stroke-width="2.5"/>
    <line x1="284" y1="244" x2="312" y2="244" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 305 268 V 296" stroke="#7C3527" stroke-width="3.5" marker-end="url(#dm-arw)"/>
    <rect x="140" y="300" width="330" height="36" rx="8" fill="#B44A32" stroke="#7C3527" stroke-width="3"/>
    <rect x="165" y="336" width="16" height="56" fill="#7C3527"/>
    <rect x="430" y="336" width="16" height="56" fill="#7C3527"/>
    <text x="305" y="426" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#B44A32">埋め込みモデル</text>
    <text x="305" y="450" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="700" fill="#6F5C52">意味を数値へ変換する役</text>
  </g>

  <path d="M 305 336 V 400" fill="none" stroke="#7C3527" stroke-width="3.5" marker-end="url(#dm-arw)"/>

  <g id="numeric-array">
    <rect x="185" y="480" width="240" height="96" rx="12" fill="#FFF2E8" stroke="#B44A32" stroke-width="2.5"/>
    <rect x="205" y="536" width="16" height="24" fill="#B44A32"/>
    <rect x="233" y="512" width="16" height="48" fill="#B44A32"/>
    <rect x="261" y="524" width="16" height="36" fill="#B44A32"/>
    <rect x="289" y="500" width="16" height="60" fill="#B44A32"/>
    <rect x="317" y="544" width="16" height="16" fill="#B44A32"/>
    <rect x="345" y="516" width="16" height="44" fill="#B44A32"/>
    <rect x="373" y="530" width="16" height="30" fill="#B44A32"/>
    <text x="305" y="604" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="800" fill="#B44A32">数値の並び（ベクトル）</text>
  </g>

  <g id="bench-chat">
    <rect x="690" y="188" width="70" height="80" rx="6" fill="#FFEDE3" stroke="#7C3527" stroke-width="2.5"/>
    <line x1="704" y1="212" x2="746" y2="212" stroke="#7C3527" stroke-width="2.5"/>
    <line x1="704" y1="228" x2="746" y2="228" stroke="#7C3527" stroke-width="2.5"/>
    <line x1="704" y1="244" x2="732" y2="244" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 725 268 V 296" stroke="#7C3527" stroke-width="3.5" marker-end="url(#dm-arw)"/>
    <rect x="560" y="300" width="330" height="36" rx="8" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="585" y="336" width="16" height="56" fill="#7C3527"/>
    <rect x="850" y="336" width="16" height="56" fill="#7C3527"/>
    <text x="725" y="426" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#7C3527">会話用モデル</text>
    <text x="725" y="450" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="700" fill="#6F5C52">読んで答えを書く役</text>
  </g>

  <path d="M 725 336 V 400" fill="none" stroke="#7C3527" stroke-width="3.5" marker-end="url(#dm-arw)"/>

  <g id="answer-bubble">
    <path d="M 630 480 H 830 A 18 18 0 0 1 848 498 V 552 A 18 18 0 0 1 830 570 H 748 L 722 596 L 728 570 H 630 A 18 18 0 0 1 612 552 V 498 A 18 18 0 0 1 630 480 Z" fill="#F0B498" stroke="#7C3527" stroke-width="3"/>
    <text x="730" y="534" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="800" fill="#7C3527">答え</text>
    <text x="730" y="604" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="800" fill="#7C3527">後から差し替えやすい</text>
  </g>

  <text x="512" y="694" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#6F5C52">埋め込みモデルを替えると、索引の作り直しになる</text>
</svg>
