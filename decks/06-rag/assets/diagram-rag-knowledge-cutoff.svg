<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="kc-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/>
    </marker>
    <marker id="kc-arw-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <g id="timeline-axis">
    <line x1="70" y1="580" x2="954" y2="580" stroke="#6F5C52" stroke-width="3" marker-end="url(#kc-arw)"/>
    <text x="70" y="626" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#6F5C52">過去</text>
    <text x="954" y="626" text-anchor="end" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="700" fill="#6F5C52">現在</text>
  </g>

  <g id="trained-band">
    <rect x="70" y="566" width="490" height="28" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="315" y="548" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="800" fill="#7C3527">学習データの範囲</text>
    <line x1="560" y1="520" x2="560" y2="612" stroke="#6F5C52" stroke-width="2.5" stroke-dasharray="6 6"/>
    <text x="560" y="504" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" font-weight="700" fill="#6F5C52">学習時点</text>
  </g>

  <g id="company-icon">
    <rect x="650" y="420" width="90" height="160" rx="6" fill="#A63D32" stroke="#7C3527" stroke-width="3"/>
    <line x1="695" y1="420" x2="695" y2="396" stroke="#7C3527" stroke-width="3"/>
    <path d="M 695 396 L 716 404 L 695 412 Z" fill="#B44A32"/>
    <rect x="666" y="440" width="18" height="20" fill="#FFEDE3"/>
    <rect x="706" y="440" width="18" height="20" fill="#FFEDE3"/>
    <rect x="666" y="472" width="18" height="20" fill="#FFEDE3"/>
    <rect x="706" y="472" width="18" height="20" fill="#FFEDE3"/>
    <rect x="666" y="504" width="18" height="20" fill="#FFEDE3"/>
    <rect x="706" y="504" width="18" height="20" fill="#FFEDE3"/>
    <rect x="680" y="546" width="30" height="34" fill="#FFEDE3"/>
    <text x="695" y="610" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" font-weight="800" fill="#A63D32">自社</text>
  </g>

  <g id="latest-doc">
    <path d="M 790 460 H 858 L 858 480 L 878 480 V 578 H 790 Z" fill="#FFEDE3" stroke="#A63D32" stroke-width="3"/>
    <path d="M 858 460 L 858 480 L 878 480 Z" fill="#A63D32"/>
    <line x1="806" y1="500" x2="852" y2="500" stroke="#A63D32" stroke-width="3"/>
    <line x1="806" y1="520" x2="852" y2="520" stroke="#A63D32" stroke-width="3"/>
    <line x1="806" y1="540" x2="840" y2="540" stroke="#A63D32" stroke-width="3"/>
    <text x="834" y="610" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" font-weight="800" fill="#A63D32">最新の書類</text>
  </g>

  <g id="spinning-bubble">
    <rect x="150" y="256" width="260" height="118" rx="28" fill="#FFF2E8" stroke="#6F5C52" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M 300 372 L 282 410 L 322 376 Z" fill="#FFF2E8" stroke="#6F5C52" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M 220 300 A 26 26 0 1 1 234 322" fill="none" stroke="#6F5C52" stroke-width="4" marker-end="url(#kc-arw-m)"/>
    <circle cx="290" cy="292" r="5" fill="#6F5C52"/>
    <circle cx="306" cy="292" r="5" fill="#6F5C52"/>
    <circle cx="322" cy="292" r="5" fill="#6F5C52"/>
    <text x="280" y="352" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#6F5C52">空回り</text>
  </g>

  <text x="512" y="694" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#6F5C52">学習時点で止まり、知らないことも空回りで答えてしまう</text>
