<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="bs-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B44A32"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="120" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#6F5C52">境界線は、5段階のどこにでも置ける</text>

  <g id="stage-ingest">
    <rect x="72" y="180" width="168" height="100" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="156" y="238" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#7C3527">取り込み</text>
  </g>
  <g id="stage-chunk">
    <rect x="250" y="180" width="168" height="100" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="334" y="238" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#7C3527">分割</text>
  </g>
  <g id="stage-embed">
    <rect x="428" y="180" width="168" height="100" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="512" y="238" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#7C3527">ベクトル化</text>
  </g>
  <g id="stage-search">
    <rect x="606" y="180" width="168" height="100" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="690" y="238" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#7C3527">検索</text>
  </g>
  <g id="stage-generate">
    <rect x="784" y="180" width="168" height="100" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="868" y="238" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="800" fill="#7C3527">生成</text>
  </g>

  <g id="boundary-line">
    <rect x="72" y="452" width="880" height="16" rx="8" fill="#F6E6CF" stroke="#F0B498" stroke-width="2"/>
    <line x1="245" y1="444" x2="245" y2="476" stroke="#6F5C52" stroke-width="2.5"/>
    <line x1="423" y1="444" x2="423" y2="476" stroke="#6F5C52" stroke-width="2.5"/>
    <line x1="779" y1="444" x2="779" y2="476" stroke="#6F5C52" stroke-width="2.5"/>
    <text x="72" y="508" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="800" fill="#7C3527">社内</text>
    <text x="952" y="508" text-anchor="end" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="800" fill="#A63D32">社外</text>
    <rect x="72" y="452" width="529" height="16" fill="#F0B498" opacity="0.6"/>
  </g>

  <g id="movable-knob">
    <path d="M 100 424 H 924" stroke="#B44A32" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#bs-arw)" marker-end="url(#bs-arw)"/>
    <circle cx="245" cy="460" r="17" fill="none" stroke="#F0B498" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="423" cy="460" r="17" fill="none" stroke="#F0B498" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="779" cy="460" r="17" fill="none" stroke="#F0B498" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="601" cy="460" r="27" fill="#B44A32" stroke="#7C3527" stroke-width="4"/>
    <line x1="601" y1="443" x2="601" y2="343" stroke="#7C3527" stroke-width="2.5" stroke-dasharray="5 5"/>
    <rect x="486" y="304" width="230" height="42" rx="21" fill="#B44A32" stroke="#7C3527" stroke-width="3"/>
    <text x="601" y="332" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">可動つまみ（線引きの位置）</text>
  </g>

  <text x="512" y="694" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#6F5C52">どの段まで手元でやるかで、外に出る情報の量が変わる</text>
</svg>
