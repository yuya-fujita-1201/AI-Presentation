<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="130" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="800" fill="#B44A32">対策2：前後を少し重ねる（オーバーラップ）</text>

  <g id="group-overlap">
    <rect x="60" y="168" width="900" height="176" rx="20" fill="#FFF2E8" stroke="#FADFD5" stroke-width="2"/>
    <rect x="130" y="200" width="220" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="310" y="200" width="220" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="490" y="200" width="220" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="670" y="200" width="220" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="310" y="200" width="40" height="112" fill="#B44A32"/>
    <rect x="490" y="200" width="40" height="112" fill="#B44A32"/>
    <rect x="670" y="200" width="40" height="112" fill="#B44A32"/>
    <text x="180" y="264" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#7C3527">断片1</text>
    <text x="440" y="264" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#7C3527">断片2</text>
    <text x="620" y="264" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#7C3527">断片3</text>
    <text x="800" y="264" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#7C3527">断片4</text>
    <text x="330" y="222" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">重複</text>
    <text x="510" y="222" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">重複</text>
    <text x="690" y="222" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">重複</text>
    <text x="512" y="358" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" font-weight="700" fill="#B44A32">端が重なるので、どちらかの断片には文が完全な形で残る</text>
  </g>

  <text x="512" y="452" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="800" fill="#6F5C52">重ねずに切ると（オーバーラップなし）</text>

  <g id="group-gap">
    <rect x="60" y="490" width="900" height="176" rx="20" fill="#FFF2E8" stroke="#FADFD5" stroke-width="2"/>
    <rect x="130" y="522" width="180" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="348" y="522" width="180" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="566" y="522" width="180" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <rect x="784" y="522" width="180" height="112" rx="14" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
    <text x="220" y="586" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#6F5C52">断片1</text>
    <text x="438" y="586" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#6F5C52">断片2</text>
    <text x="656" y="586" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#6F5C52">断片3</text>
    <text x="874" y="586" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" font-weight="700" fill="#6F5C52">断片4</text>
    <circle cx="329" cy="578" r="15" fill="#FFF9F3" stroke="#A63D32" stroke-width="3"/>
    <line x1="322" y1="571" x2="336" y2="585" stroke="#A63D32" stroke-width="3" stroke-linecap="round"/>
    <line x1="336" y1="571" x2="322" y2="585" stroke="#A63D32" stroke-width="3" stroke-linecap="round"/>
    <circle cx="547" cy="578" r="15" fill="#FFF9F3" stroke="#A63D32" stroke-width="3"/>
    <line x1="540" y1="571" x2="554" y2="585" stroke="#A63D32" stroke-width="3" stroke-linecap="round"/>
    <line x1="554" y1="571" x2="540" y2="585" stroke="#A63D32" stroke-width="3" stroke-linecap="round"/>
    <circle cx="765" cy="578" r="15" fill="#FFF9F3" stroke="#A63D32" stroke-width="3"/>
    <line x1="758" y1="571" x2="772" y2="585" stroke="#A63D32" stroke-width="3" stroke-linecap="round"/>
    <line x1="772" y1="571" x2="758" y2="585" stroke="#A63D32" stroke-width="3" stroke-linecap="round"/>
    <text x="512" y="682" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" font-weight="700" fill="#A63D32">境目をまたぐ一文が、両側とも欠けた形で残る</text>
  </g>
</svg>
