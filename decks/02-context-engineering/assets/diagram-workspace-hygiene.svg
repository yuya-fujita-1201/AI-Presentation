<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 左: 散らかった作業場 -->
  <rect x="52" y="60" width="436" height="536" rx="24" fill="#FFFFFF" stroke="#C9BAB2" stroke-width="4"/>
  <rect x="72" y="80" width="396" height="56" rx="14" fill="#C9BAB2"/>
  <text x="270" y="117" text-anchor="middle" class="h" font-size="24" fill="#5A4A42">散らかった作業場</text>

  <rect x="92" y="166" width="240" height="52" rx="12" fill="#F2E6DC" transform="rotate(-3 212 192)"/>
  <text x="212" y="199" text-anchor="middle" font-size="19" transform="rotate(-3 212 192)">議事録_最新_v2_修正案.xlsx</text>
  <rect x="180" y="238" width="250" height="52" rx="12" fill="#F2E6DC" transform="rotate(2 305 264)"/>
  <text x="305" y="271" text-anchor="middle" font-size="19" transform="rotate(2 305 264)">新しいフォルダ (3)</text>
  <rect x="110" y="310" width="230" height="52" rx="12" fill="#F2E6DC" transform="rotate(-2 225 336)"/>
  <text x="225" y="343" text-anchor="middle" font-size="19" transform="rotate(-2 225 336)">仕様書（古い方？）.docx</text>
  <rect x="200" y="382" width="220" height="52" rx="12" fill="#F2E6DC" transform="rotate(3 310 408)"/>
  <text x="310" y="415" text-anchor="middle" font-size="19" transform="rotate(3 310 408)">メモ_コピー_コピー.txt</text>

  <text x="270" y="496" text-anchor="middle" class="m" font-size="20">どれが正本か、人にも分からない</text>
  <text x="270" y="536" text-anchor="middle" class="h" font-size="21" fill="#B44A32">AIにも分からない</text>

  <!-- 右: 整った作業場 -->
  <rect x="536" y="60" width="436" height="536" rx="24" fill="#FFFFFF" stroke="#247F7A" stroke-width="5"/>
  <rect x="556" y="80" width="396" height="56" rx="14" fill="#247F7A"/>
  <text x="754" y="117" text-anchor="middle" class="h w" font-size="24" fill="#FFFFFF">整った作業場</text>

  <rect x="576" y="166" width="356" height="60" rx="12" fill="#DDEFEA"/>
  <text x="596" y="204" font-size="20">📁 specs／　仕様の正本だけ</text>
  <rect x="576" y="242" width="356" height="60" rx="12" fill="#DDEFEA"/>
  <text x="596" y="280" font-size="20">📁 meetings／　日付つき議事録</text>
  <rect x="576" y="318" width="356" height="60" rx="12" fill="#DDEFEA"/>
  <text x="596" y="356" font-size="20">📁 archive／　古い版は隔離</text>
  <rect x="576" y="394" width="356" height="60" rx="12" fill="#FADFD5" stroke="#B44A32" stroke-width="3"/>
  <text x="596" y="432" font-size="20">📄 README　正本と用語の案内</text>

  <text x="754" y="496" text-anchor="middle" class="m" font-size="20">名前と場所が、そのまま前提を語る</text>
  <text x="754" y="536" text-anchor="middle" class="h" font-size="21" fill="#247F7A">AIが正本を見つけやすい</text>

  <!-- 下部メッセージ -->
  <rect x="96" y="640" width="832" height="88" rx="24" fill="#7C3527"/>
  <text x="512" y="678" text-anchor="middle" class="h w" font-size="26" fill="#FFFFFF">作業場の整理整頓は、AIへの説明を先回りで済ませること</text>
  <text x="512" y="714" text-anchor="middle" font-size="21" style="fill:#F6C9B8">人に分かりやすい置き場は、AIにも分かりやすい</text>
</svg>
