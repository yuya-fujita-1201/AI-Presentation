<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="56" text-anchor="middle" class="h" font-size="30">同じ「触らないで」でも、効き方が違う</text>

  <!-- 左：ルールファイル（コンテキスト） -->
  <rect x="44" y="90" width="448" height="430" rx="22" fill="#FFFFFF" stroke="#A63D32" stroke-width="5"/>
  <rect x="64" y="110" width="408" height="48" rx="14" fill="#A63D32"/>
  <text x="268" y="142" text-anchor="middle" class="h w" font-size="23" fill="#FFFFFF">ルールファイル（CLAUDE.md）</text>
  <text x="268" y="205" text-anchor="middle" class="h" font-size="26" fill="#A63D32">行動意図に影響する</text>
  <text x="268" y="265" text-anchor="middle" font-size="20">「本番DBは触らない」と書く</text>
  <text x="268" y="305" text-anchor="middle" font-size="20">望ましい判断を伝える</text>
  <text x="268" y="345" text-anchor="middle" font-size="20">厳密な遵守は保証されない</text>
  <text x="268" y="385" text-anchor="middle" font-size="20">矛盾するルールがあると揺れる</text>
  <rect x="64" y="428" width="408" height="56" rx="14" fill="#A63D32"/>
  <text x="268" y="464" text-anchor="middle" class="h w" font-size="22" fill="#FFFFFF">守られないことがある</text>

  <!-- 右：設定ファイル・権限（強制） -->
  <rect x="532" y="90" width="448" height="430" rx="22" fill="#FFFFFF" stroke="#247F7A" stroke-width="5"/>
  <rect x="552" y="110" width="408" height="48" rx="14" fill="#247F7A"/>
  <text x="756" y="142" text-anchor="middle" class="h w" font-size="22" fill="#FFFFFF">実行環境のガードレール</text>
  <text x="756" y="205" text-anchor="middle" class="h" font-size="26" fill="#247F7A">仕組みとして強制する</text>
  <text x="756" y="265" text-anchor="middle" font-size="20">実行できるコマンドを限定</text>
  <text x="756" y="305" text-anchor="middle" font-size="20">危険な操作は人の承認を必須に</text>
  <text x="756" y="345" text-anchor="middle" font-size="20">sandboxで影響範囲を制限</text>
  <text x="756" y="385" text-anchor="middle" font-size="20">フックで実行の直前に止める</text>
  <rect x="552" y="428" width="408" height="56" rx="14" fill="#247F7A"/>
  <text x="756" y="464" text-anchor="middle" class="h w" font-size="22" fill="#FFFFFF">許可・確認・拒否を制御</text>

  <!-- 下部メッセージ -->
  <rect x="88" y="572" width="848" height="124" rx="24" fill="#7C3527"/>
  <text x="512" y="620" text-anchor="middle" class="h w" font-size="25" fill="#FFFFFF">ルールファイルは、行動意図を整えるコンテキスト</text>
  <text x="512" y="664" text-anchor="middle" class="h" font-size="23" style="fill:#F6C9B8">保証が必要な境界は、権限・フック・sandbox・承認へ</text>
</svg>
