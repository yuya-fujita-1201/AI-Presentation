<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="740" viewBox="0 0 1024 740">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B44A32"/>
    </marker>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#247F7A"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#C17A27"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3527"/>
    </marker>
  </defs>
  <rect width="1024" height="740" fill="#FFF9F3"/>

  <!-- 左: 3つの取得元 -->
  <rect x="48" y="60" width="280" height="160" rx="24" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
  <text x="188" y="120" text-anchor="middle" class="h" font-size="27" fill="#B44A32">SKILL.md本文</text>
  <text x="188" y="168" text-anchor="middle" class="m" font-size="19">自動判定または</text>
  <text x="188" y="198" text-anchor="middle" class="m" font-size="19">明示呼び出し時</text>

  <rect x="48" y="258" width="280" height="160" rx="24" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
  <text x="188" y="318" text-anchor="middle" class="h" font-size="27" fill="#247F7A">検索（RAG）</text>
  <text x="188" y="366" text-anchor="middle" class="m" font-size="19">大きすぎる資料は</text>
  <text x="188" y="396" text-anchor="middle" class="m" font-size="19">関係箇所だけを渡す</text>

  <rect x="48" y="456" width="280" height="160" rx="24" fill="#F6E6CF" stroke="#C17A27" stroke-width="4"/>
  <text x="188" y="516" text-anchor="middle" class="h" font-size="27">外部コネクター</text>
  <text x="188" y="564" text-anchor="middle" class="m" font-size="19">Gmail等の外部</text>
  <text x="188" y="594" text-anchor="middle" class="m" font-size="19">システムを読みに行く</text>

  <!-- 中央: ゲート（フィルター） -->
  <rect x="442" y="230" width="180" height="220" rx="28" fill="#F6E6CF" stroke="#C17A27" stroke-width="5"/>
  <path d="M482 265H582L547 305V335L517 350V305Z" fill="#FFFFFF" stroke="#C17A27" stroke-width="5" stroke-linejoin="round"/>
  <text x="532" y="395" text-anchor="middle" class="h" font-size="18" fill="#C17A27">必要と判断／</text>
  <text x="532" y="420" text-anchor="middle" class="h" font-size="18" fill="#C17A27">明示呼び出し</text>

  <!-- 3本の矢印: 供給源→ゲート -->
  <path d="M328 140 C400 140 400 220 442 280" fill="none" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrA)"/>
  <path d="M328 338H442" fill="none" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrT)"/>
  <path d="M328 536 C400 536 400 420 442 400" fill="none" stroke="#C17A27" stroke-width="5" stroke-linecap="round" marker-end="url(#arrG)"/>

  <!-- ゲート→今回のコンテキスト -->
  <path d="M622 340H700" fill="none" stroke="#7C3527" stroke-width="6" stroke-linecap="round" marker-end="url(#arrP)"/>

  <!-- 右: 今回のコンテキスト -->
  <rect x="700" y="270" width="280" height="140" rx="24" fill="#7C3527"/>
  <text x="840" y="350" text-anchor="middle" class="h w" font-size="26">今回のコンテキスト</text>

  <!-- 条件に合わない例（ゲートを通らない） -->
  <path d="M460 495 L590 495" fill="none" stroke="#6F5C52" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.5"/>
  <path d="M596 487L612 503" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M612 487L596 503" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <text x="525" y="525" text-anchor="middle" class="m" font-size="16">呼び出されない本文は入らない</text>

  <text x="512" y="700" text-anchor="middle" class="m" font-size="18">descriptionは通常あらかじめ見え、本文は呼び出し時に入る</text>
</svg>
