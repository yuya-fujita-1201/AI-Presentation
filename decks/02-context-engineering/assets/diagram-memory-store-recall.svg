<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="mrArrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#247F7A"/>
    </marker>
    <marker id="mrArrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B44A32"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="54" text-anchor="middle" class="h" font-size="27">保存しただけでは、今回のコンテキストにならない</text>

  <!-- 左：書く（保存） -->
  <rect x="44" y="90" width="380" height="420" rx="24" fill="#F6E6CF" stroke="#C17A27" stroke-width="5"/>
  <rect x="64" y="110" width="340" height="50" rx="14" fill="#C17A27"/>
  <text x="234" y="144" text-anchor="middle" class="h w" font-size="23" fill="#FFFFFF">書く：保存する</text>
  <text x="234" y="210" text-anchor="middle" font-size="20">自動保存・明示保存</text>
  <text x="234" y="244" text-anchor="middle" font-size="20">履歴の要約など</text>
  <text x="234" y="298" text-anchor="middle" class="m" font-size="18">方式は製品によって異なる</text>
  <rect x="84" y="356" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#C17A27" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="234" y="404" text-anchor="middle" class="h" font-size="19" fill="#C17A27">Claude Codeの例</text>
  <text x="234" y="436" text-anchor="middle" font-size="17">MEMORY.md 先頭200行</text>
  <text x="234" y="460" text-anchor="middle" font-size="17">または25KBまでを開始時ロード</text>

  <!-- 中央：分岐矢印 -->
  <path d="M424 220 C 480 220, 480 220, 540 220" fill="none" stroke="#247F7A" stroke-width="5" marker-end="url(#mrArrT)"/>
  <text x="482" y="204" text-anchor="middle" font-size="16" fill="#247F7A">①全件</text>
  <path d="M424 400 C 480 400, 480 400, 540 400" fill="none" stroke="#B44A32" stroke-width="5" marker-end="url(#mrArrR)"/>
  <text x="482" y="440" text-anchor="middle" font-size="16" fill="#B44A32">②検索</text>

  <!-- 右：読み戻す -->
  <rect x="550" y="90" width="430" height="420" rx="24" fill="#FFFFFF" stroke="#7C3527" stroke-width="5"/>
  <rect x="570" y="110" width="390" height="50" rx="14" fill="#7C3527"/>
  <text x="765" y="144" text-anchor="middle" class="h w" font-size="22" fill="#FFFFFF">読み戻す：今回のコンテキストへ</text>

  <rect x="570" y="180" width="390" height="106" rx="16" fill="#E1F2F0" stroke="#247F7A" stroke-width="3"/>
  <text x="765" y="212" text-anchor="middle" class="h" font-size="20" fill="#247F7A">①自動ロード</text>
  <text x="765" y="248" text-anchor="middle" font-size="18">開始時に全件を読み込む製品</text>
  <text x="765" y="272" text-anchor="middle" font-size="18">（短く毎回必要な情報向け）</text>

  <rect x="570" y="298" width="390" height="106" rx="16" fill="#FADFD5" stroke="#B44A32" stroke-width="3"/>
  <text x="765" y="330" text-anchor="middle" class="h" font-size="20" fill="#B44A32">②必要時に検索</text>
  <text x="765" y="366" text-anchor="middle" font-size="18">関連しそうな記憶だけを取得</text>
  <text x="765" y="390" text-anchor="middle" font-size="18">（大きい・詳細な情報向け）</text>

  <rect x="570" y="420" width="390" height="76" rx="16" fill="#FFFFFF" stroke="#7C3527" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="765" y="452" text-anchor="middle" class="h" font-size="18" fill="#7C3527">役割・厳守事項は対象外</text>
  <text x="765" y="478" text-anchor="middle" font-size="16">ルール・システム指示へ書く</text>

  <!-- 下部メッセージ -->
  <rect x="72" y="640" width="880" height="88" rx="24" fill="#7C3527"/>
  <text x="512" y="678" text-anchor="middle" class="h w" font-size="24" fill="#FFFFFF">メモリは保存方式。読み戻し方で①にも②にもなる</text>
  <text x="512" y="712" text-anchor="middle" font-size="19" style="fill:#F6C9B8">誤った記憶は、訂正・削除まで運用する</text>
</svg>
