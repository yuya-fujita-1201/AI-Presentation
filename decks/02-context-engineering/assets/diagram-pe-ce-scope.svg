<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- コンテキスト全体の枠（＝コンテキストエンジニアリングが整える範囲） -->
  <rect x="40" y="30" width="944" height="330" rx="28" fill="#DDEFEA" fill-opacity="0.55" stroke="#247F7A" stroke-width="6"/>
  <text x="512" y="80" text-anchor="middle" class="h" font-size="32" fill="#247F7A">コンテキスト＝今回モデルが参照できる情報</text>

  <!-- 左：プロンプト（＝プロンプトエンジニアリングが整える範囲） -->
  <rect x="64" y="110" width="316" height="216" rx="22" fill="#FADFD5" stroke="#B44A32" stroke-width="5"/>
  <text x="222" y="164" text-anchor="middle" class="h" font-size="29" fill="#B44A32">プロンプト</text>
  <text x="222" y="204" text-anchor="middle" font-size="21">あなたが都度渡す問いかけ</text>
  <text x="222" y="286" text-anchor="middle" class="m" font-size="18">シリーズ01で学んだ範囲（詳細はスライド5）</text>

  <!-- 右：システムが裏で足す -->
  <rect x="412" y="110" width="548" height="216" rx="22" fill="#FFFFFF" stroke="#247F7A" stroke-width="5"/>
  <text x="686" y="164" text-anchor="middle" class="h" font-size="26" fill="#247F7A">製品仕様や取得処理で加わる情報</text>
  <text x="686" y="204" text-anchor="middle" font-size="21">システム指示・ルール・履歴・メモリ・取得結果 など</text>
  <text x="686" y="286" text-anchor="middle" class="m" font-size="18">今回はここを主に扱う（第2章〜）</text>

  <!-- プロンプトエンジニアリングのブラケット：プロンプトの箱の幅だけ -->
  <path d="M 64 396 L 64 420 L 380 420 L 380 396" fill="none" stroke="#B44A32" stroke-width="6"/>
  <line x1="222" y1="420" x2="222" y2="440" stroke="#B44A32" stroke-width="6"/>
  <rect x="72" y="452" width="300" height="140" rx="20" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
  <text x="222" y="500" text-anchor="middle" class="h" font-size="27" fill="#B44A32">プロンプト</text>
  <text x="222" y="534" text-anchor="middle" class="h" font-size="27" fill="#B44A32">エンジニアリング</text>
  <text x="222" y="570" text-anchor="middle" class="m" font-size="18">「プロンプト」の箱を整える</text>

  <!-- 本資料の整理：モデルに渡る情報全体 -->
  <path d="M 40 396 L 40 420 L 984 420 L 984 396" fill="none" stroke="#247F7A" stroke-width="6"/>
  <line x1="512" y1="420" x2="512" y2="440" stroke="#247F7A" stroke-width="6"/>
  <rect x="424" y="452" width="560" height="140" rx="20" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
  <text x="704" y="500" text-anchor="middle" class="h" font-size="27" fill="#247F7A">コンテキスト</text>
  <text x="704" y="534" text-anchor="middle" class="h" font-size="27" fill="#247F7A">エンジニアリング</text>
  <text x="704" y="570" text-anchor="middle" class="m" font-size="18">情報全体を整える。プロンプトを含む</text>

  <!-- 下部メッセージ -->
  <rect x="112" y="640" width="800" height="88" rx="24" fill="#7C3527"/>
  <text x="512" y="678" text-anchor="middle" class="h w" font-size="25" fill="#FFFFFF">2つは世代交代ではなく、同じ依頼の中で重なって働く</text>
  <text x="512" y="710" text-anchor="middle" font-size="18" style="fill:#F6C9B8">プロンプトエンジニアリングは、コンテキストエンジニアリングの一部</text>
</svg>
