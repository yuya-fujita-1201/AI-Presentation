<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B44A32"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <rect x="292" y="42" width="440" height="116" rx="24" fill="#7C3527"/>
  <text x="512" y="86" text-anchor="middle" class="h w" font-size="25" fill="#FFFFFF">同じ指示</text>
  <text x="512" y="128" text-anchor="middle" class="w" font-size="29" fill="#FFFFFF">「この資料をまとめて」</text>

  <path d="M512 158V202M512 202H262V238M512 202H762V238" fill="none" stroke="#B44A32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="72" y="242" width="380" height="142" rx="24" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
  <text x="262" y="292" text-anchor="middle" class="h" font-size="25" fill="#247F7A">前提 A</text>
  <text x="262" y="342" text-anchor="middle" class="h" font-size="32">新人向け</text>

  <rect x="572" y="242" width="380" height="142" rx="24" fill="#F6E6CF" stroke="#C17A27" stroke-width="4"/>
  <text x="762" y="292" text-anchor="middle" class="h" font-size="25" fill="#C17A27">前提 B</text>
  <text x="762" y="342" text-anchor="middle" class="h" font-size="32">役員向け</text>

  <path d="M262 384V420" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M762 384V420" stroke="#C17A27" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="262" cy="458" r="42" fill="#247F7A"/>
  <text x="262" y="469" text-anchor="middle" class="h w" font-size="27" fill="#FFFFFF">AI</text>
  <circle cx="762" cy="458" r="42" fill="#C17A27"/>
  <text x="762" y="469" text-anchor="middle" class="h" font-size="27" fill="#2B211D">AI</text>
  <path d="M262 500V530" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M762 500V530" stroke="#C17A27" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="72" y="540" width="380" height="154" rx="24" fill="#FFFFFF" stroke="#247F7A" stroke-width="4"/>
  <text x="262" y="599" text-anchor="middle" class="h" font-size="31">やさしく順番に</text>
  <text x="262" y="650" text-anchor="middle" class="m" font-size="24">用語も説明する</text>

  <rect x="572" y="540" width="380" height="154" rx="24" fill="#FFFFFF" stroke="#C17A27" stroke-width="4"/>
  <text x="762" y="599" text-anchor="middle" class="h" font-size="31">結論を先に</text>
  <text x="762" y="650" text-anchor="middle" class="m" font-size="24">判断材料に絞る</text>

  <text x="512" y="738" text-anchor="middle" class="h" font-size="25" fill="#7C3527">指示が同じでも、前提で答えは変わる</text>
</svg>
