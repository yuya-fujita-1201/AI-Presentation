<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B44A32"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <path d="M742 120H780 M742 254H780 M742 388H780 M742 522H780" fill="none" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="70" y="66" width="672" height="108" rx="24" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
    <circle cx="128" cy="120" r="28" fill="#247F7A"/>
    <text x="128" y="130" text-anchor="middle" class="h w" font-size="26">1</text>
    <text x="184" y="108" class="h" font-size="29" fill="#247F7A">地図</text>
    <text x="184" y="148" class="m" font-size="21">目的・完了条件・正本・現在状態</text>
  </g>

  <g>
    <rect x="70" y="200" width="672" height="108" rx="24" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
    <circle cx="128" cy="254" r="28" fill="#B44A32"/>
    <text x="128" y="264" text-anchor="middle" class="h w" font-size="26">2</text>
    <text x="184" y="242" class="h" font-size="29" fill="#B44A32">ツール</text>
    <text x="184" y="282" class="m" font-size="21">用途・入力・副作用・成功判定</text>
  </g>

  <g>
    <rect x="70" y="334" width="672" height="108" rx="24" fill="#F6E6CF" stroke="#C17A27" stroke-width="4"/>
    <circle cx="128" cy="388" r="28" fill="#C17A27"/>
    <text x="128" y="398" text-anchor="middle" class="h" font-size="26" fill="#2B211D">3</text>
    <text x="184" y="376" class="h" font-size="29" fill="#C17A27">必要時に取得</text>
    <text x="184" y="416" class="m" font-size="21">詳細文書・過去ログ・限定ツール</text>
  </g>

  <g>
    <rect x="70" y="468" width="672" height="108" rx="24" fill="#F4CDBD" stroke="#7C3527" stroke-width="4"/>
    <circle cx="128" cy="522" r="28" fill="#7C3527"/>
    <text x="128" y="532" text-anchor="middle" class="h w" font-size="26">4</text>
    <text x="184" y="510" class="h" font-size="29" fill="#7C3527">大量結果</text>
    <text x="184" y="550" class="m" font-size="21">成果物へ保存し要点だけ残す</text>
  </g>

  <circle cx="878" cy="321" r="92" fill="#7C3527"/>
  <text x="878" y="312" text-anchor="middle" class="h w" font-size="30" fill="#FFFFFF">AIが</text>
  <text x="878" y="354" text-anchor="middle" class="h w" font-size="30" fill="#FFFFFF">判断</text>

  <text x="512" y="724" text-anchor="middle" class="h" font-size="24" fill="#247F7A">固定せず、使う時に必要な層を開く</text>
