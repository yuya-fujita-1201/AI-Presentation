  <rect width="1024" height="768" fill="#FFF9F3"/>

  <path d="M742 176H780M742 384H780M742 592H780" fill="none" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

