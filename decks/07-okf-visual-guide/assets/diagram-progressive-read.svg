<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="stepArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3527"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- STEP 1: 目次で全体像をつかむ -->
  <g id="step-1">
    <circle cx="174" cy="112" r="28" fill="#B44A32"/>
    <text x="174" y="122" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">①</text>
    <rect x="40" y="150" width="268" height="470" rx="24" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
    <text x="174" y="192" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="700" fill="#7C3527">目次を見る</text>

    <!-- 目次リストのアイコン -->
    <rect x="74" y="235" width="10" height="10" fill="#B44A32"/>
    <rect x="98" y="230" width="170" height="16" rx="8" fill="#F0B498"/>
    <rect x="74" y="275" width="10" height="10" fill="#B44A32"/>
    <rect x="98" y="270" width="170" height="16" rx="8" fill="#F0B498"/>
    <rect x="74" y="315" width="10" height="10" fill="#B44A32"/>
    <rect x="98" y="310" width="170" height="16" rx="8" fill="#F0B498"/>
    <rect x="74" y="355" width="10" height="10" fill="#B44A32"/>
    <rect x="98" y="350" width="170" height="16" rx="8" fill="#F0B498"/>

    <text x="174" y="600" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" fill="#6F5C52">目次で全体像をつかむ</text>
  </g>

  <path d="M 312 380 H 374" fill="none" stroke="#7C3527" stroke-width="5" marker-end="url(#stepArrow)"/>

  <!-- STEP 2: 上端ラベルだけを見比べる -->
  <g id="step-2">
    <circle cx="512" cy="112" r="28" fill="#B44A32"/>
    <text x="512" y="122" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">②</text>
    <rect x="378" y="150" width="268" height="470" rx="24" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
    <text x="512" y="192" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="700" fill="#7C3527">背表紙ラベルを見比べる</text>

    <!-- 3枚の書類。中央だけラベルが光る -->
    <rect x="396" y="225" width="64" height="118" rx="8" fill="#FFFFFF" stroke="#F0B498" stroke-width="2"/>
    <rect x="396" y="225" width="64" height="18" rx="6" fill="#F0B498"/>
    <rect x="406" y="256" width="44" height="6" fill="#F6E6CF"/>
    <rect x="406" y="270" width="44" height="6" fill="#F6E6CF"/>
    <rect x="406" y="284" width="34" height="6" fill="#F6E6CF"/>

    <rect x="480" y="216" width="64" height="128" rx="8" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
    <rect x="480" y="216" width="64" height="22" rx="6" fill="#B44A32"/>
    <rect x="490" y="250" width="44" height="6" fill="#F6E6CF"/>
    <rect x="490" y="264" width="44" height="6" fill="#F6E6CF"/>
    <rect x="490" y="278" width="34" height="6" fill="#F6E6CF"/>

    <rect x="564" y="225" width="64" height="118" rx="8" fill="#FFFFFF" stroke="#F0B498" stroke-width="2"/>
    <rect x="564" y="225" width="64" height="18" rx="6" fill="#F0B498"/>
    <rect x="574" y="256" width="44" height="6" fill="#F6E6CF"/>
    <rect x="574" y="270" width="44" height="6" fill="#F6E6CF"/>
    <rect x="574" y="284" width="34" height="6" fill="#F6E6CF"/>

    <text x="512" y="600" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" fill="#6F5C52">背表紙ラベルだけを見比べる</text>
  </g>

  <path d="M 650 380 H 712" fill="none" stroke="#7C3527" stroke-width="5" marker-end="url(#stepArrow)"/>

  <!-- STEP 3: 選ばれた1枚だけを開いて読む -->
  <g id="step-3">
    <circle cx="850" cy="112" r="28" fill="#B44A32"/>
    <text x="850" y="122" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">③</text>
    <rect x="716" y="150" width="268" height="470" rx="24" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>
    <text x="850" y="192" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="700" fill="#7C3527">1枚だけ開く</text>

    <!-- 閉じたまま薄い書類2枚（背後） -->
    <rect x="746" y="238" width="56" height="104" rx="8" fill="#6F5C52" opacity="0.28"/>
    <rect x="898" y="238" width="56" height="104" rx="8" fill="#6F5C52" opacity="0.28"/>

    <!-- 開かれた1枚（前面・最濃） -->
    <rect x="782" y="216" width="136" height="150" rx="10" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
    <rect x="782" y="216" width="136" height="26" rx="8" fill="#B44A32"/>
    <text x="850" y="234" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">選ばれた1枚</text>
    <rect x="798" y="258" width="104" height="7" fill="#F0B498"/>
    <rect x="798" y="276" width="104" height="7" fill="#F0B498"/>
    <rect x="798" y="294" width="104" height="7" fill="#F0B498"/>
    <rect x="798" y="312" width="78" height="7" fill="#F0B498"/>
    <rect x="798" y="330" width="90" height="7" fill="#F0B498"/>

    <text x="850" y="600" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" fill="#6F5C52">選ばれた1枚だけを開いて読む</text>
  </g>
</svg>
