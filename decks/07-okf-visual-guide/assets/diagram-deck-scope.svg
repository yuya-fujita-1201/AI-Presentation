<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="70" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="700" fill="#7C3527">AIがうまく答えないとき、直せる場所は3つ</text>

  <!-- カード1: AIの賢さ -->
  <g id="el-model">
    <rect x="40" y="130" width="288" height="380" rx="22" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>

    <!-- ピクト: 頭部の円＋回路っぽい2本線 -->
    <circle cx="184" cy="213" r="42" fill="none" stroke="#7C3527" stroke-width="5"/>
    <line x1="163" y1="203" x2="205" y2="203" stroke="#7C3527" stroke-width="4" stroke-linecap="round"/>
    <circle cx="163" cy="203" r="4" fill="#7C3527"/>
    <circle cx="205" cy="203" r="4" fill="#7C3527"/>
    <line x1="163" y1="223" x2="205" y2="223" stroke="#7C3527" stroke-width="4" stroke-linecap="round"/>
    <circle cx="163" cy="223" r="4" fill="#7C3527"/>
    <circle cx="205" cy="223" r="4" fill="#7C3527"/>

    <text x="184" y="330" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="700" fill="#2B211D">AIの賢さ</text>
    <text x="184" y="365" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#6F5C52">どのモデルを使うか</text>
  </g>

  <!-- カード2: 道具と接続 -->
  <g id="el-tools">
    <rect x="368" y="130" width="288" height="380" rx="22" fill="#FFF2E8" stroke="#FADFD5" stroke-width="3"/>

    <!-- ピクト: プラグ -->
    <rect x="497" y="175" width="10" height="22" rx="3" fill="#7C3527"/>
    <rect x="517" y="175" width="10" height="22" rx="3" fill="#7C3527"/>
    <rect x="484" y="195" width="56" height="40" rx="10" fill="#7C3527"/>
    <path d="M 512 235 C 512 254, 484 254, 484 272" fill="none" stroke="#7C3527" stroke-width="5" stroke-linecap="round"/>

    <text x="512" y="330" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="700" fill="#2B211D">道具と接続</text>
    <text x="512" y="365" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#6F5C52">何につなぎ、何を使わせるか</text>
  </g>

  <!-- カード3: 知識の書き方（最濃） -->
  <g id="el-knowledge">
    <rect x="696" y="130" width="288" height="380" rx="22" fill="#B44A32" stroke="#7C3527" stroke-width="3"/>

    <!-- ピクト: 背表紙ラベル付きの書類（白） -->
    <rect x="800" y="190" width="80" height="85" rx="10" fill="#FFFFFF"/>
    <line x1="800" y1="214" x2="880" y2="214" stroke="#B44A32" stroke-width="3"/>
    <rect x="815" y="235" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
    <rect x="815" y="250" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
    <rect x="815" y="265" width="35" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>

    <text x="840" y="330" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">知識の書き方</text>
    <text x="840" y="365" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#FFEDE3">何を、どう置いておくか</text>

    <!-- バッジ: 今日はここ -->
    <rect x="765" y="113" width="150" height="34" rx="16" fill="#7C3527"/>
    <text x="840" y="136" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">今日はここ</text>
  </g>

  <text x="512" y="600" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" fill="#2B211D">AIの側を賢くする前に、AIが読める形に知識を置く</text>
</svg>
