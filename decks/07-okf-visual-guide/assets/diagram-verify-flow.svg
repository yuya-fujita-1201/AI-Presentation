<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="vArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3527"/>
    </marker>
    <marker id="vArrowShow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#247F7A"/>
    </marker>
    <marker id="vArrowHide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A63D32"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- ①式の一致 -->
  <g id="compare-formula">
    <text x="270" y="72" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="800" fill="#7C3527">① 式の一致</text>
    <rect x="120" y="96" width="300" height="60" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="270" y="132" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">実行された式</text>
    <rect x="120" y="176" width="300" height="60" rx="16" fill="#FCE9DC" stroke="#F0B498" stroke-width="3"/>
    <text x="270" y="212" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">公認の式（固定）</text>
    <rect x="255" y="151" width="30" height="30" fill="#FFFFFF" stroke="#B44A32" stroke-width="3" transform="rotate(45 270 166)"/>
    <text x="270" y="172" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" font-weight="800" fill="#B44A32">＝</text>
    <path d="M 270 236 C 270 300, 400 300, 460 330" fill="none" stroke="#7C3527" stroke-width="3.5" marker-end="url(#vArrow)"/>
  </g>

  <!-- ②数字の一致 -->
  <g id="compare-number">
    <text x="754" y="72" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="24" font-weight="800" fill="#7C3527">② 数字の一致</text>
    <rect x="604" y="96" width="300" height="60" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="754" y="132" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">表示する数字</text>
    <rect x="604" y="176" width="300" height="60" rx="16" fill="#FCE9DC" stroke="#F0B498" stroke-width="3"/>
    <text x="754" y="212" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">レシートの数字</text>
    <rect x="739" y="151" width="30" height="30" fill="#FFFFFF" stroke="#B44A32" stroke-width="3" transform="rotate(45 754 166)"/>
    <text x="754" y="172" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="18" font-weight="800" fill="#B44A32">＝</text>
    <path d="M 754 236 C 754 300, 624 300, 564 330" fill="none" stroke="#7C3527" stroke-width="3.5" marker-end="url(#vArrow)"/>
  </g>

  <!-- 中央: 検査プログラム（歯車・最濃） -->
  <g id="verify-gear">
    <g transform="translate(512,382)">
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527" transform="rotate(45)"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527" transform="rotate(90)"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527" transform="rotate(135)"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527" transform="rotate(180)"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527" transform="rotate(225)"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527" transform="rotate(270)"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#7C3527" transform="rotate(315)"/>
      <circle r="52" fill="#7C3527" stroke="#33231F" stroke-width="2"/>
      <text x="0" y="-4" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">検査</text>
      <text x="0" y="16" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">プログラム</text>
    </g>
  </g>

  <!-- 分岐: 表示／非表示（2択） -->
  <g id="branch-result">
    <path d="M 470 460 C 420 500, 360 520, 315 545" fill="none" stroke="#247F7A" stroke-width="5" marker-end="url(#vArrowShow)"/>
    <text x="378" y="512" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="700" fill="#247F7A">両方一致</text>

    <path d="M 554 460 C 604 500, 664 520, 709 545" fill="none" stroke="#A63D32" stroke-width="5" marker-end="url(#vArrowHide)"/>
    <text x="646" y="512" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="700" fill="#A63D32">1つでも不一致</text>

    <rect x="200" y="558" width="230" height="90" rx="20" fill="#247F7A"/>
    <text x="315" y="612" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">表示</text>

    <rect x="594" y="558" width="230" height="90" rx="20" fill="#A63D32"/>
    <text x="709" y="612" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">非表示</text>
  </g>

</svg>
