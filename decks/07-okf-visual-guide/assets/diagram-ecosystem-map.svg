<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="60" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="20" font-weight="700" fill="#7C3527">接続（MCP）× 中身（OKF）× 場所（llms.txt）</text>

  <!-- 道路＝MCP（接続）とその上を走るトラック -->
  <g id="mcp-road">
    <rect x="0" y="500" width="1024" height="140" fill="#7C3527"/>
    <line x1="40" y1="570" x2="984" y2="570" stroke="#F0B498" stroke-width="6" stroke-dasharray="42 30"/>
    <text x="230" y="552" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">MCP</text>
    <text x="230" y="578" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#FFEDE3">道路＝接続の規格</text>

    <!-- 動きを示す線 -->
    <line x1="460" y1="560" x2="500" y2="580" stroke="#F0B498" stroke-width="3" opacity="0.6"/>
    <line x1="460" y1="590" x2="500" y2="610" stroke="#F0B498" stroke-width="3" opacity="0.6"/>

    <!-- トラック：荷台 -->
    <rect x="650" y="520" width="220" height="100" rx="10" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <!-- トラック：運転席 -->
    <rect x="560" y="550" width="100" height="90" rx="12" fill="#FFF2E8" stroke="#7C3527" stroke-width="3"/>
    <rect x="575" y="565" width="35" height="30" rx="4" fill="#F0B498"/>
    <!-- 車輪 -->
    <circle cx="610" cy="620" r="20" fill="#33231F"/>
    <circle cx="610" cy="620" r="7" fill="#FFEDE3"/>
    <circle cx="800" cy="620" r="20" fill="#33231F"/>
    <circle cx="800" cy="620" r="7" fill="#FFEDE3"/>
  </g>

  <!-- 荷台の荷物＝OKF（最濃） -->
  <g id="okf-cargo">
    <rect x="690" y="402" width="140" height="118" rx="14" fill="#B44A32" stroke="#7C3527" stroke-width="4"/>
    <rect x="712" y="424" width="96" height="10" rx="4" fill="#FFEDE3"/>
    <rect x="712" y="442" width="96" height="10" rx="4" fill="#FFEDE3"/>
    <text x="760" y="488" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">OKF</text>
    <text x="760" y="508" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" fill="#FFEDE3">知識の中身</text>
  </g>

  <!-- 看板＝llms.txt（場所を示す） -->
  <g id="llmstxt-sign">
    <rect x="147" y="258" width="6" height="242" fill="#7C3527"/>
    <path d="M 90 220 H 250 L 280 255 L 250 290 H 90 Z" fill="#FFF2E8" stroke="#B44A32" stroke-width="3"/>
    <text x="185" y="248" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#7C3527">llms.txt</text>
    <text x="185" y="272" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" fill="#6F5C52">場所を示す看板</text>
  </g>
</svg>
