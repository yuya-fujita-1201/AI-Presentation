<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 入口: index.md（最濃） -->
  <rect x="422" y="40" width="180" height="64" rx="18" fill="#B44A32" stroke="#7C3527" stroke-width="4"/>
  <text x="512" y="66" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">index.md</text>
  <text x="512" y="88" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#FFEDE3">入口の目次</text>

  <!-- 入口 → 3フォルダ 接続線 -->
  <path d="M 512 104 V 150 H 180 V 190" fill="none" stroke="#7C3527" stroke-width="3"/>
  <path d="M 512 104 V 190" fill="none" stroke="#7C3527" stroke-width="3"/>
  <path d="M 512 104 V 150 H 844 V 190" fill="none" stroke="#7C3527" stroke-width="3"/>

  <!-- フォルダ1: 用語集/ -->
  <g id="folder-1">
    <rect x="70" y="190" width="220" height="70" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="180" y="233" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="23" font-weight="700" fill="#7C3527">用語集/</text>

    <path d="M 180 260 V 285 H 98 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 180 260 V 285 H 262 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>

    <rect x="23" y="330" width="150" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="98" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">解約率.md</text>

    <rect x="187" y="330" width="150" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="262" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">顧客定義.md</text>
  </g>

  <!-- フォルダ2: 手順/ -->
  <g id="folder-2">
    <rect x="402" y="190" width="220" height="70" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="512" y="233" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="23" font-weight="700" fill="#7C3527">手順/</text>

    <path d="M 512 260 V 285 H 430 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 512 260 V 285 H 594 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>

    <rect x="355" y="330" width="150" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="430" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">返品対応.md</text>

    <rect x="519" y="330" width="150" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
