<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 入口: index.md（最濃） -->
  <rect x="422" y="40" width="180" height="64" rx="18" fill="#B44A32" stroke="#7C3527" stroke-width="4"/>
  <text x="512" y="66" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">index.md</text>
  <text x="512" y="88" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" fill="#FFEDE3">入口（バンドル直下）</text>

  <!-- okf_version バッジ -->
  <line x1="602" y1="70" x2="656" y2="60" stroke="#B44A32" stroke-width="2.5"/>
  <rect x="656" y="34" width="330" height="42" rx="21" fill="#F0B498" stroke="#B44A32" stroke-width="2"/>
  <text x="821" y="60" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" font-weight="700" fill="#7C3527">okf_versionを書ける唯一の場所</text>

  <!-- 入口 → 3フォルダ 接続線 -->
  <path d="M 512 104 V 150 H 180 V 190" fill="none" stroke="#7C3527" stroke-width="3"/>
  <path d="M 512 104 V 190" fill="none" stroke="#7C3527" stroke-width="3"/>
  <path d="M 512 104 V 150 H 844 V 190" fill="none" stroke="#7C3527" stroke-width="3"/>

  <!-- フォルダ1: 用語集/ -->
  <g id="folder-1">
    <rect x="70" y="190" width="220" height="70" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="180" y="233" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="23" font-weight="700" fill="#7C3527">用語集/</text>

    <path d="M 180 260 V 285 H 108 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 180 260 V 285 H 252 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>

    <rect x="43" y="330" width="130" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="108" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#2B211D">解約率.md</text>

    <rect x="187" y="330" width="130" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="252" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#2B211D">顧客定義.md</text>
  </g>

  <!-- フォルダ2: 手順/ -->
  <g id="folder-2">
    <rect x="402" y="190" width="220" height="70" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="512" y="233" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="23" font-weight="700" fill="#7C3527">手順/</text>

    <path d="M 512 260 V 285 H 440 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 512 260 V 285 H 584 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>

    <rect x="375" y="330" width="130" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="440" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#2B211D">返品対応.md</text>

    <rect x="519" y="330" width="130" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="584" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#2B211D">確認手順.md</text>
  </g>

  <!-- フォルダ3: FAQ/ -->
  <g id="folder-3">
    <rect x="734" y="190" width="220" height="70" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="844" y="233" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="23" font-weight="700" fill="#7C3527">FAQ/</text>

    <path d="M 844 260 V 285 H 772 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 844 260 V 285 H 916 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>

    <rect x="707" y="330" width="130" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="772" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#2B211D">質問集.md</text>

    <rect x="851" y="330" width="130" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="916" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="16" fill="#2B211D">用語FAQ.md</text>
  </g>

  <!-- 相互リンク（横方向の細い破線）3本 -->
  <g id="link-1">
    <path d="M 108 384 C 108 460, 772 460, 772 384" fill="none" stroke="#C17A27" stroke-width="2" stroke-dasharray="7 6"/>
  </g>
  <g id="link-2">
    <path d="M 440 384 C 440 440, 916 440, 916 384" fill="none" stroke="#C17A27" stroke-width="2" stroke-dasharray="7 6"/>
  </g>
  <g id="link-3">
    <path d="M 252 384 C 252 418, 584 418, 584 384" fill="none" stroke="#C17A27" stroke-width="2" stroke-dasharray="7 6"/>
  </g>

  <!-- 凡例 -->
  <line x1="120" y1="712" x2="160" y2="712" stroke="#7C3527" stroke-width="3"/>
  <text x="170" y="717" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" fill="#6F5C52">階層（フォルダ構造）</text>
  <line x1="430" y1="712" x2="470" y2="712" stroke="#C17A27" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="480" y="717" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" fill="#6F5C52">相互リンク（関連）</text>
</svg>
