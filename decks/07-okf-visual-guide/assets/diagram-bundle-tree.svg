  </g>

  <!-- フォルダ3: FAQ/ -->
  <g id="folder-3">
    <rect x="734" y="190" width="220" height="70" rx="16" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
    <text x="844" y="233" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="23" font-weight="700" fill="#7C3527">FAQ/</text>

    <path d="M 844 260 V 285 H 762 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>
    <path d="M 844 260 V 285 H 926 V 330" fill="none" stroke="#7C3527" stroke-width="2.5"/>

    <rect x="687" y="330" width="150" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="762" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">質問集.md</text>

    <rect x="851" y="330" width="150" height="54" rx="14" fill="#FFFFFF" stroke="#F0B498" stroke-width="2.5"/>
    <text x="926" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="19" fill="#2B211D">用語FAQ.md</text>
  </g>

  <!-- 相互リンク（横方向の細い破線）3本 -->
  <g id="link-1">
    <path d="M 98 384 C 98 460, 762 460, 762 384" fill="none" stroke="#C17A27" stroke-width="2" stroke-dasharray="7 6"/>
  </g>
  <g id="link-2">
    <path d="M 430 384 C 430 440, 926 440, 926 384" fill="none" stroke="#C17A27" stroke-width="2" stroke-dasharray="7 6"/>
  </g>
  <g id="link-3">
    <path d="M 262 384 C 262 418, 594 418, 594 384" fill="none" stroke="#C17A27" stroke-width="2" stroke-dasharray="7 6"/>
  </g>

  <!-- 凡例 -->
  <line x1="120" y1="712" x2="160" y2="712" stroke="#7C3527" stroke-width="3"/>
  <text x="170" y="717" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#6F5C52">階層（フォルダ構造）</text>
  <line x1="430" y1="712" x2="470" y2="712" stroke="#C17A27" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="480" y="717" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" fill="#6F5C52">相互リンク（関連）</text>
</svg>
