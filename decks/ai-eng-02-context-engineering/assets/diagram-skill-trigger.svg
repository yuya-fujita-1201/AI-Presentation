<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B44A32"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B98A2F"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 依頼 -->
  <rect x="72" y="52" width="336" height="76" rx="18" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
  <text x="240" y="84" text-anchor="middle" class="h" font-size="19" fill="#B44A32">今回の依頼</text>
  <text x="240" y="112" text-anchor="middle" font-size="18">「経費精算のやり方を教えて」</text>

  <!-- 常時：スキル一覧 -->
  <text x="140" y="206" class="h" font-size="20" fill="#247F7A">常時読み込み：一覧（名前と説明）だけ</text>
  <rect x="72" y="224" width="336" height="304" rx="16" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/>
  <!-- 行1（一致） -->
  <rect x="96" y="252" width="288" height="76" rx="10" fill="#F6EAD9" stroke="#B98A2F" stroke-width="3"/>
  <text x="112" y="284" class="h" font-size="17" fill="#B98A2F">経費精算</text>
  <text x="112" y="312" class="m" font-size="14">申請手順と締め日を案内する</text>
  <!-- 行2 -->
  <rect x="96" y="340" width="288" height="76" rx="10" fill="#FFFFFF"/>
  <text x="112" y="372" class="h" font-size="17">議事録整形</text>
  <text x="112" y="400" class="m" font-size="14">決定・宿題・期限の形式に直す</text>
  <!-- 行3 -->
  <rect x="96" y="428" width="288" height="76" rx="10" fill="#FFFFFF"/>
  <text x="112" y="460" class="h" font-size="17">資料レビュー</text>
  <text x="112" y="488" class="m" font-size="14">社内チェック観点で確認する</text>

  <line x1="100" y1="128" x2="100" y2="216" stroke="#B44A32" stroke-width="5" marker-end="url(#arrR)"/>

  <!-- 一致ラベル -->
  <line x1="384" y1="290" x2="548" y2="290" stroke="#B98A2F" stroke-width="5" stroke-dasharray="4 7" marker-end="url(#arrG)"/>
  <text x="466" y="266" text-anchor="middle" class="h" font-size="18" fill="#B98A2F">条件に一致</text>

  <!-- 本文読み込み -->
  <rect x="560" y="128" width="392" height="324" rx="18" fill="#F6EAD9" stroke="#B98A2F" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="756" y="172" text-anchor="middle" class="h" font-size="22" fill="#B98A2F">この時だけ、本文を読み込む</text>
  <rect x="596" y="196" width="320" height="152" rx="12" fill="#FFFFFF"/>
  <text x="612" y="228" class="h" font-size="16">経費精算の手順書</text>
  <rect x="612" y="248" width="272" height="8" rx="4" fill="#B98A2F"/>
  <rect x="612" y="270" width="248" height="8" rx="4" fill="#B98A2F"/>
  <rect x="612" y="292" width="264" height="8" rx="4" fill="#B98A2F"/>
  <rect x="612" y="314" width="224" height="8" rx="4" fill="#B98A2F"/>
  <text x="756" y="384" text-anchor="middle" class="m" font-size="16">さらに詳しい添付ファイルは、</text>
  <text x="756" y="410" text-anchor="middle" class="m" font-size="16">必要になった時だけ読む</text>

  <!-- 関係ない時 -->
  <rect x="560" y="480" width="392" height="72" rx="16" fill="#FFFFFF" stroke="#6F5C52" stroke-width="2"/>
  <text x="756" y="510" text-anchor="middle" class="m" font-size="16">関係ない依頼の時は、一覧に載っているだけ。</text>
  <text x="756" y="536" text-anchor="middle" class="m" font-size="16">本文はコンテキストに入らない</text>

  <!-- 補足 -->
  <text x="512" y="596" text-anchor="middle" class="m" font-size="17">ルールファイルから切り出した「たまに使う手順・仕様」の受け皿になる</text>

  <!-- 下部メッセージ -->
  <rect x="72" y="632" width="880" height="96" rx="24" fill="#7C3527"/>
  <text x="512" y="672" text-anchor="middle" class="h w" font-size="26" fill="#FFFFFF">一覧だけ常設、本文は条件が合った時だけ</text>
  <text x="512" y="708" text-anchor="middle" font-size="20" fill="#F6C9B8">常設コストを増やさずに、詳しいノウハウを持てる</text>
</svg>
