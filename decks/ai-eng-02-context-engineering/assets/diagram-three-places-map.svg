<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="740" viewBox="0 0 1024 740">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B44A32"/>
    </marker>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#247F7A"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#C17A27"/>
    </marker>
  </defs>
  <rect width="1024" height="740" fill="#FFF9F3"/>

  <!-- 3つの置き場所 -->
  <rect x="32" y="60" width="280" height="140" rx="24" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
  <text x="172" y="120" text-anchor="middle" class="h" font-size="27" fill="#B44A32">①プロンプト</text>
  <text x="172" y="160" text-anchor="middle" class="m" font-size="20">都度、その場で書く</text>

  <rect x="344" y="60" width="280" height="140" rx="24" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
  <text x="484" y="120" text-anchor="middle" class="h" font-size="27" fill="#247F7A">②ルールファイル</text>
  <text x="484" y="160" text-anchor="middle" class="m" font-size="20">必ず読み込まれる</text>

  <rect x="656" y="60" width="336" height="140" rx="24" fill="#F6E6CF" stroke="#C17A27" stroke-width="4"/>
  <text x="824" y="120" text-anchor="middle" class="h" font-size="27">③条件付きの仕組み</text>
  <text x="824" y="160" text-anchor="middle" class="m" font-size="20">合致した時だけ読まれる</text>

  <text x="900" y="222" text-anchor="middle" class="m" font-size="17">基礎編では考え方だけ</text>
  <text x="900" y="246" text-anchor="middle" class="m" font-size="17">詳細は応用編で</text>

  <!-- 3本の矢印（各1パス・各1矢頭） -->
  <path d="M172 200 C172 340 300 470 400 550" fill="none" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrA)"/>
  <path d="M484 200 C490 340 505 460 512 550" fill="none" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrT)"/>
  <path d="M700 200 C650 300 636 440 624 550" fill="none" stroke="#C17A27" stroke-width="5" stroke-linecap="round" marker-end="url(#arrG)"/>

  <!-- 共通の到達点 -->
  <rect x="282" y="555" width="460" height="150" rx="28" fill="#7C3527"/>
  <circle cx="512" cy="597" r="26" fill="#FFFFFF"/>
  <text x="512" y="605" text-anchor="middle" class="h" font-size="22" fill="#7C3527">AI</text>
  <text x="512" y="672" text-anchor="middle" class="h w" font-size="25">AIが今回参照するコンテキスト</text>
</svg>
