<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- コンテキスト全体の枠（＝CEが整える範囲） -->
  <rect x="40" y="36" width="944" height="470" rx="28" fill="#DDEFEA" fill-opacity="0.55" stroke="#247F7A" stroke-width="6"/>
  <text x="512" y="92" text-anchor="middle" class="h" font-size="34" fill="#247F7A">コンテキスト</text>
  <text x="512" y="130" text-anchor="middle" class="m" font-size="22">＝ AIが実際に見ている情報ぜんぶ</text>

  <!-- 左：プロンプト（＝PEが整える範囲） -->
  <rect x="84" y="164" width="392" height="300" rx="22" fill="#FADFD5" stroke="#B44A32" stroke-width="5"/>
  <rect x="104" y="184" width="352" height="48" rx="14" fill="#B44A32"/>
  <text x="280" y="216" text-anchor="middle" class="h w" font-size="23" fill="#FFFFFF">あなたが都度渡す</text>
  <text x="280" y="282" text-anchor="middle" class="h" font-size="30" fill="#B44A32">プロンプト</text>
  <text x="280" y="330" text-anchor="middle" font-size="22">質問・指示・作業手順</text>
  <text x="280" y="368" text-anchor="middle" font-size="22">形式・禁止事項・例</text>
  <text x="280" y="406" text-anchor="middle" font-size="22">材料・画像・ファイル</text>
  <text x="280" y="446" text-anchor="middle" class="m" font-size="20">シリーズ01で学んだ範囲</text>

  <!-- 右：システムが裏で足す -->
  <rect x="524" y="164" width="416" height="300" rx="22" fill="#FFFFFF" stroke="#247F7A" stroke-width="5"/>
  <rect x="544" y="184" width="376" height="48" rx="14" fill="#247F7A"/>
  <text x="732" y="216" text-anchor="middle" class="h w" font-size="23" fill="#FFFFFF">システムが裏で足す</text>
  <text x="732" y="288" text-anchor="middle" font-size="22">システム指示・会話履歴</text>
  <text x="732" y="332" text-anchor="middle" font-size="22">ルールファイル・メモリ</text>
  <text x="732" y="376" text-anchor="middle" font-size="22">検索資料・ツールの結果</text>
  <text x="732" y="446" text-anchor="middle" class="m" font-size="20">頼まなくても自動で入る</text>

  <!-- PEブラケット：プロンプトの箱の幅だけ -->
  <path d="M 84 528 L 84 544 L 476 544 L 476 528" fill="none" stroke="#B44A32" stroke-width="5"/>
  <line x1="280" y1="544" x2="280" y2="558" stroke="#B44A32" stroke-width="5"/>
  <text x="280" y="592" text-anchor="middle" class="h" font-size="27" fill="#B44A32">プロンプトエンジニアリング</text>
  <text x="280" y="624" text-anchor="middle" class="m" font-size="21">「プロンプト」の箱を整える</text>

  <!-- CEブラケット：コンテキストの箱ぜんぶ -->
  <path d="M 40 652 L 40 668 L 984 668 L 984 652" fill="none" stroke="#247F7A" stroke-width="5"/>
  <line x1="512" y1="668" x2="512" y2="682" stroke="#247F7A" stroke-width="5"/>
  <text x="512" y="716" text-anchor="middle" class="h" font-size="27" fill="#247F7A">コンテキストエンジニアリング</text>
  <text x="512" y="748" text-anchor="middle" class="m" font-size="21">箱ぜんぶ（プロンプト＋裏で足す情報）を整える</text>
</svg>
