<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <circle cx="390" cy="350" r="236" fill="#FADFD5" fill-opacity="0.9" stroke="#B44A32" stroke-width="6"/>
  <circle cx="634" cy="350" r="236" fill="#DDEFEA" fill-opacity="0.82" stroke="#247F7A" stroke-width="6"/>

  <text x="270" y="254" text-anchor="middle" class="h" font-size="37" fill="#B44A32">プロンプト</text>
  <text x="260" y="309" text-anchor="middle" font-size="27">作業・形式</text>
