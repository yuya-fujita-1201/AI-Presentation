<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="740" viewBox="0 0 1024 740">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="pvrPrimary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7C3527"/>
    </marker>
    <marker id="pvrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#247F7A"/>
    </marker>
    <marker id="pvrDanger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#A63D32"/>
    </marker>
  </defs>
  <rect width="1024" height="740" fill="#FFF9F3"/>

  <!-- 左: 置いてある -->
  <rect x="40" y="68" width="280" height="220" rx="24" fill="#FCE9DC" stroke="#7C3527" stroke-width="4"/>
  <rect x="76" y="90" width="70" height="20" rx="6" fill="#7C3527"/>
  <rect x="60" y="108" width="200" height="98" rx="16" fill="#FFFFFF" stroke="#7C3527" stroke-width="4"/>
  <line x1="84" y1="132" x2="236" y2="132" stroke="#D9B49A" stroke-width="6" stroke-linecap="round"/>
  <line x1="84" y1="152" x2="236" y2="152" stroke="#D9B49A" stroke-width="6" stroke-linecap="round"/>
  <line x1="84" y1="172" x2="236" y2="172" stroke="#D9B49A" stroke-width="6" stroke-linecap="round"/>
  <text x="180" y="230" text-anchor="middle" class="h" font-size="22">置いてある</text>
  <text x="180" y="254" text-anchor="middle" class="m" font-size="16">（CLAUDE.md／</text>
  <text x="180" y="274" text-anchor="middle" class="m" font-size="16">ルールファイル）</text>

  <path d="M322 175H458" fill="none" stroke="#7C3527" stroke-width="5" stroke-linecap="round" marker-end="url(#pvrPrimary)"/>

  <!-- 中央: 分岐ゲート -->
  <circle cx="560" cy="175" r="95" fill="#7C3527"/>
  <text x="560" y="167" text-anchor="middle" class="h w" font-size="24">今回、</text>
  <text x="560" y="197" text-anchor="middle" class="h w" font-size="24">読まれた？</text>

  <path d="M644 130C700 112 726 110 756 110" fill="none" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#pvrTeal)"/>
  <path d="M644 220C700 250 726 268 756 276" fill="none" stroke="#A63D32" stroke-width="5" stroke-linecap="round" marker-end="url(#pvrDanger)"/>

  <!-- 右上: 反映されている -->
  <rect x="760" y="50" width="224" height="140" rx="24" fill="#E1F2F0" stroke="#247F7A" stroke-width="4"/>
  <circle cx="872" cy="92" r="22" fill="#247F7A"/>
  <path d="M861 92L869 100L884 78" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="872" y="136" text-anchor="middle" class="h" font-size="19">コンテキストに反映</text>

  <!-- 右下: 効いていない -->
  <rect x="760" y="222" width="224" height="140" rx="24" fill="#FADFD5" stroke="#A63D32" stroke-width="4"/>
  <circle cx="872" cy="264" r="22" fill="#A63D32"/>
  <path d="M861 253L883 275" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M883 253L861 275" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <text x="872" y="308" text-anchor="middle" class="h" font-size="19">効いていない</text>

  <path d="M872 362C872 388 700 392 560 396" fill="none" stroke="#A63D32" stroke-width="5" stroke-linecap="round" marker-end="url(#pvrDanger)"/>
  <text x="512" y="420" text-anchor="middle" class="h" font-size="21" fill="#A63D32">効いていない、主な原因は3つ</text>

  <!-- 下段: 3つの原因 -->
  <rect x="56" y="444" width="290" height="112" rx="20" fill="#FCE9DC" stroke="#B44A32" stroke-width="3"/>
  <circle cx="201" cy="478" r="20" fill="#B44A32"/>
  <text x="201" y="485" text-anchor="middle" class="h w" font-size="18">1</text>
  <text x="201" y="522" text-anchor="middle" font-size="18">長い・曖昧で埋もれる</text>

  <rect x="368" y="444" width="290" height="112" rx="20" fill="#F6E6CF" stroke="#C17A27" stroke-width="3"/>
  <circle cx="513" cy="478" r="20" fill="#C17A27"/>
  <text x="513" y="485" text-anchor="middle" class="h" font-size="18">2</text>
  <text x="513" y="508" text-anchor="middle" font-size="18">条件（トリガー）が</text>
  <text x="513" y="530" text-anchor="middle" font-size="18">合わない</text>

  <rect x="680" y="444" width="290" height="112" rx="20" fill="#FADFD5" stroke="#A63D32" stroke-width="3"/>
  <circle cx="825" cy="478" r="20" fill="#A63D32"/>
  <text x="825" y="485" text-anchor="middle" class="h w" font-size="18">3</text>
  <text x="825" y="522" text-anchor="middle" font-size="18">矛盾 → ランダムに従う</text>

  <!-- 最下部: 確認のしかた -->
  <rect x="60" y="610" width="904" height="70" rx="20" fill="#7C3527"/>
  <text x="512" y="653" text-anchor="middle" class="h w" font-size="20">確認のしかた：AIの答え・引用のされ方を見る</text>
</svg>
