<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#247F7A"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <text x="512" y="56" text-anchor="middle" class="h" font-size="24">会話のたびに、決定・好み・前提がメモリへ溜まっていく</text>

  <!-- 段階1 -->
  <text x="196" y="118" text-anchor="middle" class="h" font-size="20" fill="#B44A32">使いはじめ</text>
  <rect x="88" y="140" width="216" height="230" rx="16" fill="#FFFFFF" stroke="#B44A32" stroke-width="4"/>
  <text x="196" y="176" text-anchor="middle" class="h" font-size="17">メモリ</text>
  <rect x="112" y="196" width="168" height="10" rx="5" fill="#D8C7BD"/>
  <text x="196" y="340" text-anchor="middle" class="m" font-size="15">ほぼ空</text>
  <text x="196" y="412" text-anchor="middle" class="m" font-size="16">毎回ゼロから</text>
  <text x="196" y="438" text-anchor="middle" class="m" font-size="16">説明する</text>

  <line x1="316" y1="255" x2="392" y2="255" stroke="#247F7A" stroke-width="5" marker-end="url(#arrT)"/>

  <!-- 段階2 -->
  <text x="512" y="118" text-anchor="middle" class="h" font-size="20" fill="#B98A2F">使い込むうち</text>
  <rect x="404" y="140" width="216" height="230" rx="16" fill="#F6EAD9" stroke="#B98A2F" stroke-width="4"/>
  <text x="512" y="176" text-anchor="middle" class="h" font-size="17">メモリ</text>
  <rect x="428" y="196" width="168" height="10" rx="5" fill="#B98A2F"/>
  <rect x="428" y="222" width="152" height="10" rx="5" fill="#B98A2F"/>
  <rect x="428" y="248" width="160" height="10" rx="5" fill="#B98A2F"/>
  <rect x="428" y="274" width="140" height="10" rx="5" fill="#D8C7BD"/>
  <text x="512" y="340" text-anchor="middle" class="m" font-size="15">決定・好み・言い回し</text>
  <text x="512" y="412" text-anchor="middle" class="m" font-size="16">前置きが</text>
  <text x="512" y="438" text-anchor="middle" class="m" font-size="16">減っていく</text>

  <line x1="632" y1="255" x2="708" y2="255" stroke="#247F7A" stroke-width="5" marker-end="url(#arrT)"/>

  <!-- 段階3 -->
  <text x="828" y="118" text-anchor="middle" class="h" font-size="20" fill="#247F7A">手に馴染む</text>
  <rect x="720" y="140" width="216" height="230" rx="16" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/>
  <text x="828" y="176" text-anchor="middle" class="h" font-size="17">メモリ</text>
  <rect x="744" y="196" width="168" height="10" rx="5" fill="#247F7A"/>
  <rect x="744" y="222" width="152" height="10" rx="5" fill="#247F7A"/>
  <rect x="744" y="248" width="164" height="10" rx="5" fill="#247F7A"/>
  <rect x="744" y="274" width="144" height="10" rx="5" fill="#247F7A"/>
  <rect x="744" y="300" width="156" height="10" rx="5" fill="#247F7A"/>
  <text x="828" y="344" text-anchor="middle" class="m" font-size="15">あなたの「いつも」</text>
  <text x="828" y="412" text-anchor="middle" class="m" font-size="16">言わなくても</text>
  <text x="828" y="438" text-anchor="middle" class="m" font-size="16">通じる</text>

  <!-- 人格設定カード -->
  <rect x="140" y="486" width="744" height="104" rx="18" fill="#FFFFFF" stroke="#7C3527" stroke-width="3"/>
  <text x="512" y="528" text-anchor="middle" class="h" font-size="20" fill="#7C3527">役割・振る舞いの置き場所にもなる</text>
  <text x="512" y="562" text-anchor="middle" class="m" font-size="17">例：「プロのコンサルタントとして振る舞う」「結論から話す」</text>

  <!-- 下部メッセージ -->
  <rect x="72" y="632" width="880" height="96" rx="24" fill="#7C3527"/>
  <text x="512" y="672" text-anchor="middle" class="h w" font-size="26" fill="#FFFFFF">使うほど蓄積し、あなたに寄り添うエージェントになる</text>
  <text x="512" y="708" text-anchor="middle" font-size="20" fill="#F6C9B8">誤った記憶も読み戻される──訂正・削除までが運用</text>
</svg>
