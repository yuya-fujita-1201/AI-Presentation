<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3527"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>

  <!-- 見出し -->
  <text x="248" y="64" text-anchor="middle" class="h" font-size="27" fill="#B44A32">PEの5つの要素</text>
  <text x="248" y="98" text-anchor="middle" class="m" font-size="20">依頼文の「書く欄」</text>
  <text x="776" y="64" text-anchor="middle" class="h" font-size="27" fill="#247F7A">CEの5項目</text>
  <text x="776" y="98" text-anchor="middle" class="m" font-size="20">欄に入れる「中身」を探す観点</text>

  <!-- 対応する3組 -->
  <rect x="96" y="130" width="304" height="66" rx="16" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
  <text x="248" y="173" text-anchor="middle" class="h" font-size="26">なぜ</text>
  <rect x="624" y="130" width="304" height="66" rx="16" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/>
  <text x="776" y="173" text-anchor="middle" class="h" font-size="26">目的</text>
  <line x1="404" y1="163" x2="616" y2="163" stroke="#7C3527" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="96" y="216" width="304" height="66" rx="16" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
  <text x="248" y="259" text-anchor="middle" class="h" font-size="26">材料</text>
  <rect x="624" y="216" width="304" height="66" rx="16" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/>
  <text x="776" y="259" text-anchor="middle" class="h" font-size="26">既存資産</text>
  <line x1="404" y1="249" x2="616" y2="249" stroke="#7C3527" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="96" y="302" width="304" height="66" rx="16" fill="#FADFD5" stroke="#B44A32" stroke-width="4"/>
  <text x="248" y="345" text-anchor="middle" class="h" font-size="26">守ること</text>
  <rect x="624" y="302" width="304" height="66" rx="16" fill="#DDEFEA" stroke="#247F7A" stroke-width="4"/>
  <text x="776" y="345" text-anchor="middle" class="h" font-size="26">制約</text>
  <line x1="404" y1="335" x2="616" y2="335" stroke="#7C3527" stroke-width="4" marker-end="url(#arr)"/>

  <!-- PE側に残る2欄 -->
  <rect x="96" y="404" width="304" height="88" rx="16" fill="#FFFFFF" stroke="#C9BAB2" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="248" y="441" text-anchor="middle" class="h" font-size="24" fill="#6F5C52">やること・返し方</text>
  <text x="248" y="474" text-anchor="middle" class="m" font-size="19">頼み方の欄のまま（PEの担当）</text>

  <!-- CEで新登場 -->
  <rect x="624" y="404" width="304" height="88" rx="16" fill="#DDEFEA" stroke="#247F7A" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="776" y="441" text-anchor="middle" class="h" font-size="24" fill="#247F7A">読み手・状況</text>
  <text x="776" y="474" text-anchor="middle" class="m" font-size="19">独立させた点検観点</text>

  <!-- 下部メッセージ -->
  <rect x="88" y="556" width="848" height="150" rx="24" fill="#7C3527"/>
  <text x="512" y="616" text-anchor="middle" class="h w" font-size="28" fill="#FFFFFF">5つの要素＝依頼文の「書く欄」</text>
  <text x="512" y="668" text-anchor="middle" class="h" font-size="28" fill="#F6C9B8">5項目＝欄に入れる中身（AIが知らない前提）を探す観点</text>
</svg>
