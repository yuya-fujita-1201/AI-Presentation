<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="740" viewBox="0 0 1024 740">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrowDanger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#A63D32"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#247F7A"/>
    </marker>
  </defs>
  <rect width="1024" height="740" fill="#FFF9F3"/>

  <text x="512" y="40" text-anchor="middle" class="m" font-size="22">2025年7月・Replit の実例</text>

  <!-- 中央の対比マーカー -->
  <rect x="436" y="355" width="152" height="40" rx="20" fill="#F6E6CF" stroke="#C17A27" stroke-width="2"/>
  <text x="512" y="381" text-anchor="middle" font-size="16">同じ『禁止』でも</text>

  <!-- ============ 左パネル：ルールファイル＝助言 ============ -->
  <rect x="48" y="90" width="380" height="570" rx="28" fill="#FFFFFF" stroke="#A63D32" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="238" y="150" text-anchor="middle" class="h" font-size="26" fill="#A63D32">ルールファイル＝助言</text>

  <!-- エージェントのピクトグラム -->
  <circle cx="140" cy="222" r="24" fill="#FFFFFF" stroke="#A63D32" stroke-width="3.5"/>
  <rect x="102" y="254" width="76" height="40" rx="20" fill="#FFFFFF" stroke="#A63D32" stroke-width="3.5"/>

  <!-- 吹き出し「コード変更禁止」 -->
  <path d="M195 228L165 218L210 228Z" fill="#FFFFFF" stroke="#A63D32" stroke-width="3"/>
  <rect x="180" y="168" width="210" height="60" rx="16" fill="#FFFFFF" stroke="#A63D32" stroke-width="3"/>
  <text x="285" y="205" text-anchor="middle" font-size="19">コード変更禁止</text>

  <!-- 助言止まりであることの比喩：破線境界 -->
  <line x1="80" y1="326" x2="396" y2="326" stroke="#A63D32" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 境界を突き破ってデータベースへ -->
  <path d="M140 298Q195 330 238 386" fill="none" stroke="#A63D32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowDanger)"/>

  <!-- データベース記号（破損・警告色） -->
  <ellipse cx="238" cy="396" rx="48" ry="15" fill="#A63D32"/>
  <rect x="190" y="396" width="96" height="56" fill="#A63D32"/>
  <path d="M190 452A48 15 0 0 0 286 452" fill="#A63D32"/>

  <text x="238" y="490" text-anchor="middle" font-size="19">本番データベース削除</text>
  <text x="238" y="513" text-anchor="middle" class="m" font-size="16">経営幹部約1,200人・企業約1,190社分</text>

  <text x="238" y="625" text-anchor="middle" class="h" font-size="20" fill="#A63D32">常設しても、破られうる</text>

  <!-- ============ 右パネル：権限設定＝強制 ============ -->
  <rect x="596" y="90" width="380" height="570" rx="28" fill="#FFFFFF" stroke="#247F7A" stroke-width="5"/>
  <text x="786" y="150" text-anchor="middle" class="h" font-size="26" fill="#247F7A">権限設定＝強制</text>

  <!-- 同じエージェントのピクトグラム -->
  <circle cx="688" cy="222" r="24" fill="#FFFFFF" stroke="#247F7A" stroke-width="3.5"/>
  <rect x="650" y="254" width="76" height="40" rx="20" fill="#FFFFFF" stroke="#247F7A" stroke-width="3.5"/>

  <!-- 壁の手前で止まる矢印 -->
  <path d="M688 298C740 330,820 335,884 338" fill="none" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowTeal)"/>

  <!-- 壁（ゲート）アイコン：実線塗り -->
  <rect x="886" y="180" width="56" height="320" rx="12" fill="#247F7A"/>
  <line x1="894" y1="260" x2="932" y2="260" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="894" y1="340" x2="932" y2="340" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="894" y1="420" x2="932" y2="420" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- 許可リスト／確認必須 -->
  <rect x="650" y="380" width="100" height="40" rx="12" fill="#E1F2F0" stroke="#247F7A" stroke-width="2"/>
  <text x="700" y="406" text-anchor="middle" font-size="18">許可リスト</text>
  <rect x="762" y="380" width="100" height="40" rx="12" fill="#E1F2F0" stroke="#247F7A" stroke-width="2"/>
  <text x="812" y="406" text-anchor="middle" font-size="18">確認必須</text>

  <text x="786" y="625" text-anchor="middle" class="h" font-size="20" fill="#247F7A">技術的にブロックされる</text>
</svg>
