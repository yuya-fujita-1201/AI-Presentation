<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="740" viewBox="0 0 1024 740">
  <defs>
    <style>
      text{font-family:'Hiragino Sans',Arial,sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}
    </style>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B44A32"/>
    </marker>
  </defs>
  <rect width="1024" height="740" fill="#FFF9F3"/>

  <text x="512" y="54" text-anchor="middle" class="h" font-size="26" fill="#7C3527">コンテキストに置くレビューテンプレート</text>

  <!-- レビュアー（最小限の人物ピクトグラム） -->
  <circle cx="100" cy="330" r="20" fill="#FFFFFF" stroke="#7C3527" stroke-width="3.5"/>
  <rect x="68" y="354" width="64" height="52" rx="26" fill="#FFFFFF" stroke="#7C3527" stroke-width="3.5"/>
  <text x="100" y="428" text-anchor="middle" class="m" font-size="16">レビュアー</text>

  <!-- テンプレート箱 -->
  <rect x="150" y="140" width="240" height="460" rx="24" fill="#FFFFFF" stroke="#7C3527" stroke-width="4"/>
  <text x="270" y="182" text-anchor="middle" class="h" font-size="22" fill="#7C3527">テンプレート</text>

  <rect x="180" y="206" width="180" height="82" rx="16" fill="#FCE9DC"/>
  <text x="270" y="254" text-anchor="middle" class="h" font-size="20">重大度</text>

  <rect x="180" y="302" width="180" height="82" rx="16" fill="#FCE9DC"/>
  <text x="270" y="350" text-anchor="middle" class="h" font-size="20">指摘</text>

  <rect x="180" y="398" width="180" height="82" rx="16" fill="#FCE9DC"/>
  <text x="270" y="446" text-anchor="middle" class="h" font-size="20">修正案</text>

  <rect x="180" y="494" width="180" height="82" rx="16" fill="#FCE9DC"/>
  <text x="270" y="542" text-anchor="middle" class="h" font-size="20">根拠</text>

  <!-- 矢印：毎回同じ形式で返る -->
  <text x="498" y="350" text-anchor="middle" font-size="19" fill="#B44A32">毎回同じ形式で返る</text>
  <path d="M390 370H606" fill="none" stroke="#B44A32" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowAccent)"/>

  <!-- 出力カード1 -->
  <rect x="618" y="140" width="118" height="460" rx="20" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
  <circle cx="716" cy="164" r="9" fill="#247F7A"/>
  <path d="M712 164L715 167L721 160" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="677" y="196" text-anchor="middle" class="h" font-size="20">レビュー1</text>
  <text x="677" y="256" text-anchor="middle" class="m" font-size="16">重大度</text>
  <text x="677" y="306" text-anchor="middle" class="m" font-size="16">指摘</text>
  <text x="677" y="356" text-anchor="middle" class="m" font-size="16">修正案</text>
  <text x="677" y="406" text-anchor="middle" class="m" font-size="16">根拠</text>

  <!-- 出力カード2 -->
  <rect x="752" y="140" width="118" height="460" rx="20" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
  <circle cx="850" cy="164" r="9" fill="#247F7A"/>
  <path d="M846 164L849 167L855 160" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="811" y="196" text-anchor="middle" class="h" font-size="20">レビュー2</text>
  <text x="811" y="256" text-anchor="middle" class="m" font-size="16">重大度</text>
  <text x="811" y="306" text-anchor="middle" class="m" font-size="16">指摘</text>
  <text x="811" y="356" text-anchor="middle" class="m" font-size="16">修正案</text>
  <text x="811" y="406" text-anchor="middle" class="m" font-size="16">根拠</text>

  <!-- 出力カード3 -->
  <rect x="886" y="140" width="118" height="460" rx="20" fill="#FFFFFF" stroke="#247F7A" stroke-width="3"/>
  <circle cx="984" cy="164" r="9" fill="#247F7A"/>
  <path d="M980 164L983 167L989 160" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="945" y="196" text-anchor="middle" class="h" font-size="20">レビュー3</text>
  <text x="945" y="256" text-anchor="middle" class="m" font-size="16">重大度</text>
  <text x="945" y="306" text-anchor="middle" class="m" font-size="16">指摘</text>
  <text x="945" y="356" text-anchor="middle" class="m" font-size="16">修正案</text>
  <text x="945" y="406" text-anchor="middle" class="m" font-size="16">根拠</text>

  <text x="512" y="690" text-anchor="middle" class="m" font-size="17">比較・蓄積・見落とし確認ができる</text>
</svg>
