  </g>

  <g>
    <text x="814" y="156" text-anchor="middle" class="h" font-size="34" fill="#C17A27">どれだけ</text>
    <circle cx="814" cy="322" r="108" fill="#F6E6CF" stroke="#C17A27" stroke-width="5"/>
    <circle cx="814" cy="322" r="22" fill="#C17A27"/>
    <path d="M814 322L760 268" stroke="#C17A27" stroke-width="10" stroke-linecap="round"/>
    <path d="M814 194V218M732 228L749 245M696 322H720M732 416L749 399M814 426V450M896 416L879 399M932 322H908M896 228L879 245" stroke="#7C3527" stroke-width="5" stroke-linecap="round"/>
