  </g>

  <rect x="140" y="592" width="744" height="104" rx="28" fill="#7C3527"/>
  <text x="512" y="657" text-anchor="middle" class="h w" font-size="32" fill="#FFFFFF">必要な情報を、必要な時に、必要な分だけ</text>
