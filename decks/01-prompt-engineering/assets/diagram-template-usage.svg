<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}.a{fill:#7C3527}
    </style>
  </defs>

  <!-- 1: サッと頼む -->
  <g transform="translate(20 20)">
    <rect width="1100" height="220" rx="28" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="4"/>
    <circle cx="48" cy="48" r="25" fill="#FFFFFF" stroke="#E5A692" stroke-width="4"/>
    <text x="48" y="58" text-anchor="middle" class="h a" font-size="30">1</text>
    <text x="90" y="58" class="h a" font-size="38">サッと頼む</text>
    <text x="36" y="106" class="m" font-size="30">翻訳・言い換え</text>

    <rect x="355" y="30" width="250" height="102" rx="22" fill="#7C3527"/>
    <text x="480" y="72" text-anchor="middle" class="h w" font-size="32">やること</text>
    <text x="480" y="112" text-anchor="middle" class="h w" font-size="36">✓</text>
    <rect x="625" y="30" width="430" height="102" rx="22" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="4"/>
    <text x="840" y="92" text-anchor="middle" class="h m" font-size="31">ほかは省略してよい</text>
    <text x="355" y="184" class="h" font-size="31" fill="#B44A32">→ まずは1行で頼む</text>
  </g>

  <!-- 2: 資料を読ませる -->
  <g transform="translate(20 270)">
    <rect width="1100" height="220" rx="28" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="4"/>
    <circle cx="48" cy="48" r="25" fill="#FFFFFF" stroke="#E5A692" stroke-width="4"/>
    <text x="48" y="58" text-anchor="middle" class="h a" font-size="30">2</text>
    <text x="90" y="58" class="h a" font-size="38">資料を読ませる</text>
    <text x="36" y="106" class="m" font-size="30">要約・会議サマリー</text>

    <rect x="355" y="30" width="210" height="102" rx="22" fill="#7C3527"/>
    <text x="460" y="72" text-anchor="middle" class="h w" font-size="30">やること</text>
    <text x="460" y="112" text-anchor="middle" class="h w" font-size="36">✓</text>
    <rect x="580" y="30" width="210" height="102" rx="22" fill="#7C3527"/>
    <text x="685" y="72" text-anchor="middle" class="h w" font-size="30">材料</text>
    <text x="685" y="112" text-anchor="middle" class="h w" font-size="36">✓</text>
    <rect x="805" y="30" width="250" height="102" rx="22" fill="#7C3527"/>
    <text x="930" y="72" text-anchor="middle" class="h w" font-size="30">返し方</text>
    <text x="930" y="112" text-anchor="middle" class="h w" font-size="36">✓</text>
    <text x="355" y="184" class="h" font-size="31" fill="#B44A32">→ 読ませる範囲を区切る</text>
  </g>

  <!-- 3: かっちり仕上げる -->
  <g transform="translate(20 520)">
    <rect width="1100" height="220" rx="28" fill="#FFF2E8" stroke="#EDC9B4" stroke-width="4"/>
    <circle cx="48" cy="48" r="25" fill="#FFFFFF" stroke="#E5A692" stroke-width="4"/>
    <text x="48" y="58" text-anchor="middle" class="h a" font-size="30">3</text>
    <text x="90" y="58" class="h a" font-size="38">かっちり仕上げる</text>
    <text x="36" y="106" class="m" font-size="30">定型の仕事</text>

    <g font-size="27" text-anchor="middle">
      <rect x="355" y="30" width="132" height="102" rx="20" fill="#7C3527"/>
      <text x="421" y="74" class="h w">やること</text><text x="421" y="112" class="h w" font-size="34">✓</text>
      <rect x="497" y="30" width="132" height="102" rx="20" fill="#7C3527"/>
      <text x="563" y="74" class="h w">なぜ</text><text x="563" y="112" class="h w" font-size="34">✓</text>
      <rect x="639" y="30" width="132" height="102" rx="20" fill="#7C3527"/>
      <text x="705" y="74" class="h w">材料</text><text x="705" y="112" class="h w" font-size="34">✓</text>
      <rect x="781" y="30" width="132" height="102" rx="20" fill="#7C3527"/>
      <text x="847" y="74" class="h w">返し方</text><text x="847" y="112" class="h w" font-size="34">✓</text>
      <rect x="923" y="30" width="132" height="102" rx="20" fill="#7C3527"/>
      <text x="989" y="74" class="h w">守ること</text><text x="989" y="112" class="h w" font-size="34">✓</text>
    </g>
    <text x="355" y="184" class="h" font-size="31" fill="#B44A32">→ テンプレートにして使い回す</text>
  </g>

  <rect x="20" y="770" width="1100" height="70" rx="28" fill="#B44A32"/>
  <text x="570" y="817" text-anchor="middle" class="h w" font-size="36">迷う仕事ほど、必要な要素を足す</text>
</svg>
