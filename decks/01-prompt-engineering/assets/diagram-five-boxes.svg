<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs><style>.t{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;fill:#2B211D}.h{font-weight:700}.s{font-size:24px;fill:#6F5C52}.w{fill:#fff}.arr{stroke:#B44A32;stroke-width:5;fill:none;stroke-linecap:round}</style></defs>
  <rect width="1200" height="820" rx="46" fill="#FFF9F3"/>
  <text x="600" y="76" class="t h" font-size="38" text-anchor="middle">AIへの仕事依頼書</text>
  <g transform="translate(55 122)">
    <rect width="330" height="174" rx="28" fill="#F6E6CF"/><text x="34" y="55" class="t h" font-size="31">① やること</text><text x="34" y="108" class="t" font-size="27">要約する／分類する</text><text x="34" y="145" class="s">動詞で始める</text>
  </g>
  <g transform="translate(435 122)">
    <rect width="330" height="174" rx="28" fill="#FADFD5"/><text x="34" y="55" class="t h" font-size="31">② なぜ</text><text x="34" y="108" class="t" font-size="27">欠席者へ共有する</text><text x="34" y="145" class="s">使い道を1文で</text>
  </g>
  <g transform="translate(815 122)">
    <rect width="330" height="174" rx="28" fill="#FFF0E7"/><text x="34" y="55" class="t h" font-size="31">③ 材料</text><text x="34" y="108" class="t" font-size="27">会議メモを貼る</text><text x="34" y="145" class="s">ここから／ここまで</text>
  </g>
  <g transform="translate(245 350)">
    <rect width="330" height="174" rx="28" fill="#FCE9DC"/><text x="34" y="55" class="t h" font-size="31">④ 返し方</text><text x="34" y="108" class="t" font-size="27">4列の表にする</text><text x="34" y="145" class="s">次に使う形まで決める</text>
  </g>
  <g transform="translate(625 350)">
    <rect width="330" height="174" rx="28" fill="#F6E6CF"/><text x="34" y="55" class="t h" font-size="31">⑤ 守ること</text><text x="34" y="108" class="t" font-size="27">ない情報は作らない</text><text x="34" y="145" class="s">条件と理由をセット</text>
  </g>
  <path d="M385 209h50M765 209h50M600 296v54M575 325l25 26 25-26" class="arr"/>
  <rect x="170" y="610" width="860" height="126" rx="30" fill="#7C3527"/>
  <text x="600" y="666" class="w h" font-size="31" text-anchor="middle">最初から全部はいらない</text>
  <text x="600" y="708" class="w" font-size="27" text-anchor="middle">迷ったら「やること」と「返し方」の2つから</text>
</svg>
