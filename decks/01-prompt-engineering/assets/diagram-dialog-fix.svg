<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="860" viewBox="0 0 1140 860">
  <defs>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#2B211D}
      .h{font-weight:700}.m{fill:#6F5C52}.w{fill:#FFFFFF}.bad{fill:#A63D32}.good{fill:#247F7A}
    </style>
  </defs>

  <!-- ============ 1) AIの返答カード：下書き v1 ============ -->
  <g>
    <circle cx="66" cy="110" r="26" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="66" y="118" text-anchor="middle" class="h" font-size="22" fill="#7C3527">AI</text>

    <rect x="104" y="16" width="668" height="188" rx="28" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>

    <rect x="132" y="30" width="34" height="40" rx="4" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="140" y1="42" x2="162" y2="42" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="140" y1="50" x2="162" y2="50" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="140" y1="58" x2="156" y2="58" stroke="#EDC9B4" stroke-width="2"/>

    <text x="180" y="56" class="h" font-size="28">下書き v1</text>
    <text x="180" y="82" class="m" font-size="22">AIが作った最初の下書き</text>

    <rect x="132" y="98" width="608" height="88" rx="8" fill="#FFFFFF" stroke="#EDC9BB" stroke-width="2"/>
    <line x1="270" y1="98" x2="270" y2="186" stroke="#EDC9BB" stroke-width="1"/>
    <line x1="132" y1="142" x2="740" y2="142" stroke="#EDC9BB" stroke-width="1"/>

    <text x="201" y="126" text-anchor="middle" class="h" font-size="24">タイトル</text>
    <text x="286" y="126" font-size="24">秋の販促メール下書き</text>

    <text x="201" y="170" text-anchor="middle" class="h" font-size="24">期限</text>
    <rect x="278" y="148" width="70" height="30" rx="8" fill="#FADFD5" stroke="#B44A32" stroke-width="2"/>
    <text x="313" y="171" text-anchor="middle" class="h" font-size="26" fill="#B44A32">？</text>
  </g>

  <path d="M558,205 L582,205 L570,215 Z" fill="#B44A32"/>

  <!-- ============ 2) 曖昧な修正の吹き出し ============ -->
  <g>
    <rect x="460" y="216" width="580" height="150" rx="32" fill="#FFF2E8" stroke="#A63D32" stroke-width="3"/>
    <circle cx="1074" cy="291" r="26" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="1074" y="299" text-anchor="middle" class="h m" font-size="22">人</text>

    <rect x="452" y="206" width="96" height="32" rx="16" fill="#A63D32"/>
    <text x="500" y="228" text-anchor="middle" class="h w" font-size="18">曖昧な修正</text>

    <circle cx="502" cy="264" r="20" fill="#FFFFFF" stroke="#A63D32" stroke-width="5"/>
    <line x1="492" y1="254" x2="512" y2="274" stroke="#A63D32" stroke-width="5" stroke-linecap="round"/>
    <line x1="512" y1="254" x2="492" y2="274" stroke="#A63D32" stroke-width="5" stroke-linecap="round"/>

    <text x="540" y="278" class="h bad" font-size="26">うーん、もう一回やって</text>
    <line x1="540" y1="294" x2="1020" y2="294" stroke="#EDC9B4" stroke-width="1"/>
    <text x="540" y="318" class="m" font-size="22">どこが違うか伝わらない</text>
    <text x="540" y="344" class="m" font-size="22">→ 同じような答えが返る</text>
  </g>

  <path d="M558,367 L582,367 L570,377 Z" fill="#B44A32"/>

  <!-- ============ 3) 具体的な修正の吹き出し ============ -->
  <g>
    <rect x="460" y="378" width="580" height="140" rx="32" fill="#FFF2E8" stroke="#247F7A" stroke-width="3"/>
    <circle cx="1074" cy="448" r="26" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="1074" y="456" text-anchor="middle" class="h m" font-size="22">人</text>

    <rect x="452" y="370" width="96" height="32" rx="16" fill="#247F7A"/>
    <text x="500" y="392" text-anchor="middle" class="h w" font-size="18">具体的な修正</text>

    <circle cx="502" cy="427" r="19" fill="#FFFFFF" stroke="#247F7A" stroke-width="5"/>

    <text x="540" y="436" class="h good" font-size="25">表の『期限』列だけ、</text>
    <text x="540" y="466" class="h good" font-size="25">メモにある日付で埋め直して</text>
    <line x1="540" y1="480" x2="1020" y2="480" stroke="#BEE0DB" stroke-width="1"/>
    <text x="540" y="502" class="m" font-size="22">場所＋直し方を指定</text>
  </g>

  <path d="M558,519 L582,519 L570,529 Z" fill="#B44A32"/>

  <!-- ============ 4) AIの返答カード：下書き v2 ============ -->
  <g>
    <circle cx="66" cy="624" r="26" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="3"/>
    <text x="66" y="632" text-anchor="middle" class="h" font-size="22" fill="#7C3527">AI</text>

    <rect x="104" y="530" width="668" height="188" rx="28" fill="#FCE9DC" stroke="#E5A692" stroke-width="3"/>

    <circle cx="736" cy="560" r="23" fill="#FFFFFF" stroke="#247F7A" stroke-width="4"/>
    <path d="M723,560 L733,570 L753,546" fill="none" stroke="#247F7A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="132" y="544" width="34" height="40" rx="4" fill="#FFFFFF" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="140" y1="556" x2="162" y2="556" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="140" y1="564" x2="162" y2="564" stroke="#EDC9B4" stroke-width="2"/>
    <line x1="140" y1="572" x2="156" y2="572" stroke="#EDC9B4" stroke-width="2"/>

    <text x="180" y="570" class="h" font-size="28">下書き v2</text>
    <text x="180" y="596" class="m" font-size="22">期限が具体的な日付になった</text>

    <rect x="132" y="612" width="608" height="88" rx="8" fill="#FFFFFF" stroke="#EDC9BB" stroke-width="2"/>
    <line x1="270" y1="612" x2="270" y2="700" stroke="#EDC9BB" stroke-width="1"/>
    <line x1="132" y1="656" x2="740" y2="656" stroke="#EDC9BB" stroke-width="1"/>

    <text x="201" y="640" text-anchor="middle" class="h" font-size="24">タイトル</text>
    <text x="286" y="640" font-size="24">秋の販促メール下書き</text>

    <text x="201" y="684" text-anchor="middle" class="h" font-size="24">期限</text>
    <rect x="278" y="662" width="130" height="30" rx="8" fill="#FFFFFF" stroke="#247F7A" stroke-width="2"/>
    <text x="343" y="684" text-anchor="middle" class="h good" font-size="24">9月15日</text>
  </g>

  <path d="M555,721 L585,721 L570,735 Z" fill="#B44A32"/>

  <!-- ============ メッセージバンド ============ -->
  <rect x="40" y="736" width="1060" height="108" rx="32" fill="#7C3527"/>
  <text x="570" y="774" text-anchor="middle" class="h w" font-size="28">人どうしでも一発では伝わらない。</text>
  <text x="570" y="810" text-anchor="middle" class="h w" font-size="28">原因を切り分けたいときは、1項目ずつ直して比べる</text>
</svg>
