<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/></marker></defs><rect width="1024" height="768" fill="#FFF9F3"/><text x="512" y="62" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="32" font-weight="800" fill="#7C3527">禁止文が破られても、被害を出さない層を残す</text><rect x="52" y="190" width="260" height="230" rx="24" fill="#F6E6CF" stroke="#A63D32" stroke-width="3"/><text x="182.0" y="238" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">RULE TEXT</text><text x="182.0" y="282" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">『本番を触らない』</text><text x="182.0" y="312" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">行動を誘導する</text><text x="182.0" y="342" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">保証ではない</text><line x1="330" y1="306" x2="418" y2="306" stroke="#A63D32" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 8"/><rect x="430" y="150" width="180" height="310" rx="28" fill="#A63D32" stroke="#A63D32" stroke-width="0"/><text x="520" y="229" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">誤解</text><text x="520" y="281" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">過剰な自発性</text><text x="520" y="333" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">注入攻撃</text><text x="520" y="385" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">承認疲れ</text><line x1="626" y1="306" x2="710" y2="306" stroke="#247F7A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="724" y="120" width="240" height="125" rx="24" fill="#FADFD5" stroke="#247F7A" stroke-width="3"/><text x="844.0" y="168" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#247F7A">ENV SEPARATION</text><text x="844.0" y="212" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">本番資格情報を渡さない</text><rect x="724" y="285" width="240" height="125" rx="24" fill="#FFF2E8" stroke="#247F7A" stroke-width="3"/><text x="844.0" y="333" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#247F7A">PERMISSION</text><text x="844.0" y="377" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">危険操作は実行不能</text><rect x="724" y="450" width="240" height="125" rx="24" fill="#F6E6CF" stroke="#247F7A" stroke-width="3"/><text x="844.0" y="498" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#247F7A">BACKUP / VERIFY</text><text x="844.0" y="542" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">復旧と事後確認</text><rect x="132" y="555" width="520" height="100" rx="26" fill="#7C3527" stroke="#7C3527" stroke-width="0"/><text x="392" y="598" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">事故の確率 × 被害の上限</text><text x="392" y="633" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#F0B498">両方を下げるのがハーネス</text><text x="512" y="713" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">事例は製品一般の事故率ではなく、境界設計の必要性を示す</text></svg>