<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/>
    </marker>
  </defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="66" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="36" font-weight="800" fill="#7C3527">『完了』の言葉ではなく、実際の状態を見る</text>

  <rect x="54" y="190" width="250" height="244" rx="24" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/>
  <text x="179" y="252" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="38" font-weight="800" fill="#7C3527">自己申告</text>
  <text x="179" y="317" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="700" fill="#6F5C52">『完了しました』</text>
  <text x="179" y="371" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="700" fill="#6F5C52">状態は未確認</text>

  <line x1="322" y1="312" x2="389" y2="312" stroke="#A63D32" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="404" y="150" width="250" height="324" rx="28" fill="#247F7A"/>
  <text x="529" y="218" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">合否判定</text>
  <text x="529" y="286" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">テスト</text>
  <text x="529" y="342" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">DB・API</text>
  <text x="529" y="398" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">画面・成果物</text>

  <line x1="672" y1="312" x2="721" y2="312" stroke="#247F7A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="736" y="190" width="234" height="244" rx="24" fill="#FADFD5" stroke="#F0B498" stroke-width="3"/>
  <text x="853" y="252" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="38" font-weight="800" fill="#7C3527">最終状態</text>
  <text x="853" y="317" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="700" fill="#6F5C52">本当に反映</text>
  <text x="853" y="371" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="700" fill="#6F5C52">再現できる</text>

  <rect x="132" y="534" width="760" height="116" rx="28" fill="#7C3527"/>
  <text x="512" y="584" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">結果と過程を分けて記録する</text>
  <text x="512" y="629" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">最終状態（Outcome）＋ 実行履歴（Trace）</text>
  <text x="512" y="716" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="30" font-weight="700" fill="#6F5C52">検査そのものが壊れていないかも確認する</text>
</svg>
