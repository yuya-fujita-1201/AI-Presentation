<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/></marker></defs><rect width="1024" height="768" fill="#FFF9F3"/><text x="512" y="62" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#7C3527">評価は「AIがそう言ったか」ではなく、環境の最終状態を見る</text><rect x="62" y="188" width="260" height="250" rx="24" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/><text x="192.0" y="236" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">SELF REPORT</text><text x="192.0" y="280" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">『完了しました』</text><text x="192.0" y="310" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">説明は流暢</text><text x="192.0" y="340" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">状態は未確認</text><line x1="338" y1="312" x2="438" y2="312" stroke="#A63D32" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 8"/><rect x="452" y="148" width="250" height="330" rx="28" fill="#247F7A" stroke="#247F7A" stroke-width="0"/><text x="577" y="205" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">GRADERS</text><text x="577" y="260" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFF2E8">テスト</text><text x="577" y="312" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFF2E8">DB／APIの状態</text><text x="577" y="364" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFF2E8">画面・成果物</text><text x="577" y="416" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFF2E8">要件チェック</text><line x1="718" y1="312" x2="796" y2="312" stroke="#247F7A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="812" y="188" width="150" height="250" rx="24" fill="#FADFD5" stroke="#F0B498" stroke-width="3"/><text x="887.0" y="236" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">OUTCOME</text><text x="887.0" y="280" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">実在する</text><text x="887.0" y="310" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">再現できる</text><text x="887.0" y="340" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">副作用なし</text><rect x="164" y="548" width="696" height="100" rx="28" fill="#7C3527" stroke="#7C3527" stroke-width="0"/><text x="512" y="591" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">結果＋過程の両方を検査</text><text x="512" y="628" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#F0B498">最終状態（outcome）と実行軌跡（trace）を分けて評価</text><text x="512" y="708" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="600" fill="#6F5C52">テストが壊れていれば、0点はモデルではなく評価側の問題かもしれない</text></svg>