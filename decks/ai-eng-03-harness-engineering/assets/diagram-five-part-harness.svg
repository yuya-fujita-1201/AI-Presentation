<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/></marker></defs>
  <rect width="1024" height="768" fill="#FFF9F3"/>
  <text x="512" y="62" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="32" font-weight="800" fill="#7C3527">5つの設計責務を、一周させて点検する</text>
  <rect x="377" y="92" width="270" height="116" rx="25" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/>
  <text x="512" y="142" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#7C3527">1 仕事の契約</text>
  <text x="512" y="180" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="600" fill="#6F5C52">完了・停止・返し方</text>
  <rect x="657" y="252" width="270" height="116" rx="25" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/>
  <text x="792" y="302" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#7C3527">2 知識と状態</text>
  <text x="792" y="340" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="600" fill="#6F5C52">正本・現在地・引き継ぎ</text>
  <rect x="550" y="527" width="270" height="116" rx="25" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/>
  <text x="685" y="577" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#7C3527">3 道具</text>
  <text x="685" y="615" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="600" fill="#6F5C52">必要最小の操作口</text>
  <rect x="204" y="527" width="270" height="116" rx="25" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/>
  <text x="339" y="577" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#7C3527">4 ガードレール</text>
  <text x="339" y="615" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="600" fill="#6F5C52">権限・隔離・承認・回復</text>
  <rect x="97" y="252" width="270" height="116" rx="25" fill="#247F7A" stroke="#247F7A" stroke-width="3"/>
  <text x="232" y="302" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">5 証拠ループ</text>
  <text x="232" y="340" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">観測・検証・原因・記録</text>
  <line x1="552" y1="185" x2="682" y2="265" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="752" y1="345" x2="795" y2="540" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="645" y1="550" x2="449" y2="630" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="299" y1="550" x2="342" y2="355" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="272" y1="275" x2="402" y2="195" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="512" cy="390" r="92" fill="#7C3527"/>
  <text x="512" y="374" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">人が設計</text>
  <text x="512" y="410" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">AIが実行</text>
  <text x="512" y="702" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#247F7A">一周すると、再利用・改善・監査がしやすくなる</text>
</svg>
