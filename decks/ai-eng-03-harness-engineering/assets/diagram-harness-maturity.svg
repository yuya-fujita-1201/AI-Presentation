<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/></marker></defs><rect width="1024" height="768" fill="#FFF9F3"/><text x="512" y="60" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="32" font-weight="800" fill="#7C3527">一気に自律化せず、証拠と安全を足しながら育てる</text><rect x="72" y="520" width="190" height="130" rx="24" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/><text x="167.0" y="575" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="30" font-weight="800" fill="#7C3527">L0</text><text x="167.0" y="622" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#6F5C52">回答だけ</text><rect x="286" y="420" width="190" height="230" rx="24" fill="#FADFD5" stroke="#F0B498" stroke-width="3"/><text x="381.0" y="475" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="30" font-weight="800" fill="#7C3527">L1</text><text x="381.0" y="522" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#6F5C52">限定ツール</text><text x="381.0" y="558" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#6F5C52">＋承認</text><rect x="500" y="310" width="190" height="340" rx="24" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/><text x="595.0" y="365" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="30" font-weight="800" fill="#7C3527">L2</text><text x="595.0" y="412" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#6F5C52">状態・隔離</text><text x="595.0" y="448" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#6F5C52">＋自動検証</text><rect x="714" y="190" width="238" height="460" rx="24" fill="#247F7A" stroke="#247F7A" stroke-width="3"/><text x="833.0" y="245" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">L3</text><text x="833.0" y="292" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">継続運用</text><text x="833.0" y="328" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">＋評価・回復</text><text x="833.0" y="364" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">＋監査</text><text x="512" y="112" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="700" fill="#A63D32">教材用の成熟度モデル（論文のH0〜H3内訳ではない）</text><line x1="130" y1="690" x2="914" y2="690" stroke="#247F7A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="512" y="735" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="700" fill="#247F7A">自動化の量ではなく、検証可能性と被害上限で進める</text></svg>