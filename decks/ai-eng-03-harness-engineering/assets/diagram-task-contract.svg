nt-size="21" font-weight="500" fill="#6F5C52">権限不足・情報不足</text><line x1="750" y1="213" x2="706" y2="365" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/><rect x="64" y="500" width="230" height="130" rx="24" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/><text x="179.0" y="548" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">エスカレーション</text><text x="179.0" y="592" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">人の判断が必要な点</text><line x1="274" y1="565" x2="318" y2="420" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/><rect x="730" y="500" width="230" height="130" rx="24" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/><text x="845.0" y="548" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">返却形式</text><text x="845.0" y="592" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">成果物＋証拠＋未確認</text><line x1="750" y1="565" x2="706" y2="420" stroke="#6F5C52" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="9 8"/><text x="512" y="700" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" fill="#A63D32">曖昧な完了条件は、最後の「できました」を曖昧にする</text></svg>