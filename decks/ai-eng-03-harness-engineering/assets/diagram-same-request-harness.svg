<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F5C52"/></marker></defs><rect width="1024" height="768" fill="#FFF9F3"/><text x="512" y="60" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="31" font-weight="800" fill="#7C3527">同じ「レビューして」でも、ハーネスで仕事の終点が変わる</text><rect x="70" y="125" width="250" height="135" rx="24" fill="#F6E6CF" stroke="#F0B498" stroke-width="3"/><text x="195.0" y="173" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">PROMPT</text><text x="195.0" y="217" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">レビューして</text><text x="195.0" y="247" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">修正案を出して</text><rect x="387" y="125" width="250" height="135" rx="24" fill="#FADFD5" stroke="#F0B498" stroke-width="3"/><text x="512.0" y="173" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#7C3527">CONTEXT</text><text x="512.0" y="217" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">仕様・規約・差分</text><text x="512.0" y="247" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">過去の決定</text><rect x="704" y="125" width="250" height="135" rx="24" fill="#247F7A" stroke="#247F7A" stroke-width="3"/><text x="829.0" y="173" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">HARNESS</text><text x="829.0" y="217" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">編集・テスト・権限</text><text x="829.0" y="247" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="21" font-weight="500" fill="#6F5C52">ログ・承認・証拠</text><line x1="195" y1="280" x2="195" y2="360" stroke="#6F5C52" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="512" y1="280" x2="512" y2="360" stroke="#6F5C52" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="829" y1="280" x2="829" y2="360" stroke="#247F7A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="92" y="390" width="840" height="120" rx="28" fill="#FFF2E8" stroke="#F0B498" stroke-width="3"/><text x="512" y="438" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="800" fill="#7C3527">AIが判断し、必要な道具を使って作業する</text><text x="512" y="478" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="600" fill="#6F5C52">ただし、できること・止まる場所・検証方法は外側が決める</text><line x1="512" y1="528" x2="512" y2="594" stroke="#247F7A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="208" y="612" width="608" height="92" rx="28" fill="#7C3527" stroke="#7C3527" stroke-width="0"/><text x="512" y="652" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">検証済みの変更＋再現できる証拠</text><text x="512" y="684" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" fill="#F0B498">「回答」から「完了した仕事」へ</text></svg>