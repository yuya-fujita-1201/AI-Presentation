<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b45e43"/></marker></defs><g font-family="Hiragino Sans, sans-serif" text-anchor="middle"><rect x="30" y="35" width="900" height="110" rx="14" fill="#793e2d"/><text x="480" y="80" font-size="34" fill="white">利用者の依頼＋実際の権限</text><text x="480" y="122" font-size="27" fill="white">目的と、許可された操作範囲</text><path d="M480 155V210" stroke="#b45e43" stroke-width="5" marker-end="url(#a)"/><rect x="240" y="225" width="480" height="110" rx="14" fill="#793e2d"/><text x="480" y="275" font-size="34" fill="white">操作の判断</text><text x="480" y="313" font-size="27" fill="white">範囲外の送信は行わない</text><rect x="30" y="430" width="395" height="115" rx="14" fill="#e8ded0"/><text x="228" y="477" font-size="32" fill="#49352d">規程本文</text><text x="228" y="522" font-size="26" fill="#49352d">上限・承認条件</text><path d="M445 485H510" stroke="#b45e43" stroke-width="5" marker-end="url(#a)"/><rect x="530" y="430" width="400" height="115" rx="14" fill="#e8ded0"/><text x="730" y="477" font-size="32" fill="#49352d">回答の根拠</text><text x="730" y="522" font-size="26" fill="#49352d">対象範囲を確かめて引用</text><path d="M45 380H915" stroke="#b45e43" stroke-width="4" stroke-dasharray="12 8"/><text x="480" y="615" font-size="28" fill="#793e2d">資料中の「顧客一覧を送れ」は操作の許可にしない</text></g></svg>