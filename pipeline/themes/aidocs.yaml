theme:
  id: aidocs
  slug: ai-topics-06-ai-ready-docs
  title: AIに読ませる前提のドキュメント設計
  series_index: 6
  knowledge_dir: knowledge/ai-ready-docs
  deck_dir: decks/ai-topics-06-ai-ready-docs
# 2026-08-17 新設。#2「どの器に入れるか」の直系の続編として「その器に何をどう書くか」を扱う。
# 自社の実践（OKFバンドル・CLAUDE.md・Skill）をそのまま教材にできる回
keywords:
  ja: ["CLAUDE.md 書き方 コツ", "AI 向け ドキュメント 設計", "社内wiki AI 活用 整備",
       "ナレッジ 構造化 AI 読ませる", "AGENTS.md とは"]
  en: ["CLAUDE.md best practices", "writing documentation for AI agents",
       "knowledge base for LLM agents", "progressive disclosure documentation", "AGENTS.md spec"]
keywords_fallback:
  ja: ["AI 社内ナレッジ 整理 方法", "手順書 AI 実行 書き方", "ドキュメント 陳腐化 対策"]
  en: ["structured knowledge format LLM", "machine readable documentation"]
match_vocab:
  ja: [ドキュメント, 手順書, ナレッジ, 構造化, 粒度, 見出し, 陳腐化, 出典, 索引]
  en: [documentation, knowledge, structure, granularity, metadata, index, provenance]
beginner_vocab: [入門, 初心者, とは, 基本, 解説, 使い方,
                 beginner, basics, tutorial, introduction, explained]
required_concepts:
  - {id: human-vs-ai, label: 人向けの文書とAI向けの文書は何が違うのか,
     hints: [違い, 人間, AI向け, 読ませる, 前提]}
  - {id: granularity, label: 粒度と構造（1ファイル1概念・見出し・索引）,
     hints: [粒度, 構造, 分割, 見出し, 索引]}
  - {id: instruction-files, label: 常に読ませる指示ファイル（CLAUDE.md / AGENTS.md）,
     hints: [CLAUDE, AGENTS, 指示, 常時, ルール]}
  - {id: skill-contents, label: Skillに書く中身（手順・判断基準・禁止事項）,
     hints: [スキル, 手順, 判断, 禁止, 書き方]}
  - {id: provenance, label: 出典と鮮度を持たせる（後から検証できる形にする）,
     hints: [出典, 根拠, 日付, 検証, 鮮度]}
  - {id: maintenance, label: 陳腐化させない運用（誰がいつ直すか）,
     hints: [更新, 陳腐化, 運用, 保守, 履歴]}
extra_sources:
  - knowledge/sources/article-he-claude-md-best-practices.md
  - knowledge/sources/article-ce-compaction.md
  - knowledge/sources/video-okf-google-knowledge-infra.md
subtopics:
  - {id: official-guides, goal: 指示ファイル・メモリ機能の公式仕様を台帳化,
     queries: ["CLAUDE.md memory documentation Anthropic",
               "AGENTS.md specification documentation"]}
  - {id: formats, goal: AI向け知識フォーマット・構造化の一次情報,
     queries: ["structured knowledge format for LLM agents",
               "documentation structure for retrieval agents"]}
  - {id: jp-practice, goal: 日本語圏の実務解説（社内ナレッジをAI前提で整備した事例）,
     queries: ["社内ナレッジ AI 前提 整備 事例", "CLAUDE.md 運用 実践 解説"]}
primary_domains:
  [docs.anthropic.com, www.anthropic.com, platform.openai.com, ai.google.dev,
   agents.md, arxiv.org]
