theme:
  id: sec
  slug: ai-topics-05-ai-security
  title: プロンプトインジェクションとAIセキュリティ
  series_index: 5
  knowledge_dir: knowledge/ai-security
  deck_dir: decks/ai-topics-05-ai-security
# 2026-08-17 新設。社内導入の可否判断で必ず問われる領域。既存の
# context-engineering/security-and-trust-boundaries.md と重複しないよう、
# 攻撃の実際・権限設計・運用ルールという「守り方」に軸を置く
keywords:
  ja: ["プロンプトインジェクション とは 対策", "AI 情報漏洩 対策 社内利用",
       "AIエージェント 権限 設計 安全", "間接プロンプトインジェクション 事例",
       "生成AI セキュリティ リスク 企業"]
  en: ["prompt injection defense", "indirect prompt injection agent",
       "AI agent security sandbox", "OWASP top 10 LLM applications", "agent permission design"]
keywords_fallback:
  ja: ["AI 社内規程 セキュリティ", "エージェント 事故 事例 削除", "AI サンドボックス 隔離"]
  en: ["LLM data exfiltration attack", "tool poisoning MCP security"]
match_vocab:
  ja: [インジェクション, 権限, 境界, 隔離, 漏洩, 攻撃, 承認, サンドボックス, 監査]
  en: [injection, permission, boundary, sandbox, exfiltration, attack, approval, audit]
beginner_vocab: [入門, 初心者, とは, 基本, 解説, 使い方,
                 beginner, basics, tutorial, introduction, explained]
required_concepts:
  - {id: injection-basics, label: プロンプトインジェクションとは何か（なぜ防ぎきれないのか）,
     hints: [インジェクション, 攻撃, 仕組み, とは]}
  - {id: direct-indirect, label: 直接と間接の違い（読ませた文書が指示になる）,
     hints: [間接, 直接, 文書, Web, 埋め込ま]}
  - {id: trust-boundary, label: 信頼境界の引き方（外部由来のデータは指示ではない）,
     hints: [境界, 信頼, 外部, データ, 区別]}
  - {id: least-privilege, label: 権限の最小化とサンドボックス,
     hints: [権限, 最小, 隔離, サンドボックス, 制限]}
  - {id: incidents, label: 実際に起きた事故から学ぶ,
     hints: [事故, 事例, 削除, 漏洩, インシデント]}
  - {id: org-rules, label: 社内で運用するときのルール設計,
     hints: [規程, ルール, 社内, 運用, 承認]}
extra_sources:
  - knowledge/sources/article-ce-replit-production-database-incident.md
  - knowledge/sources/issue-ce-gemini-cli-4586.md
  - knowledge/sources/article-he-claude-code-permissions-admin.md
subtopics:
  - {id: official-guides, goal: ベンダー公式のセキュリティ指針・権限モデルを台帳化,
     queries: ["Anthropic prompt injection mitigation documentation",
               "Claude Code security permissions documentation"]}
  - {id: standards, goal: 標準・ガイドライン側の一次情報,
     queries: ["OWASP top 10 for LLM applications", "NIST AI risk management framework"]}
  - {id: research, goal: 攻撃手法と防御の研究,
     queries: ["indirect prompt injection attack arxiv", "agent security benchmark arxiv"]}
primary_domains:
  [docs.anthropic.com, www.anthropic.com, platform.openai.com, owasp.org,
   nist.gov, arxiv.org, learn.microsoft.com]
