theme:
  id: evals
  slug: ai-topics-04-evals
  title: 評価とEvals（「良くなった」をどう測るか）
  series_index: 4
  knowledge_dir: knowledge/evaluation
  deck_dir: decks/ai-topics-04-evals
# 2026-08-17 新設。このパイプライン自身が「同じ内容で9点と6点に振れる」採点者ばらつきを
# 実測しているため、LLM-as-a-Judgeの限界を体験に基づいて扱えるのが強み
keywords:
  ja: ["LLM 評価 方法 入門", "LLM as a judge とは", "AI 出力 品質 測定 方法",
       "プロンプト 評価 データセット 作り方", "AI 精度 比較 やり方"]
  en: ["LLM evaluation guide", "LLM as a judge bias study",
       "eval dataset design", "rubric based grading LLM", "regression testing LLM"]
keywords_fallback:
  ja: ["生成AI 品質 基準 業務", "AI 出力 チェック 自動化", "評価指標 生成AI 選び方"]
  en: ["golden dataset LLM eval", "pairwise comparison evaluation LLM"]
match_vocab:
  ja: [評価, 採点, 指標, 基準, ルーブリック, テストセット, 正解, 比較, ばらつき]
  en: [eval, judge, rubric, metric, benchmark, dataset, grading, variance]
beginner_vocab: [入門, 初心者, とは, 基本, 解説, 使い方,
                 beginner, basics, tutorial, introduction, explained]
required_concepts:
  - {id: why-eval, label: なぜ評価が要るのか（感想で判断すると改善が止まる）,
     hints: [評価, なぜ, 必要, 感想, 改善]}
  - {id: eval-types, label: 評価の種類（機械的な合否・人手・モデルによる採点）,
     hints: [種類, 自動, 人手, 機械, 分類]}
  - {id: llm-as-judge, label: LLM-as-a-Judgeの作り方と限界（ばらつき・自己甘さ）,
     hints: [judge, 採点者, ばらつき, 甘, バイアス]}
  - {id: rubric-design, label: ルーブリックの設計（何を何点で測るか）,
     hints: [ルーブリック, 基準, 項目, 配点, 設計]}
  - {id: dataset, label: テストセットの作り方（少数でも効く作り方）,
     hints: [データセット, テストセット, 事例, 正解, 収集]}
  - {id: regression, label: 継続的に測る（変更で悪くなっていないか）,
     hints: [回帰, 継続, 定点, 監視, 比較]}
extra_sources:
  - knowledge/sources/article-le-self-refine.md
  - knowledge/sources/article-le-evaluator-optimizer.md
  - knowledge/sources/article-ge-mast-multi-agent-failures.md
subtopics:
  - {id: official-guides, goal: ベンダー公式の評価ガイド・採点設計の一次情報,
     queries: ["Anthropic evaluation guide documentation",
               "OpenAI evals documentation guide"]}
  - {id: research, goal: LLM-as-a-Judgeのバイアス・信頼性の研究,
     queries: ["LLM as a judge bias position arxiv",
               "judge agreement human evaluation arxiv"]}
  - {id: jp-practice, goal: 日本語圏の実務解説（業務でのAI品質評価の実践）,
     queries: ["LLM 評価 実践 業務 解説", "生成AI 品質評価 事例 日本語"]}
primary_domains:
  [docs.anthropic.com, www.anthropic.com, platform.openai.com, ai.google.dev, arxiv.org]
