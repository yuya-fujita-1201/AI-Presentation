theme:
  id: rag
  slug: ai-topics-01-rag
  title: RAG（検索拡張生成）
  series_index: 1
  knowledge_dir: knowledge/rag
  deck_dir: decks/ai-topics-01-rag
# 2026-08-17 新設。9月からの実務トラック第1弾。既存の context-engineering に
# retrieval-memory-compaction-cache.md 等で部分的に触れているため、そこと重複しない
# 「検索の作り方・失敗の直し方・評価」に軸を置く
keywords:
  ja: ["RAG とは 初心者", "検索拡張生成 仕組み 解説", "社内文書 AI 検索 構築",
       "ベクトル検索 埋め込み とは", "RAG 精度 上がらない 原因"]
  en: ["RAG explained beginners", "retrieval augmented generation how it works",
       "chunking strategy RAG", "hybrid search reranking RAG", "RAG evaluation metrics"]
keywords_fallback:
  ja: ["埋め込みモデル 選び方", "RAG チャンク 分割 コツ", "GraphRAG とは"]
  en: ["vector database basics", "RAG failure modes", "agentic RAG 2026"]
match_vocab:
  ja: [検索, 検索拡張, 埋め込み, ベクトル, チャンク, 再ランキング, 根拠, 出典, 知識ベース]
  en: [RAG, retrieval, embedding, vector, chunking, reranking, grounding, "knowledge base"]
beginner_vocab: [入門, 初心者, とは, 基本, 解説, 使い方,
                 beginner, basics, tutorial, introduction, explained]
required_concepts:
  - {id: what-is-rag, label: RAGとは何か（なぜ丸暗記させないのか）,
     hints: [RAG, 検索拡張, とは, 仕組み]}
  - {id: pipeline-anatomy, label: 取り込み→分割→埋め込み→検索→生成の流れ,
     hints: [チャンク, 埋め込み, インデックス, 検索, 生成]}
  - {id: retrieval-quality, label: 検索が当たらない原因と直し方（ハイブリッド・再ランキング）,
     hints: [ハイブリッド, キーワード, 再ランキング, rerank, 精度]}
  - {id: grounding, label: 出典を答えに結びつける（根拠提示と引用）,
     hints: [出典, 根拠, 引用, grounding, 幻覚]}
  - {id: evaluation, label: RAGの評価（何を測れば良くなったと言えるか）,
     hints: [評価, 指標, 再現率, 正解, テスト]}
  - {id: when-not-to-rag, label: RAGを使わない判断（長文投入・ファインチューニングとの比較）,
     hints: [使わない, 比較, ファインチューニング, コンテキスト, 判断]}
extra_sources:
  - knowledge/sources/article-ce-compaction.md
  - knowledge/sources/docs-ce-anthropic-manage-tool-context.md
  - knowledge/sources/article-ge-anthropic-multi-agent-research-system.md
subtopics:
  - {id: official-guides, goal: ベンダー公式が示すRAG/検索設計の一次情報を台帳化,
     queries: ["Anthropic retrieval augmented generation guide",
               "OpenAI retrieval file search documentation",
               "Google AI grounding documentation"]}
  - {id: research, goal: RAGの原典と失敗分析・評価手法の研究,
     queries: ["retrieval augmented generation original paper Lewis",
               "RAG failure points survey arxiv", "RAGAS evaluation framework arxiv"]}
  - {id: jp-practice, goal: 日本語圏の実務解説（社内文書RAGの構築と精度改善）,
     queries: ["社内文書 RAG 構築 実践 解説", "RAG 精度改善 チャンク 再ランキング"]}
primary_domains:
  [docs.anthropic.com, www.anthropic.com, platform.openai.com, ai.google.dev,
   arxiv.org, cloud.google.com, learn.microsoft.com]
