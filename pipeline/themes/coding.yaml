theme:
  id: coding
  slug: ai-topics-03-ai-coding
  title: AIコーディング実務（Claude Code / Codex）
  series_index: 3
  knowledge_dir: knowledge/ai-coding
  deck_dir: decks/ai-topics-03-ai-coding
# 2026-08-17 新設。ツールの機能紹介ではなく「実際の開発フローがどう変わるか」に軸を置く。
# 受講者にSE・エンジニアが多いため、レビュー・テスト・権限まで含めた運用の話を厚くする
keywords:
  ja: ["Claude Code 使い方 実務", "Codex 使い方 解説", "AIコーディング 開発フロー 変わる",
       "AI ペアプログラミング 実践", "AI コードレビュー 運用"]
  en: ["Claude Code workflow best practices", "AI coding agent real workflow",
       "codex cli tutorial", "agentic coding review process"]
keywords_fallback:
  ja: ["バイブコーディング 実践 注意点", "AI 生成コード テスト 品質", "AI 開発 生産性 実測"]
  en: ["AI pair programming productivity study", "code review AI generated code"]
match_vocab:
  ja: [コーディング, 実装, レビュー, テスト, 差分, コミット, 権限, 開発フロー]
  en: [coding, agent, review, test, diff, commit, permission, workflow]
beginner_vocab: [入門, 初心者, とは, 基本, 解説, 使い方,
                 beginner, basics, tutorial, introduction, explained]
required_concepts:
  - {id: what-changes, label: 何が変わるのか（補完から委任へ）,
     hints: [変わる, 委任, 補完, 自動, エージェント]}
  - {id: basic-loop, label: 基本の回し方（指示→実行→確認の1サイクル）,
     hints: [手順, 流れ, サイクル, 使い方, 基本]}
  - {id: review-and-test, label: 生成コードのレビューとテスト,
     hints: [レビュー, テスト, 品質, 確認, 検証]}
  - {id: permission-safety, label: 権限と安全（どこまで自動で実行させるか）,
     hints: [権限, 承認, 安全, 危険, 制限]}
  - {id: fit-and-unfit, label: 向く仕事・向かない仕事,
     hints: [向, 苦手, 得意, 適さ, 限界]}
  - {id: team-adoption, label: チームで使う（規約・共有・引き継ぎ）,
     hints: [チーム, 共有, 規約, 導入, 標準]}
extra_sources:
  - knowledge/sources/article-le-claude-code-best-practices.md
  - knowledge/sources/article-he-claude-md-best-practices.md
  - knowledge/sources/article-he-agent-sdk-overview.md
subtopics:
  - {id: official-guides, goal: ベンダー公式の実務ガイド・ベストプラクティスを台帳化,
     queries: ["Claude Code best practices documentation",
               "OpenAI codex usage guide documentation"]}
  - {id: research, goal: AI支援開発の実測・失敗分析の研究,
     queries: ["AI coding assistant productivity study arxiv",
               "code quality LLM generated study"]}
  - {id: jp-practice, goal: 日本語圏の実務解説（現場の運用と失敗談）,
     queries: ["Claude Code 実務 運用 解説", "AIコーディング 現場 失敗 学び"]}
primary_domains:
  [docs.anthropic.com, www.anthropic.com, platform.openai.com, developers.openai.com,
   ai.google.dev, arxiv.org]
