<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="490" viewBox="0 0 1136 490">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241246"/>
      <stop offset="0.42" stop-color="#5B2A86"/>
      <stop offset="0.72" stop-color="#B34597"/>
      <stop offset="0.9" stop-color="#EE7E8B"/>
      <stop offset="1" stop-color="#F7B267"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7B3" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFC978" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC978" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A3F86"/>
      <stop offset="0.5" stop-color="#4C2566"/>
      <stop offset="1" stop-color="#2A1748"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E3E94"/>
      <stop offset="1" stop-color="#5A3186"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1136" height="490" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect x="0" y="0" width="1136" height="356" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#FFFFFF" opacity="0.8">
      <circle cx="120" cy="54" r="1.6"/><circle cx="240" cy="96" r="1.2"/><circle cx="360" cy="42" r="1.7"/>
      <circle cx="520" cy="70" r="1.1"/><circle cx="90" cy="150" r="1.3"/><circle cx="300" cy="150" r="1.1"/>
      <circle cx="980" cy="60" r="1.6"/><circle cx="1060" cy="120" r="1.2"/><circle cx="890" cy="100" r="1.3"/>
      <circle cx="180" cy="210" r="1.1"/><circle cx="430" cy="120" r="1.2"/>
    </g>

    <!-- sun -->
    <circle cx="762" cy="286" r="150" fill="url(#sunGlow)"/>
    <circle cx="762" cy="286" r="62" fill="#FFE2A8"/>

    <!-- clouds -->
    <g fill="#F5C6A8" opacity="0.55" filter="url(#soft)">
      <ellipse cx="250" cy="150" rx="120" ry="20"/>
      <ellipse cx="330" cy="170" rx="90" ry="16"/>
      <ellipse cx="930" cy="200" rx="140" ry="22"/>
      <ellipse cx="560" cy="120" rx="80" ry="14"/>
    </g>

    <!-- far hills -->
    <path d="M0 300 C 160 250, 320 280, 480 262 C 660 242, 820 296, 1000 268 C 1080 256, 1120 274, 1136 268 L1136 356 L0 356 Z" fill="url(#hillFar)" opacity="0.9"/>

    <!-- back skyline -->
    <g fill="#432A72" opacity="0.92">
      <rect x="40" y="250" width="46" height="106"/>
      <rect x="96" y="224" width="34" height="132"/>
      <rect x="150" y="268" width="40" height="88"/>
      <rect x="1000" y="240" width="42" height="116"/>
      <rect x="1052" y="214" width="34" height="142"/>
      <rect x="936" y="262" width="44" height="94"/>
      <rect x="596" y="236" width="30" height="120"/>
      <rect x="636" y="258" width="34" height="98"/>
    </g>

    <!-- front skyline -->
    <g fill="#291A45">
      <rect x="70" y="284" width="72" height="72" rx="3"/>
      <rect x="156" y="238" width="60" height="118" rx="3"/>
      <rect x="230" y="276" width="80" height="80" rx="3"/>
      <rect x="326" y="210" width="66" height="146" rx="3"/>
      <rect x="406" y="262" width="74" height="94" rx="3"/>
      <rect x="496" y="228" width="58" height="128" rx="3"/>
      <rect x="700" y="252" width="70" height="104" rx="3"/>
      <rect x="786" y="196" width="72" height="160" rx="4"/>
      <rect x="872" y="248" width="64" height="108" rx="3"/>
      <rect x="956" y="272" width="88" height="84" rx="3"/>
      <rect x="574" y="270" width="120" height="86" rx="3"/>
    </g>

    <!-- lit windows -->
    <g fill="#FFCF6E" opacity="0.9">
      <rect x="172" y="252" width="7" height="9"/><rect x="186" y="252" width="7" height="9"/><rect x="200" y="252" width="7" height="9"/>
      <rect x="172" y="272" width="7" height="9"/><rect x="200" y="272" width="7" height="9"/><rect x="186" y="292" width="7" height="9"/>
      <rect x="340" y="226" width="8" height="10"/><rect x="356" y="226" width="8" height="10"/><rect x="372" y="226" width="8" height="10"/>
      <rect x="340" y="248" width="8" height="10"/><rect x="372" y="248" width="8" height="10"/><rect x="356" y="270" width="8" height="10"/>
      <rect x="340" y="292" width="8" height="10"/><rect x="372" y="292" width="8" height="10"/>
      <rect x="800" y="212" width="8" height="10"/><rect x="816" y="212" width="8" height="10"/><rect x="832" y="212" width="8" height="10"/>
      <rect x="800" y="234" width="8" height="10"/><rect x="832" y="234" width="8" height="10"/><rect x="816" y="256" width="8" height="10"/>
      <rect x="800" y="278" width="8" height="10"/><rect x="832" y="278" width="8" height="10"/><rect x="816" y="300" width="8" height="10"/>
      <rect x="510" y="244" width="7" height="9"/><rect x="524" y="244" width="7" height="9"/><rect x="510" y="266" width="7" height="9"/><rect x="538" y="266" width="7" height="9"/>
      <rect x="596" y="286" width="8" height="9"/><rect x="614" y="286" width="8" height="9"/><rect x="632" y="286" width="8" height="9"/><rect x="650" y="286" width="8" height="9"/><rect x="668" y="286" width="8" height="9"/>
      <rect x="596" y="308" width="8" height="9"/><rect x="632" y="308" width="8" height="9"/><rect x="668" y="308" width="8" height="9"/>
    </g>

    <!-- water -->
    <rect x="0" y="356" width="1136" height="134" fill="url(#water)"/>
    <!-- sun reflection -->
    <g fill="#FFDFA0" opacity="0.5">
      <rect x="726" y="362" width="72" height="6" rx="3"/>
      <rect x="734" y="376" width="56" height="6" rx="3"/>
      <rect x="722" y="392" width="80" height="6" rx="3"/>
      <rect x="738" y="410" width="48" height="5" rx="2.5"/>
      <rect x="728" y="428" width="68" height="5" rx="2.5"/>
    </g>
    <!-- water highlights -->
    <g fill="#C77BB4" opacity="0.35">
      <rect x="120" y="380" width="140" height="5" rx="2.5"/>
      <rect x="300" y="404" width="120" height="5" rx="2.5"/>
      <rect x="900" y="388" width="150" height="5" rx="2.5"/>
      <rect x="180" y="440" width="110" height="5" rx="2.5"/>
      <rect x="940" y="446" width="120" height="5" rx="2.5"/>
    </g>

    <!-- birds -->
    <g stroke="#2A1748" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M150 96 q 10 -9 20 0 q 10 -9 20 0"/>
      <path d="M210 120 q 8 -7 16 0 q 8 -7 16 0"/>
      <path d="M980 150 q 9 -8 18 0 q 9 -8 18 0"/>
    </g>
  </g>
</svg>
